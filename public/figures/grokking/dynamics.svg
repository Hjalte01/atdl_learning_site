<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">06 / Constraints select structure; slow modes set a timescale</title><desc id="d">Analytical path, not the training algorithm. Numerical values are illustrative.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">06 / Constraints select structure; slow modes set a timescale</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Training equal-sum pairs</text><text x="42" y="165" font-size="16">Build A from +1,+1,−1,−1</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">Solve A R = 0</text><text x="362" y="165" font-size="16">Nullity 2 → affine embeddings</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="132" font-size="19">Linear relaxation</text><text x="682" y="165" font-size="16">Mode ∝ exp(−λt)</text><rect x="30" y="270" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="302" font-size="19">η = 0.001; λ3 = 0.2</text><text x="42" y="335" font-size="16">One e-fold: 5,000 steps</text><path d="M310 315 L345 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">After 10,000 steps</text><text x="362" y="335" font-size="16">Mode amplitude ≈ 0.135</text><path d="M630 315 L665 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="270" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="302" font-size="19">After 15,000 steps</text><text x="682" y="335" font-size="16">Mode amplitude ≈ 0.050</text><text x="30" y="415" font-size="17">The normalized quotient flow has an additional radial term; see the derivation in the guide.</text></g></svg>