<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">03 / Two optimizers, one prediction path</title><desc id="d">Train both modules; freeze both for held-out inference.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">03 / Two optimizers, one prediction path</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Train pair + target</text><text x="42" y="165" font-size="16">Fixed split and target vectors</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">A → B → C → D</text><text x="362" y="165" font-size="16">Forward pass and task loss</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="132" font-size="19">E · Adam / AdamW</text><text x="682" y="165" font-size="16">Update table / decoder</text><rect x="30" y="270" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="302" font-size="19">Held-out pair only</text><text x="42" y="335" font-size="16">Freeze E and θ</text><path d="M310 315 L345 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">A → B → C</text><text x="362" y="335" font-size="16">No loss or parameter update</text><path d="M630 315 L665 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="270" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="302" font-size="19">Prediction</text><text x="682" y="335" font-size="16">Score with label afterwards</text><text x="30" y="415" font-size="18">Optimizer moments and weights carry between training steps; inference receives no target.</text></g></svg>