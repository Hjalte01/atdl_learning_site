<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">01 / The answer table is fitted before the rule is reusable</title><desc id="d">Conceptual checkpoints, not measured times.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">01 / The answer table is fitted before the rule is reusable</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Initialization</text><text x="42" y="165" font-size="16">Random symbol embeddings</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">Memorization</text><text x="362" y="165" font-size="16">Training answers correct</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="132" font-size="19">Generalization</text><text x="682" y="165" font-size="16">Held-out answers improve</text><rect x="30" y="270" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="302" font-size="19">Training accuracy low</text><text x="42" y="335" font-size="16">No useful decoder yet</text><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">Validation accuracy low</text><text x="362" y="335" font-size="16">Decoder fits arbitrary sums</text><rect x="670" y="270" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="302" font-size="19">Structure emerges</text><text x="682" y="335" font-size="16">Pairs share decoder inputs</text><text x="30" y="415" font-size="18">Same examples throughout; embeddings and decoder keep evolving.</text></g></svg>