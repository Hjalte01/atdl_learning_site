<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">04 / Coincident midpoints mean identical sums</title><desc id="d">Affine embedding example E_k = (k,1); schematic positions.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">04 / Coincident midpoints mean identical sums</text><path d="M60 190 L880 190" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="170" cy="190" r="9" fill="#218c77"/><text x="152" y="232" font-size="20">E5</text><circle cx="320" cy="190" r="9" fill="#218c77"/><text x="302" y="232" font-size="20">E6</text><circle cx="620" cy="190" r="9" fill="#218c77"/><text x="602" y="232" font-size="20">E8</text><circle cx="770" cy="190" r="9" fill="#218c77"/><text x="752" y="232" font-size="20">E9</text><circle cx="470" cy="190" r="8" fill="#bc6d28"/><path d="M170 170 Q470 45 770 170 M320 175 Q470 100 620 175" fill="none" stroke="#8264b0" stroke-width="3"/><text x="380" y="265" font-size="18">Shared midpoint E7</text><rect x="30" y="310" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="342" font-size="19">Train: (6,8)</text><text x="42" y="375" font-size="16">E6 + E8 = 2E7 = (14,2)</text><rect x="490" y="310" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="342" font-size="19">Held out: (5,9)</text><text x="502" y="375" font-size="16">E5 + E9 = 2E7 = (14,2)</text></g></svg>