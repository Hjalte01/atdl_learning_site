<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">07 / Four outcomes within an observation window</title><desc id="d">Conceptual phase labels; these boxes are not measured phase boundaries.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">07 / Four outcomes within an observation window</text><rect x="30" y="100" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Comprehension</text><text x="42" y="165" font-size="16">Train succeeds; validation soon</text><rect x="490" y="100" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="132" font-size="19">Grokking</text><text x="502" y="165" font-size="16">Train succeeds; validation much later</text><rect x="30" y="270" width="420" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="42" y="302" font-size="19">Memorization</text><text x="42" y="335" font-size="16">Train succeeds; validation not reached</text><rect x="490" y="270" width="420" height="90" rx="12" fill="#e4e9ef" stroke="#71849a"/><text x="502" y="302" font-size="19">Confusion</text><text x="502" y="335" font-size="16">Training criterion not reached</text><text x="30" y="415" font-size="18">Rate and decay change the balance. Strong restriction can also prevent fitting.</text></g></svg>