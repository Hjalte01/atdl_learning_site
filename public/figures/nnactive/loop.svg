<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="ACDC Low: five evaluated budgets, 150 queried patches">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">ACDC Low: five evaluated budgets, 150 queried patches</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">SHARED START: labels are selected before the first model</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">30 patches = 20% of 150</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">All classes in ≥ 2 patches</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Remainder: Random 33% FG</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Same initialization protocol</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Train / evaluate at 30</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Four data-related seeds</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">ITERATE: acquire 30 more patches between evaluated budgets</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Predict → score → select</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Reveal 30 new patch masks</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Retain old labels / locations</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Retrain from scratch</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Evaluate at 60, 90, 120</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Then final model at 150</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">DESIGN PARAMETERS: query size and patch size differ</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Query size = 30 patches</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Geometry = 4 × 40 × 40</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Smaller batch: more rounds</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Halving axes: 1/8 voxels</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Effort ≠ patch count alone</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">Compute and FG also matter</text>
</svg>
