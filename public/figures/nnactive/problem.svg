<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Same patch count, different information and human effort">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Same patch count, different information and human effort</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">PLAIN RANDOM: a large background class dominates the volume</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Random location in scan</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Often empty background</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Cheap annotation</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Little foreground learned</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Low Dice at equal patches</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">A weak baseline for AL</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">FOREGROUND-AWARE RANDOM: simulate rough structure screening</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Some fully random patches</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Some foreground / borders</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Diverse foreground classes</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">More delineation work</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Stronger Dice baseline</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Still count effort separately</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">UNCERTAINTY: model predictions guide annotation</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Score ambiguous regions</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">May repeat similar borders</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Annotate selected patches</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">More compute per round</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Test across tasks / budgets</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">No universal superiority</text>
</svg>
