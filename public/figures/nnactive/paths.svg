<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Training, selection and test inference have different roles">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Training, selection and test inference have different roles</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN: fit every model using only available segmentation targets</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Image crop + partial mask</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Unlabeled image context</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Partial supervised loss</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Gradient updates full model</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Weights replaced each round</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">No frozen CLIP backbone</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">SELECT: fixed ensemble predicts pool regions</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">p₁ … p₅ volumes</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Compute U(v), aggregate</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Overlap + rank / perturb</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Acquire new segmentation</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Append labels to state</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">No gradient during ranking</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">TEST: fixed fitted models segment new complete scans</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Held-out scan X</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">nnU-Net patchwise inference</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Voxel class prediction</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Compare to dense test mask</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Mean Dice evaluates quality</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">No annotation or retraining</text>
</svg>
