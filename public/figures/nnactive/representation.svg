<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Missing target is distinct from known background">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Missing target is distinct from known background</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY FOUR-VOXEL VIEW: a projection of a 3D training patch</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Image visible at all voxels</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">[x₁, x₂, x₃, x₄]</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Targets [FG, BG, ?, ?]</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Valid mask [1, 1, 0, 0]</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Loss only at v₁ and v₂</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Context can use all x</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">TEACHING CE COMPONENT: not the full nnU-Net loss recipe</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">p(FG | v₁) = .8</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">−ln(.8) = .2231</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">p(BG | v₂) = .9</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">−ln(.9) = .1054</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Mean labeled CE = .1643</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">No target loss at v₃, v₄</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">REGION SAMPLING: retain labels without forcing crop centers</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">At least one labeled voxel</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Inside the training crop</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Random valid position</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">More surrounding context</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Query size ≠ forward size</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">Both are 3D patches</text>
</svg>
