<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-label="The predictor stays or changes depending on the task">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">The predictor stays or changes depending on the task</text>
<text x="30" y="80" fill="#c5d5ee" font-family="sans-serif" font-size="18">DENSE PROBE: frozen representation, trained supervised head</text>
<rect x="30" y="95" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="120" fill="white" font-family="sans-serif" font-size="17">Full image → 2D tokenizer</text>
<text x="42" y="143" fill="white" font-family="sans-serif" font-size="17">Frozen final-layer encoder</text>
<path d="M308,140 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="95" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="120" fill="white" font-family="sans-serif" font-size="17">Train linear dense head</text>
<text x="352" y="143" fill="white" font-family="sans-serif" font-size="17">Depth: learned BatchNorm</text>
<path d="M618,140 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="95" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="120" fill="white" font-family="sans-serif" font-size="17">New image → feature → head</text>
<text x="662" y="143" fill="white" font-family="sans-serif" font-size="17">No SSL mask needed</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">ACTION ANTICIPATION: retain frozen JEPA predictor</text>
<rect x="30" y="240" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="265" fill="white" font-family="sans-serif" font-size="17">Observed clip → encoder</text>
<text x="42" y="288" fill="white" font-family="sans-serif" font-size="17">Future positional mask tokens</text>
<path d="M308,285 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="265" fill="white" font-family="sans-serif" font-size="17">Predict future features</text>
<text x="352" y="288" fill="white" font-family="sans-serif" font-size="17">Concat context + prediction</text>
<path d="M618,285 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="265" fill="white" font-family="sans-serif" font-size="17">Train attentive task probe</text>
<text x="662" y="288" fill="white" font-family="sans-serif" font-size="17">Action / verb / noun outputs</text>
<text x="30" y="370" fill="#c5d5ee" font-family="sans-serif" font-size="18">ROBOT MPC: train a different action-conditioned predictor</text>
<rect x="30" y="385" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="410" fill="white" font-family="sans-serif" font-size="17">Frozen video features</text>
<text x="42" y="433" fill="white" font-family="sans-serif" font-size="17">Droid action data</text>
<path d="M308,430 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="385" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="410" fill="white" font-family="sans-serif" font-size="17">New 24-layer predictor</text>
<text x="352" y="433" fill="white" font-family="sans-serif" font-size="17">Simulate candidate actions</text>
<path d="M618,430 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="385" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="410" fill="white" font-family="sans-serif" font-size="17">CEM chooses sequence</text>
<text x="662" y="433" fill="white" font-family="sans-serif" font-size="17">Execute, observe, replan</text>
<text x="30" y="515" fill="#c5d5ee" font-family="sans-serif" font-size="18">DISTILLATION: smaller student, fixed ViT-G teacher</text>
<rect x="30" y="530" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="555" fill="white" font-family="sans-serif" font-size="17">No deep supervision</text>
<text x="42" y="578" fill="white" font-family="sans-serif" font-size="17">Last-layer dense objective</text>
<path d="M308,575 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="530" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="555" fill="white" font-family="sans-serif" font-size="17">New 12-block predictor</text>
<text x="352" y="578" fill="white" font-family="sans-serif" font-size="17">Student EMA not in loss</text>
<path d="M618,575 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="530" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="555" fill="white" font-family="sans-serif" font-size="17">EMA student is released</text>
<text x="662" y="578" fill="white" font-family="sans-serif" font-size="17">80M or 300M encoder</text>
</svg>
