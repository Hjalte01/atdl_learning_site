<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-label="A · tokenize → B · encode → C · predict → D · compare">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">A · tokenize → B · encode → C · predict → D · compare</text>
<text x="30" y="80" fill="#c5d5ee" font-family="sans-serif" font-size="18">STUDENT PATH: gradient updates through B and C</text>
<rect x="30" y="95" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="120" fill="white" font-family="sans-serif" font-size="17">A: 2D image / 3D video conv</text>
<text x="42" y="143" fill="white" font-family="sans-serif" font-size="17">Drop masked patch tokens</text>
<path d="M308,140 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="95" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="120" fill="white" font-family="sans-serif" font-size="17">B: visible-token ViT</text>
<text x="352" y="143" fill="white" font-family="sans-serif" font-size="17">4 normalized layer outputs</text>
<path d="M618,140 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="95" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="120" fill="white" font-family="sans-serif" font-size="17">Concat channels → MLP</text>
<text x="662" y="143" fill="white" font-family="sans-serif" font-size="17">Fuse and reduce channels</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">CONTINUATION: fused context enters C</text>
<rect x="30" y="240" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="265" fill="white" font-family="sans-serif" font-size="17">Fused context at visible sites</text>
<text x="42" y="288" fill="white" font-family="sans-serif" font-size="17">Add positional mask tokens</text>
<path d="M308,285 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="265" fill="white" font-family="sans-serif" font-size="17">C: 24-block predictor</text>
<text x="352" y="288" fill="white" font-family="sans-serif" font-size="17">Width 384 during pretraining</text>
<path d="M618,285 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="265" fill="white" font-family="sans-serif" font-size="17">4 output feature levels</text>
<text x="662" y="288" fill="white" font-family="sans-serif" font-size="17">For visible + masked sites</text>
<text x="30" y="370" fill="#c5d5ee" font-family="sans-serif" font-size="18">TEACHER PATH: targets for D; no backpropagation</text>
<rect x="30" y="385" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="410" fill="white" font-family="sans-serif" font-size="17">A: same clean image / clip</text>
<text x="42" y="433" fill="white" font-family="sans-serif" font-size="17">Keep all patch positions</text>
<path d="M308,430 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="385" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="410" fill="white" font-family="sans-serif" font-size="17">EMA y-encoder</text>
<text x="352" y="433" fill="white" font-family="sans-serif" font-size="17">4 corresponding layer outputs</text>
<path d="M618,430 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="385" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="410" fill="white" font-family="sans-serif" font-size="17">D: masked L1 + context L1</text>
<text x="662" y="433" fill="white" font-family="sans-serif" font-size="17">Stop gradient on targets</text>
<text x="30" y="515" fill="#c5d5ee" font-family="sans-serif" font-size="18">UPDATE LOOP: loss gradients → student; EMA → teacher</text>
<rect x="30" y="530" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="555" fill="white" font-family="sans-serif" font-size="17">D gradients update B and C</text>
<text x="42" y="578" fill="white" font-family="sans-serif" font-size="17">Also learn student tokenizer</text>
<path d="M308,575 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="530" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="555" fill="white" font-family="sans-serif" font-size="17">EMA coefficient .99925</text>
<text x="352" y="578" fill="white" font-family="sans-serif" font-size="17">Teacher follows student</text>
<path d="M618,575 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="530" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="555" fill="white" font-family="sans-serif" font-size="17">Resample input and mask</text>
<text x="662" y="578" fill="white" font-family="sans-serif" font-size="17">Repeat training step</text>
</svg>
