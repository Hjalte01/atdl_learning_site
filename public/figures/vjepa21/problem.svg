<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="Recognizing a grasp does not locate the cup boundary">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Recognizing a grasp does not locate the cup boundary</text>
<text x="30" y="80" fill="#c5d5ee" font-family="sans-serif" font-size="18">MASKED-ONLY OBJECTIVE: visible tokens help predict elsewhere</text>
<rect x="30" y="95" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="120" fill="white" font-family="sans-serif" font-size="17">Clip: hand reaches for cup</text>
<text x="42" y="143" fill="white" font-family="sans-serif" font-size="17">Hide some patch positions</text>
<path d="M308,140 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="95" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="120" fill="white" font-family="sans-serif" font-size="17">Visible features → predictor</text>
<text x="352" y="143" fill="white" font-family="sans-serif" font-size="17">Loss only at hidden sites</text>
<path d="M618,140 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="95" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="120" fill="white" font-family="sans-serif" font-size="17">Can aggregate global cues</text>
<text x="662" y="143" fill="white" font-family="sans-serif" font-size="17">Local structure harder to read</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">DENSE OBJECTIVE: visible outputs also have location-specific targets</text>
<rect x="30" y="240" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="265" fill="white" font-family="sans-serif" font-size="17">Same clip, same masking</text>
<text x="42" y="288" fill="white" font-family="sans-serif" font-size="17">Clean teacher: all patches</text>
<path d="M308,285 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="265" fill="white" font-family="sans-serif" font-size="17">Predict hidden + visible sites</text>
<text x="352" y="288" fill="white" font-family="sans-serif" font-size="17">Compare each to its target</text>
<path d="M618,285 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="265" fill="white" font-family="sans-serif" font-size="17">Encourage local grounding</text>
<text x="662" y="288" fill="white" font-family="sans-serif" font-size="17">Still learn scene dynamics</text>
</svg>
