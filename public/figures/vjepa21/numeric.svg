<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-label="One layer, three positions: trace the loss arrows">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">One layer, three positions: trace the loss arrows</text>
<text x="30" y="80" fill="#c5d5ee" font-family="sans-serif" font-size="18">D TARGETS AND C PREDICTIONS: toy two-channel vectors</text>
<rect x="30" y="95" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="120" fill="white" font-family="sans-serif" font-size="17">Mask target (2,1)</text>
<text x="42" y="143" fill="white" font-family="sans-serif" font-size="17">Prediction (1.5,1.5)</text>
<path d="M308,140 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="95" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="120" fill="white" font-family="sans-serif" font-size="17">Context 1: (1,0) → (1.2,.2)</text>
<text x="352" y="143" fill="white" font-family="sans-serif" font-size="17">Context 2: (0,1) → (.4,.8)</text>
<path d="M618,140 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="95" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="120" fill="white" font-family="sans-serif" font-size="17">L1 errors: 1, .4, .6</text>
<text x="662" y="143" fill="white" font-family="sans-serif" font-size="17">Targets → predictions shown</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">BRANCH CALCULATIONS: λ = .5, distances 1 and 4</text>
<rect x="30" y="240" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="265" fill="white" font-family="sans-serif" font-size="17">Masked mean: 1 / 1 = 1</text>
<text x="42" y="288" fill="white" font-family="sans-serif" font-size="17">One masked position</text>
<path d="M308,285 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="265" fill="white" font-family="sans-serif" font-size="17">Context: (.5×.4+.25×.6)/2</text>
<text x="352" y="288" fill="white" font-family="sans-serif" font-size="17">Weighted context mean .175</text>
<path d="M618,285 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="265" fill="white" font-family="sans-serif" font-size="17">Dense loss = 1.175</text>
<text x="662" y="288" fill="white" font-family="sans-serif" font-size="17">Then supervise other levels</text>
<text x="30" y="370" fill="#c5d5ee" font-family="sans-serif" font-size="18">WHY SEPARATE COUNTS MATTER</text>
<rect x="30" y="385" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="410" fill="white" font-family="sans-serif" font-size="17">More visible tokens?</text>
<text x="42" y="433" fill="white" font-family="sans-serif" font-size="17">Context uses its own count</text>
<path d="M308,430 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="385" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="410" fill="white" font-family="sans-serif" font-size="17">Do not divide by .5+.25</text>
<text x="352" y="433" fill="white" font-family="sans-serif" font-size="17">That would give .467</text>
<path d="M618,430 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="385" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="410" fill="white" font-family="sans-serif" font-size="17">Toy L1 sums two channels</text>
<text x="662" y="433" fill="white" font-family="sans-serif" font-size="17">No trained model outputs</text>
</svg>
