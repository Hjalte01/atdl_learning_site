<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-label="Training carries weights, not labels, between steps">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Training carries weights, not labels, between steps</text>
<text x="30" y="80" fill="#c5d5ee" font-family="sans-serif" font-size="18">EACH STEP: corruption and a moving latent target</text>
<rect x="30" y="95" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="120" fill="white" font-family="sans-serif" font-size="17">Sample image/video + mask</text>
<text x="42" y="143" fill="white" font-family="sans-serif" font-size="17">Teacher sees clean input</text>
<path d="M308,140 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="95" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="120" fill="white" font-family="sans-serif" font-size="17">Four dense-level losses</text>
<text x="352" y="143" fill="white" font-family="sans-serif" font-size="17">Gradient update student</text>
<path d="M618,140 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="95" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="120" fill="white" font-family="sans-serif" font-size="17">EMA update teacher</text>
<text x="662" y="143" fill="white" font-family="sans-serif" font-size="17">Next step repeats</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">PRIMARY PHASE: 135k iterations</text>
<rect x="30" y="240" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="265" fill="white" font-family="sans-serif" font-size="17">Images 256 × 256</text>
<text x="42" y="288" fill="white" font-family="sans-serif" font-size="17">Video 16 frames, 256²</text>
<path d="M308,285 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="265" fill="white" font-family="sans-serif" font-size="17">12k learning-rate warmup</text>
<text x="352" y="288" fill="white" font-family="sans-serif" font-size="17">Then constant learning rate</text>
<path d="M618,285 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="265" fill="white" font-family="sans-serif" font-size="17">2304 images + 128 clips</text>
<text x="662" y="288" fill="white" font-family="sans-serif" font-size="17">Aggregate modality gradients</text>
<text x="30" y="370" fill="#c5d5ee" font-family="sans-serif" font-size="18">COOLDOWN: 12k more iterations</text>
<rect x="30" y="385" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="410" fill="white" font-family="sans-serif" font-size="17">Images 512 × 512</text>
<text x="42" y="433" fill="white" font-family="sans-serif" font-size="17">Video 64 frames, 384²</text>
<path d="M308,430 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="385" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="410" fill="white" font-family="sans-serif" font-size="17">Learning rate → 1e−6</text>
<text x="352" y="433" fill="white" font-family="sans-serif" font-size="17">Higher resolution adaptation</text>
<path d="M618,430 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="385" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="410" fill="white" font-family="sans-serif" font-size="17">Final tables use both phases</text>
<text x="662" y="433" fill="white" font-family="sans-serif" font-size="17">Ablations mostly primary only</text>
</svg>
