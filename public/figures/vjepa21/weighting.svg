<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-label="Context weights emphasize the edge of a hidden region">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Context weights emphasize the edge of a hidden region</text>
<text x="30" y="80" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY 1D GRID: masked site at position 0</text>
<rect x="30" y="95" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="120" fill="white" font-family="sans-serif" font-size="17">Visible at 1: distance 1</text>
<text x="42" y="143" fill="white" font-family="sans-serif" font-size="17">λ = .5 → weight .5</text>
<path d="M308,140 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="95" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="120" fill="white" font-family="sans-serif" font-size="17">Visible at 4: distance 4</text>
<text x="352" y="143" fill="white" font-family="sans-serif" font-size="17">λ = .5 → weight .25</text>
<path d="M618,140 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="95" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="120" fill="white" font-family="sans-serif" font-size="17">Visible at 9: distance 9</text>
<text x="662" y="143" fill="white" font-family="sans-serif" font-size="17">λ = .5 → weight .167</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">LOSS REDUCTIONS: keep the two branches distinct</text>
<rect x="30" y="240" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="265" fill="white" font-family="sans-serif" font-size="17">Masked: average over |M|</text>
<text x="42" y="288" fill="white" font-family="sans-serif" font-size="17">Every masked token weight 1</text>
<path d="M308,285 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="265" fill="white" font-family="sans-serif" font-size="17">Context: average over |C|</text>
<text x="352" y="288" fill="white" font-family="sans-serif" font-size="17">Multiply each error by λᵢ</text>
<path d="M618,285 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="265" fill="white" font-family="sans-serif" font-size="17">Sum branch losses</text>
<text x="662" y="288" fill="white" font-family="sans-serif" font-size="17">Not a weighted-mean divide</text>
<text x="30" y="370" fill="#c5d5ee" font-family="sans-serif" font-size="18">PAPER RULE: nearest masked token</text>
<rect x="30" y="385" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="410" fill="white" font-family="sans-serif" font-size="17">Distance in token blocks</text>
<text x="42" y="433" fill="white" font-family="sans-serif" font-size="17">Spatio-temporal grid</text>
<path d="M308,430 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="385" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="410" fill="white" font-family="sans-serif" font-size="17">λᵢ = λ / sqrt(dmin)</text>
<text x="352" y="433" fill="white" font-family="sans-serif" font-size="17">Warm up context coefficient</text>
<path d="M618,430 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="385" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="410" fill="white" font-family="sans-serif" font-size="17">λvideo = .5; λimage = .7</text>
<text x="662" y="433" fill="white" font-family="sans-serif" font-size="17">Values from Appendix A</text>
</svg>
