<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Certify a distribution, not just its mean weights">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Certify a distribution, not just its mean weights</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">BOUND INPUTS · P fixed independently of the sample</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Prior P; learned Q</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">KL(Q || P) = 10 nats</text>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Training risk of Q = 0.05</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">n = 1000; δ = 0.05</text>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Penalty ≈ 0.0926</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Risk upper bound ≈ 0.1426</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">RANDOMIZED PREDICTION · Q fixed after training</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Fresh input x*</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Sample predictor h ~ Q</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Run sampled predictor</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Obtain h(x*)</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Average risk over Q</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Guarantee concerns this risk</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">SCOPE · a hypothetical calculation, not a lecture benchmark</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Sample assumptions</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">i.i.d.; loss in [0,1]</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Confidence over S</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">At least 1 − δ</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Mean-network accuracy</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Not directly certified here</text>
</svg>