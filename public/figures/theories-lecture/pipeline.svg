<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-label="Keep learning, use and measurement distinct">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Keep learning, use and measurement distinct</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN · labels are available; weights change</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">x ∈ ℝᵈ → T ∈ ℝᵐ → z ∈ ℝᴷ</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Representation → logits</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Loss + optional penalty</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Compare prediction with y</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Backprop + optimizer</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Update w; repeat on batches</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">PREDICT · weights fixed; new label unavailable</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Fresh input x*</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Same feature dimensions</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Frozen network h_w</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">No gradient update</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Class probabilities</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Choose prediction</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">DIAGNOSE · different objects, usually after or alongside fitting</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Hidden states T</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Information; structure</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Weights or distribution Q</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">BDM; prior-relative KL</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Local objective geometry</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Curvature + prior density</text>
<text x="30" y="460" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY ITERATION · h(x) = wx; pair (1,1); step size 1/2</text>
<rect x="30" y="475" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="502" fill="#fff" font-family="sans-serif" font-size="17">w₀ = 0</text>
<text x="42" y="526" fill="#fff" font-family="sans-serif" font-size="17">Gradient = −1</text>
<path d="M324,509 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="475" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="502" fill="#fff" font-family="sans-serif" font-size="17">w₁ = 0.5</text>
<text x="367" y="526" fill="#fff" font-family="sans-serif" font-size="17">Gradient = −0.5</text>
<path d="M649,509 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="475" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="502" fill="#fff" font-family="sans-serif" font-size="17">w₂ = 0.75</text>
<text x="692" y="526" fill="#fff" font-family="sans-serif" font-size="17">Inference at x = 2 gives 1.5</text>
</svg>