<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Evidence is integrated mass around a fit">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Evidence is integrated mass around a fit</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">LAPLACE · local Gaussian approximation at a mode</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Likelihood × prior density</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Peak height</text>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Curvature H positive definite</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Width ∝ 1 / √det H</text>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Height × width × constant</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Approximate evidence</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">ONE-DIMENSIONAL TOY · equal likelihood and prior heights</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Sharper: H = 4</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Width factor = 0.5</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Broader: H = 1</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Width factor = 1</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Broader / sharper = 2</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Negative log difference = ln 2</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">CHECK THE ASSUMPTIONS</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Prior and coordinates</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Width alone is insufficient</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Local shape</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Gaussian; nonsingular mode</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Other modes</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">May contribute extra mass</text>
</svg>