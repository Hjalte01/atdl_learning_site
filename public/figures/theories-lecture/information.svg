<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Retain the task bit; discard the nuisance bit">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Retain the task bit; discard the nuisance bit</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY SOURCE · A and B are independent fair bits; Y = A</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Input X = (A,B)</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Entropy = 2 bits</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Representation T = A</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Entropy = 1 bit</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Label Y = A</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Predictable from T</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">ALTERNATIVE REPRESENTATIONS · same discrete source</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">T = X</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">I(X;T)=2; I(T;Y)=1</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">T = A</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">I(X;T)=1; I(T;Y)=1</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">T = constant</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">I(X;T)=0; I(T;Y)=0</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">IB OBJECTIVE · I(X;T) − 2 I(T;Y); smaller is preferred</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Keep everything</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">2 − 2 = 0</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Keep the relevant bit</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">1 − 2 = −1</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Discard everything</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">0 − 0 = 0</text>
</svg>