<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-labelledby="t d"><title id="t">03 / Alignment is spatial and feature-wise</title><desc id="d">Four illustrative corresponding patch features, compared by cosine direction.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="430" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">03 / Alignment is spatial and feature-wise</text><text x="55" y="96" font-size="21">Projected noisy features p</text><rect x="55" y="125" width="145" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="69" y="157" font-size="19">Patch 1</text><text x="69" y="186" font-size="16">D numbers</text><rect x="225" y="125" width="145" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="239" y="157" font-size="19">Patch 2</text><text x="239" y="186" font-size="16">D numbers</text><rect x="55" y="220" width="145" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="69" y="252" font-size="19">Patch 3</text><text x="69" y="281" font-size="16">D numbers</text><rect x="225" y="220" width="145" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="239" y="252" font-size="19">Patch 4</text><text x="239" y="281" font-size="16">D numbers</text><text x="485" y="96" font-size="21">Clean teacher features y*</text><rect x="485" y="125" width="145" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="499" y="157" font-size="19">Patch 1</text><text x="499" y="186" font-size="16">D numbers</text><rect x="655" y="125" width="145" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="669" y="157" font-size="19">Patch 2</text><text x="669" y="186" font-size="16">D numbers</text><rect x="485" y="220" width="145" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="499" y="252" font-size="19">Patch 3</text><text x="499" y="281" font-size="16">D numbers</text><rect x="655" y="220" width="145" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="669" y="252" font-size="19">Patch 4</text><text x="669" y="281" font-size="16">D numbers</text><path d="M380,213 L470,213" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="35" y="363" font-size="19">Compare matching patch positions, then average their similarities.</text><text x="35" y="398" font-size="17">Cosine compares feature direction, not magnitude. Four-patch teaching grid.</text></g></svg>