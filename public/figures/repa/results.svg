<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 525" role="img" aria-labelledby="t d"><title id="t">07 / Better FID with fewer training iterations</title><desc id="d">Five bars show FID 17.2, 8.3, 7.9, 6.4, and 5.9 for the stated training budgets.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="525" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">07 / Better FID with fewer training iterations</text><text x="30" y="85" font-size="18">ImageNet 256 × 256 · no guidance · FID-50K ↓ · course Table 3</text><text x="30" y="140" font-size="19">Vanilla · 400K</text><rect x="255" y="115" width="550.4" height="35" rx="5" fill="#73859d"/><text x="820.4" y="140" font-size="19">17.2</text><text x="30" y="198" font-size="19">Vanilla · 7M</text><rect x="255" y="173" width="265.6" height="35" rx="5" fill="#73859d"/><text x="535.6" y="198" font-size="19">8.3</text><text x="30" y="256" font-size="19">REPA · 400K</text><rect x="255" y="231" width="252.8" height="35" rx="5" fill="#168373"/><text x="522.8" y="256" font-size="19">7.9</text><text x="30" y="314" font-size="19">REPA · 1M</text><rect x="255" y="289" width="204.8" height="35" rx="5" fill="#168373"/><text x="474.8" y="314" font-size="19">6.4</text><text x="30" y="372" font-size="19">REPA · 4M</text><rect x="255" y="347" width="188.8" height="35" rx="5" fill="#168373"/><text x="458.8" y="372" font-size="19">5.9</text><text x="255" y="445" font-size="16">0</text><text x="575" y="445" font-size="16">10</text><text x="884" y="445" font-size="16">20</text><text x="30" y="489" font-size="18">7M / 400K = 17.5× fewer training iterations; not an inference speed ratio.</text></g></svg>