<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-labelledby="t d"><title id="t">04 / A complete toy loss calculation</title><desc id="d">The velocity squared error is 1 and negative cosine alignment is minus 0.8; lambda 0.5 gives combined loss 0.6.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="430" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">04 / A complete toy loss calculation</text><rect x="30" y="95" width="270" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="127" font-size="19">B → C · Make noisy latent</text><text x="44" y="156" font-size="16">z = 2, ε = 6, t = 0.25</text><path d="M310,137 L345,137" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="355" y="95" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="369" y="127" font-size="19">zₜ = 3</text><text x="369" y="156" font-size="16">Target velocity = 4</text><path d="M615,137 L650,137" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="660" y="95" width="250" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="674" y="127" font-size="19">E · Predict 3</text><text x="674" y="156" font-size="16">Velocity error² = 1</text><rect x="30" y="245" width="320" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="277" font-size="19">D → F · Projected p = (3, 4)</text><text x="44" y="306" font-size="16">Teacher y* = (0, 2)</text><path d="M360,288 L395,288" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="405" y="245" width="250" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="419" y="277" font-size="19">Cosine = 0.8</text><text x="419" y="306" font-size="16">REPA loss = −0.8</text><path d="M665,288 L700,288" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="710" y="245" width="200" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="724" y="277" font-size="19">Total = 0.6</text><text x="724" y="306" font-size="16">1 + 0.5 × (−0.8)</text><text x="30" y="392" font-size="18">Synthetic numbers: a smaller combined loss need not mean smaller velocity error.</text></g></svg>