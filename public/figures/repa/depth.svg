<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" role="img" aria-labelledby="t d"><title id="t">06 / More classification accuracy is not always better FID</title><desc id="d">Measured depth 8 versus depth 16 ablation plus schematic early-to-late transformer.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="450" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">06 / More classification accuracy is not always better FID</text><rect x="30" y="100" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="132" font-size="19">Early blocks</text><text x="44" y="161" font-size="16">Learn useful representations</text><path d="M300,143 L335,143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="100" width="250" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="359" y="132" font-size="19">Alignment attachment</text><text x="359" y="161" font-size="16">Where should it go?</text><path d="M605,143 L640,143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="100" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="132" font-size="19">Later blocks</text><text x="664" y="161" font-size="16">Produce denoising details</text><rect x="80" y="245" width="350" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="94" y="277" font-size="19">Depth 8: FID 10.0</text><text x="94" y="306" font-size="16">Linear-probe accuracy 68.1%</text><rect x="495" y="245" width="350" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="509" y="277" font-size="19">Depth 16: FID 12.1</text><text x="509" y="306" font-size="16">Linear-probe accuracy 71.1%</text><text x="30" y="380" font-size="17">Table 2: SiT-L/2 · 400K iterations · DINOv2-L · NT-Xent · λ = 0.5</text><