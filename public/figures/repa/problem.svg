<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-labelledby="t d"><title id="t">01 / Give early features a teacher</title><desc id="d">Schematic contrast of ordinary generation training and an auxiliary clean feature target.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="430" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">01 / Give early features a teacher</text><rect x="30" y="90" width="255" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="122" font-size="19">Noisy latent</text><text x="44" y="151" font-size="16">Same input in both routes</text><path d="M295,133 L330,133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="340" y="90" width="265" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="354" y="122" font-size="19">Learn useful features</text><text x="354" y="151" font-size="16">Original generation loss</text><path d="M615,133 L650,133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="660" y="90" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="674" y="122" font-size="19">Predict velocity</text><text x="674" y="151" font-size="16">Semantics AND details</text><rect x="30" y="245" width="255" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="277" font-size="19">Clean training image</text><text x="44" y="306" font-size="16">Extra training branch</text><path d="M295,288 L330,288" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="340" y="245" width="265" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="354" y="277" font-size="19">Frozen visual teacher</text><text x="354" y="306" font-size="16">Semantic feature targets</text><path d="M470,240 L470,188" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="620" y="290" font-size="18">REPA: help the early layers</text><text x="30" y="380" font-size="18">Green = frozen clean branch    Purple = learned generator    Orange = loss</text></g></svg>