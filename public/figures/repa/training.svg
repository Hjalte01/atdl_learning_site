<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 610" role="img" aria-labelledby="t d"><title id="t">02 / Training: generation + representation alignment</title><desc id="d">A clean image branches into VAE latent corruption and a clean visual teacher; projected early features get alignment supervision.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="610" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">02 / Training: generation + representation alignment</text><rect x="30" y="80" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="112" font-size="19">A · Clean image x*</text><text x="44" y="141" font-size="16">256 × 256 × 3</text><path d="M290,123 L325,123" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="335" y="80" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="349" y="112" font-size="19">B · Frozen VAE E</text><text x="349" y="141" font-size="16">z: 32 × 32 × 4</text><path d="M605,123 L640,123" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="80" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="112" font-size="19">C · Add noise at t</text><text x="664" y="141" font-size="16">zₜ = (1 − t)z + tε</text><path d="M780,170 L780,220" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="235" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="267" font-size="19">D · Early SiT blocks</text><text x="664" y="296" font-size="16">hₜ: 256 × 1152; t, c</text><path d="M780,330 L780,380" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="390" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="422" font-size="19">Remaining blocks</text><text x="664" y="451" font-size="16">E · velocity → loss</text><rect x="335" y="235" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="349" y="267" font-size="19">Trainable MLP hφ</text><text x="349" y="296" font-size="16">p: 256 × D</text><path d="M642,278 L603,278" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="30" y="235" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="267" font-size="19">Frozen teacher f</text><text x="44" y="296" font-size="16">y*: 256 × D</text><path d="M155,175 L155,225" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="185" y="390" width="330" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="199" y="422" font-size="19">F · Patch alignment loss</text><text x="199" y="451" font-size="16">Compare p with clean target y*</text><path d="M155,330 L275,380" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M465,330 L415,380" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="535" font-size="18">Both losses update the generator; only alignment updates the projection.</text><text x="30" y="567" font-size="18">Teacher and VAE are fixed. Attach the projection at depth 8 for this XL setup.</text></g></svg>