<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="t d"><title id="t">05 / Inference: evolve a latent, with fixed weights</title><desc id="d">Noise enters the trained transformer and numerical sampler repeatedly; the final latent is decoded by the VAE.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="520" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">05 / Inference: evolve a latent, with fixed weights</text><rect x="30" y="110" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="142" font-size="19">Start: Gaussian z₁</text><text x="44" y="171" font-size="16">Choose class condition c</text><path d="M300,153 L335,153" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="110" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="142" font-size="19">Trained transformer</text><text x="359" y="171" font-size="16">Predict vθ(zₜ, t, c)</text><path d="M605,153 L640,153" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="110" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="142" font-size="19">Numerical sampler</text><text x="664" y="171" font-size="16">Update state and time</text><path d="M780 205 L780 260 L470 260 L470 205" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="505" y="294" font-size="17">Carry the new latent into the next call</text><rect x="345" y="340" width="330" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="359" y="372" font-size="19">End: VAE decoder → image</text><text x="359" y="401" font-size="16">No teacher or projection needed</text><path d="M880 205 L880 383 L690 383" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="480" font-size="19">Direction: t = 1 → 0. REPA changes training, not the sampling loop.</text></g></svg>