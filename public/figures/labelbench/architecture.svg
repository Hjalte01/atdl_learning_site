<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Selection architecture: expensive features, cheap updates">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="25">Selection architecture: expensive features, cheap updates</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">PRECOMPUTE: encoder frozen; five seeded augmentation sets</text>
<rect x="30" y="100" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="124" fill="white" font-family="sans-serif" font-size="17">Image a_s(x)</text>
<text x="42" y="147" fill="white" font-family="sans-serif" font-size="17">Pixels → encoder E_phi</text>
<path d="M308,142 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="124" fill="white" font-family="sans-serif" font-size="17">Cached z_s(x) in R^d</text>
<text x="352" y="147" fill="white" font-family="sans-serif" font-size="17">Store feature vectors</text>
<path d="M618,142 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="124" fill="white" font-family="sans-serif" font-size="17">Reuse over epochs</text>
<text x="662" y="147" fill="white" font-family="sans-serif" font-size="17">No encoder backprop</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN PROXY: reset head; labels + unlabeled consistency</text>
<rect x="30" y="240" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="264" fill="white" font-family="sans-serif" font-size="17">Cached features z</text>
<text x="42" y="287" fill="white" font-family="sans-serif" font-size="17">Sample augmentation sets</text>
<path d="M308,282 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="264" fill="white" font-family="sans-serif" font-size="17">Head h_theta</text>
<text x="352" y="287" fill="white" font-family="sans-serif" font-size="17">R^d → R^K logits</text>
<path d="M618,282 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="264" fill="white" font-family="sans-serif" font-size="17">Softmax p in R^K</text>
<text x="662" y="287" fill="white" font-family="sans-serif" font-size="17">Loss updates theta only</text>
<text x="30" y="365" fill="#c5d5ee" font-family="sans-serif" font-size="18">SELECT: target labels remain hidden until this last box</text>
<rect x="30" y="380" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="404" fill="white" font-family="sans-serif" font-size="17">Features and p on U</text>
<text x="42" y="427" fill="white" font-family="sans-serif" font-size="17">Acquisition score / geometry</text>
<path d="M308,422 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="380" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="404" fill="white" font-family="sans-serif" font-size="17">Batch Q of size b</text>
<text x="352" y="427" fill="white" font-family="sans-serif" font-size="17">Send selected IDs to oracle</text>
<path d="M618,422 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="380" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="404" fill="white" font-family="sans-serif" font-size="17">Reveal true y for Q</text>
<text x="662" y="427" fill="white" font-family="sans-serif" font-size="17">Carry new L and U forward</text>
</svg>
