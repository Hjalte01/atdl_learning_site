<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="One toy round: choose one label, then retrain">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="25">One toy round: choose one label, then retrain</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">PROXY SCORES: b = 1; smallest top-two margin wins</text>
<rect x="30" y="100" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="124" fill="white" font-family="sans-serif" font-size="17">A: (.80, .15, .05)</text>
<text x="42" y="147" fill="white" font-family="sans-serif" font-size="17">Margin = .65</text>
<path d="M308,142 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="124" fill="white" font-family="sans-serif" font-size="17">B: (.45, .40, .15)</text>
<text x="352" y="147" fill="white" font-family="sans-serif" font-size="17">Margin = .05</text>
<path d="M618,142 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="124" fill="white" font-family="sans-serif" font-size="17">C: (.60, .20, .20)</text>
<text x="662" y="147" fill="white" font-family="sans-serif" font-size="17">Margin = .40</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">ANNOTATE B: model said class 1; oracle may disagree</text>
<rect x="30" y="240" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="264" fill="white" font-family="sans-serif" font-size="17">Select B</text>
<text x="42" y="287" fill="white" font-family="sans-serif" font-size="17">Highest entropy too</text>
<path d="M308,282 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="264" fill="white" font-family="sans-serif" font-size="17">Oracle returns class 2</text>
<text x="352" y="287" fill="white" font-family="sans-serif" font-size="17">Human label overrides guess</text>
<path d="M618,282 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="264" fill="white" font-family="sans-serif" font-size="17">L grows by 1</text>
<text x="662" y="287" fill="white" font-family="sans-serif" font-size="17">U shrinks by 1</text>
<text x="30" y="365" fill="#c5d5ee" font-family="sans-serif" font-size="18">NEXT ROUND: changed training data, changed scores</text>
<rect x="30" y="380" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="404" fill="white" font-family="sans-serif" font-size="17">Reset and train proxy</text>
<text x="42" y="427" fill="white" font-family="sans-serif" font-size="17">Use new L and remaining U</text>
<path d="M308,422 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="380" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="404" fill="white" font-family="sans-serif" font-size="17">Recompute predictions</text>
<text x="352" y="427" fill="white" font-family="sans-serif" font-size="17">Do not reuse stale scores</text>
<path d="M618,422 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="380" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="404" fill="white" font-family="sans-serif" font-size="17">Continue to budget</text>
<text x="662" y="427" fill="white" font-family="sans-serif" font-size="17">Then train final full model</text>
</svg>
