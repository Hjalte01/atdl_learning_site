<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Annotation state over time: toy budget B = 6, batch b = 2">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="25">Annotation state over time: toy budget B = 6, batch b = 2</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">START: random initial batch counts toward budget</text>
<rect x="30" y="100" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="124" fill="white" font-family="sans-serif" font-size="17">Pool of 10 inputs</text>
<text x="42" y="147" fill="white" font-family="sans-serif" font-size="17">No labels visible</text>
<path d="M308,142 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="124" fill="white" font-family="sans-serif" font-size="17">Query 2 at random</text>
<text x="352" y="147" fill="white" font-family="sans-serif" font-size="17">L = 2; U = 8</text>
<path d="M618,142 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="124" fill="white" font-family="sans-serif" font-size="17">Train proxy from scratch</text>
<text x="662" y="147" fill="white" font-family="sans-serif" font-size="17">Score remaining U</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">ROUND 2: adaptive acquisition</text>
<rect x="30" y="240" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="264" fill="white" font-family="sans-serif" font-size="17">Query 2 selected IDs</text>
<text x="42" y="287" fill="white" font-family="sans-serif" font-size="17">Reveal oracle labels</text>
<path d="M308,282 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="264" fill="white" font-family="sans-serif" font-size="17">L = 4; U = 6</text>
<text x="352" y="287" fill="white" font-family="sans-serif" font-size="17">Training can still use U</text>
<path d="M618,282 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="264" fill="white" font-family="sans-serif" font-size="17">Reset / retrain proxy</text>
<text x="662" y="287" fill="white" font-family="sans-serif" font-size="17">Choose next batch</text>
<text x="30" y="365" fill="#c5d5ee" font-family="sans-serif" font-size="18">ROUND 3: budget exhausted</text>
<rect x="30" y="380" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="404" fill="white" font-family="sans-serif" font-size="17">Query 2 selected IDs</text>
<text x="42" y="427" fill="white" font-family="sans-serif" font-size="17">Total human labels = 6</text>
<path d="M308,422 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="380" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="404" fill="white" font-family="sans-serif" font-size="17">L = 6; U = 4</text>
<text x="352" y="427" fill="white" font-family="sans-serif" font-size="17">Stop annotation</text>
<path d="M618,422 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="380" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="404" fill="white" font-family="sans-serif" font-size="17">Final full fine-tuning</text>
<text x="662" y="427" fill="white" font-family="sans-serif" font-size="17">Use both partitions</text>
</svg>
