<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Three paths: selection training, final training, prediction">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="25">Three paths: selection training, final training, prediction</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">REPEATED SELECTION: phi fixed; proxy theta learned afresh</text>
<rect x="30" y="100" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="124" fill="white" font-family="sans-serif" font-size="17">Cached L and U</text>
<text x="42" y="147" fill="white" font-family="sans-serif" font-size="17">Train small proxy</text>
<path d="M308,142 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="124" fill="white" font-family="sans-serif" font-size="17">Select and annotate Q</text>
<text x="352" y="147" fill="white" font-family="sans-serif" font-size="17">Update dataset partitions</text>
<path d="M618,142 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="124" fill="white" font-family="sans-serif" font-size="17">Next annotation round</text>
<text x="662" y="147" fill="white" font-family="sans-serif" font-size="17">New proxy; larger L</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">FINAL TRAINING: discard selection-only restriction</text>
<rect x="30" y="240" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="264" fill="white" font-family="sans-serif" font-size="17">Collected L + remaining U</text>
<text x="42" y="287" fill="white" font-family="sans-serif" font-size="17">Pretrained CLIP / CoCa</text>
<path d="M308,282 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="264" fill="white" font-family="sans-serif" font-size="17">End-to-end FlexMatch</text>
<text x="352" y="287" fill="white" font-family="sans-serif" font-size="17">Update encoder and head</text>
<path d="M618,282 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="264" fill="white" font-family="sans-serif" font-size="17">Final predictor f</text>
<text x="662" y="287" fill="white" font-family="sans-serif" font-size="17">Used for reported evaluation</text>
<text x="30" y="365" fill="#c5d5ee" font-family="sans-serif" font-size="18">INFERENCE: no acquisition or oracle</text>
<rect x="30" y="380" width="275" height="85" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="404" fill="white" font-family="sans-serif" font-size="17">New test image x</text>
<text x="42" y="427" fill="white" font-family="sans-serif" font-size="17">Encoder E_phi-final</text>
<path d="M308,422 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="380" width="275" height="85" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="404" fill="white" font-family="sans-serif" font-size="17">Classifier head</text>
<text x="352" y="427" fill="white" font-family="sans-serif" font-size="17">Softmax / argmax</text>
<path d="M618,422 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="380" width="275" height="85" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="404" fill="white" font-family="sans-serif" font-size="17">Predicted class</text>
<text x="662" y="427" fill="white" font-family="sans-serif" font-size="17">Compare to test ground truth</text>
</svg>
