<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="A rate penalty changes which reconstruction is preferred">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">A rate penalty changes which reconstruction is preferred</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TWO CONSTRUCTED CANDIDATES · use the same distortion and rate units</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Candidate A</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">d = 0.01; r = 4 bits</text>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Candidate B</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">d = 0.04; r = 1 bit</text>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Objective: d + βr</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Compare, do not average</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">β = 0.005 · cheaper distortion matters more</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">A: 0.01 + 0.005 × 4</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">= 0.030</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">B: 0.04 + 0.005 × 1</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">= 0.045</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Prefer candidate A</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">More bits; less distortion</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">β = 0.02 · rate is more expensive</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">A: 0.01 + 0.02 × 4</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">= 0.090</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">B: 0.04 + 0.02 × 1</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">= 0.060</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Prefer candidate B</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Fewer bits; more distortion</text>
</svg>