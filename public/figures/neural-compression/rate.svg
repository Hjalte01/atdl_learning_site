<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Bit accounting: symbol count is not a probability">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Bit accounting: symbol count is not a probability</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">FIXED WIDTH · M = 4 coordinates, K = 4 entries, 16 grayscale pixels</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">log₂ K = 2 bits / index</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">4 indices × 2 bits</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Payload = 8 bits</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Sequence probability = 4⁻⁴</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">8 / 16 = 0.5 bpp</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Shared model excluded</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">MODEL-BASED IDEAL RATE · illustrative conditional probabilities</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Probabilities: ½, ½, ¼, ½</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Sequence mass = 1/32</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">−log₂(1/32) = 5 bits</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">5 / 16 = 0.3125 bpp</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Measure real stream too</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Include headers / side info</text>
</svg>