<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Trace a complete toy codec: x = (0.2,0.8)">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Trace a complete toy codec: x = (0.2,0.8)</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">A → B · identity encoder; shared codebook c = (0,1)</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">A: y = (0.2,0.8)</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Two real numbers</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">B: i = (0,1)</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Nearest-entry quantization</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">F: p(0)=¾, p(1|0)=½</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Sequence mass = ⅜</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">C → D · illustrative prefix codes, known sequence length = 2</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">C: 0 → bit 0; 1 → bit 1</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Transmit 01: exactly 2 bits</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">D: read 0, then 1</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Recover i = (0,1)</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Lookup c[i] = (0,1)</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">E: identity → x̂ = (0,1)</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">MEASURE · distortion is separate from ideal probability-based rate</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">MSE = (0.04+0.04)/2</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">= 0.04</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Ideal rate = −log₂(⅜)</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">≈ 1.415 bits per image</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Actual toy payload = 2 bits</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Headers excluded</text>
</svg>