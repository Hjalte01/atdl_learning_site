<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Autoregressive decoding carries an exact recovered prefix">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Autoregressive decoding carries an exact recovered prefix</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">STEP 1 · empty prefix available to both ends</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">F predicts p(i₁)</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Same distribution at C and D</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">C encodes known i₁</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">D decodes i₁ from bits</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Carry prefix (i₁)</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Do not sample it</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">STEP 2 · only earlier symbols may affect current probabilities</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">F predicts p(i₂ | i₁)</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">No future-symbol leakage</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">C encodes known i₂</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">D recovers the same i₂</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Carry prefix (i₁,i₂)</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Repeat until known length</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">GENERATION USES THE SAME F BUT A DIFFERENT OPERATION</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Predict next probabilities</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Use generated prefix</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Sample next symbol</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">No compressed message</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Append sampled symbol</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Different task from decoding</text>
</svg>