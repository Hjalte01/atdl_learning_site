<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">04 / E → F: one partition, two summaries</title><desc id="d">Computed toy entropy and BDM; CTM values are invented teaching inputs.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">04 / E → F: one partition, two summaries</text><text x="40" y="95" font-size="18">r₁: checkerboard</text><rect x="40" y="115" width="33" height="33" fill="#d4eee7"/><rect x="75" y="115" width="33" height="33" fill="#7158a5"/><rect x="110" y="115" width="33" height="33" fill="#d4eee7"/><rect x="145" y="115" width="33" height="33" fill="#7158a5"/><rect x="40" y="150" width="33" height="33" fill="#7158a5"/><rect x="75" y="150" width="33" height="33" fill="#d4eee7"/><rect x="110" y="150" width="33" height="33" fill="#7158a5"/><rect x="145" y="150" width="33" height="33" fill="#d4eee7"/><rect x="40" y="185" width="33" height="33" fill="#d4eee7"/><rect x="75" y="185" width="33" height="33" fill="#7158a5"/><rect x="110" y="185" width="33" height="33" fill="#d4eee7"/><rect x="145" y="185" width="33" height="33" fill="#7158a5"/><rect x="40" y="220" width="33" height="33" fill="#7158a5"/><rect x="75" y="220" width="33" height="33" fill="#d4eee7"/><rect x="110" y="220" width="33" height="33" fill="#7158a5"/><rect x="145" y="220" width="33" height="33" fill="#d4eee7"/><text x="270" y="95" font-size="18">r₂: horizontal bands</text><rect x="270" y="115" width="33" height="33" fill="#d4eee7"/><rect x="305" y="115" width="33" height="33" fill="#d4eee7"/><rect x="340" y="115" width="33" height="33" fill="#d4eee7"/><rect x="375" y="115" width="33" height="33" fill="#d4eee7"/><rect x="270" y="150" width="33" height="33" fill="#7158a5"/><rect x="305" y="150" width="33" height="33" fill="#7158a5"/><rect x="340" y="150" width="33" height="33" fill="#7158a5"/><rect x="375" y="150" width="33" height="33" fill="#7158a5"/><rect x="270" y="185" width="33" height="33" fill="#d4eee7"/><rect x="305" y="185" width="33" height="33" fill="#d4eee7"/><rect x="340" y="185" width="33" height="33" fill="#d4eee7"/><rect x="375" y="185" width="33" height="33" fill="#d4eee7"/><rect x="270" y="220" width="33" height="33" fill="#7158a5"/><rect x="305" y="220" width="33" height="33" fill="#7158a5"/><rect x="340" y="220" width="33" height="33" fill="#7158a5"/><rect x="375" y="220" width="33" height="33" fill="#7158a5"/><rect x="520" y="110" width="380" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="532" y="142" font-size="19">Four tiles: r₁,r₁,r₁,r₂</text><text x="532" y="175" font-size="16">Counts 3 and 1; N = 4</text><text x="520" y="250" font-size="22">H = 0.811 bits per block</text><text x="520" y="290" font-size="22">Toy CTM costs: 5 and 9</text><text x="520" y="330" font-size="22">BDM = 5 + log₂3 + 9</text><text x="520" y="370" font-size="22">= 15.585 (illustrative)</text><text x="30" y="420" font-size="18">Tile identities matter to BDM. Tile order is discarded by both count summaries.</text></g></svg>