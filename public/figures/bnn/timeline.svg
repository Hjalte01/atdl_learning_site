<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">06 / From optimization steps to reported correlations</title><desc id="d">Source preprocessing sequence; no synthetic learning curves.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">06 / From optimization steps to reported correlations</text><rect x="30" y="95" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="127" font-size="19">Every optimizer step</text><text x="42" y="160" font-size="16">Record loss, BDM, entropy</text><path d="M310 140 L345 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="95" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="127" font-size="19">Average within epochs</text><text x="362" y="160" font-size="16">Validation every 20 steps</text><path d="M630 140 L665 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="95" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="127" font-size="19">Trim patience tail</text><text x="682" y="160" font-size="16">Omit runs shorter than 5</text><rect x="30" y="265" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="297" font-size="19">Per-run transformation</text><text x="42" y="330" font-size="16">log1p → smooth σ=1 → scale</text><path d="M310 310 L345 310" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="265" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="297" font-size="19">Correlate trajectories</text><text x="362" y="330" font-size="16">Pearson r; Spearman ρ</text><path d="M630 310 L665 310" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="265" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="297" font-size="19">Bootstrap model runs</text><text x="682" y="330" font-size="16">95% confidence intervals</text><text x="30" y="417" font-size="18">200 runs per configuration initially; controls use a fixed 14-epoch window.</text></g></svg>