<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">01 / Count the patterns, or describe the patterns?</title><desc id="d">Schematic comparison of two block dictionaries with identical frequencies.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">01 / Count the patterns, or describe the patterns?</text><rect x="30" y="100" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Matrix A: two block types</text><text x="42" y="165" font-size="16">Each occurs twice</text><rect x="490" y="100" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="132" font-size="19">Matrix B: two block types</text><text x="502" y="165" font-size="16">Each occurs twice</text><rect x="30" y="255" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="287" font-size="19">Block entropy = 1 bit</text><text x="42" y="320" font-size="16">Frequencies: 1/2 and 1/2</text><rect x="490" y="255" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="287" font-size="19">Block entropy = 1 bit</text><text x="502" y="320" font-size="16">Frequencies: 1/2 and 1/2</text><text x="30" y="390" font-size="18">BDM also consults each pattern’s CTM cost; identical counts need not mean identical BDM.</text></g></svg>