<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">05 / One example takes two different paths</title><desc id="d">Illustrative classifier output and weight analysis, not trained model outputs.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">05 / One example takes two different paths</text><rect x="30" y="95" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="127" font-size="19">A · One training image</text><text x="42" y="160" font-size="16">Target class y = 3</text><path d="M310 140 L345 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="95" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="127" font-size="19">B → C · Predict</text><text x="362" y="160" font-size="16">Probability of y: 0.25</text><path d="M630 140 L665 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="95" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="127" font-size="19">Task loss = 1.386</text><text x="682" y="160" font-size="16">−ln(0.25); Adam uses this</text><rect x="30" y="265" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="297" font-size="19">D · Snapshot weights</text><text x="42" y="330" font-size="16">w = −0.2, 0, 0.7</text><path d="M310 310 L345 310" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="265" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="297" font-size="19">E · Encode signs</text><text x="362" y="330" font-size="16">bits = 0, 0, 1</text><path d="M630 310 L665 310" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="265" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="297" font-size="19">F · Aggregate tiles</text><text x="682" y="330" font-size="16">H / BDM use whole blocks</text><text x="30" y="417" font-size="18">Three signs illustrate encoding only; the 4 × 4 tiles in Figure 04 supply the metric example.</text></g></svg>