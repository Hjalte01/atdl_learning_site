<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">03 / Training changes parameters; inference freezes them</title><desc id="d">Schematic separation of optimizer, diagnostic and prediction paths.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">03 / Training changes parameters; inference freezes them</text><rect x="30" y="95" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="127" font-size="19">Train: input + label</text><text x="42" y="160" font-size="16">A → B → C → cross-entropy</text><path d="M310 140 L345 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="95" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="127" font-size="19">STE backpropagation</text><text x="362" y="160" font-size="16">Surrogate for discrete steps</text><path d="M630 140 L665 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="95" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="127" font-size="19">Adam update</text><text x="682" y="160" font-size="16">Carry weights + moments</text><rect x="30" y="265" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="297" font-size="19">Infer: input only</text><text x="42" y="330" font-size="16">Load selected checkpoint</text><path d="M310 310 L345 310" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="265" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="297" font-size="19">A → B → C</text><text x="362" y="330" font-size="16">Freeze learned parameters</text><path d="M630 310 L665 310" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="265" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="297" font-size="19">Predicted class</text><text x="682" y="330" font-size="16">No BDM needed</text><text x="30" y="411" font-size="18">Training also records D → E → F; no gradient returns from F to the optimizer.</text></g></svg>