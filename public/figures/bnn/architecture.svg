<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">02 / Predict with a BNN; measure its weights separately</title><desc id="d">Functional architecture and the documented MNIST 32,16 setting.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">02 / Predict with a BNN; measure its weights separately</text><rect x="30" y="95" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="127" font-size="19">A · Input x</text><text x="42" y="160" font-size="16">MNIST: 10 × 10 → 100</text><path d="M310 140 L345 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="95" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="127" font-size="19">B · Binary MLP</text><text x="362" y="160" font-size="16">Hidden widths: 32, 16</text><path d="M630 140 L665 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="95" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="127" font-size="19">C · Class logits</text><text x="682" y="160" font-size="16">10 outputs → task loss</text><rect x="30" y="270" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="302" font-size="19">D · Weight snapshot</text><text x="42" y="335" font-size="16">Exclude batch normalization</text><path d="M310 315 L345 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">E · Binary blocks</text><text x="362" y="335" font-size="16">0/1 encoding; 4 × 4 tiles</text><path d="M630 315 L665 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="270" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="302" font-size="19">F · BDM and entropy</text><text x="682" y="335" font-size="16">Diagnostics, not loss terms</text><path d="M485 190 L170 260" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="417" font-size="18">B: binarized weights and activations; batch normalization after each hidden layer.</text></g></svg>