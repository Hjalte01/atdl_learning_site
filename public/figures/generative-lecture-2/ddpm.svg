<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="DDPM: learning the correction, then repeating it">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">DDPM: learning the correction, then repeating it</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN · clean x₀, sampled t and known noise ε; schedule is fixed</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">A · Corruption</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">xₜ = √ᾱₜ x₀ + √(1−ᾱₜ) ε</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">B · Denoiser εθ(xₜ,t)</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">U-Net receives image + time</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">C · Squared noise loss</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Compare to ε; update θ</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">SAMPLE · θ fixed; start xT ~ N(0,I); t decreases</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Current state xₜ</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">No clean target at inference</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Same denoiser → mean μθ</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Add σₜ z at intermediate steps</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Carry xₜ₋₁ forward</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Repeat until clean output</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY TRACE · one scalar training example</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">x₀ = 2, ᾱₜ = 0.64, ε = −1</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">A gives xₜ = 1</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">B predicts −0.5</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">C gives loss = 0.25</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Sampling mean ≈ 1.304</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">αₜ = 0.8; βₜ = 0.2</text>
</svg>