<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Same score, different sampler drift">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Same score, different sampler drift</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">REVERSE SDE · backward duration h &gt; 0</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">xₜ + time t</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Score sθ ≈ ∇ log pₜ</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Subtract (f − g²sθ)h</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Add fresh g√h z</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">xₜ₋h</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Repeat with new noise</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">PROBABILITY-FLOW ODE · backward duration h &gt; 0</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">xₜ + time t</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Same score function</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Subtract (f − ½g²sθ)h</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">No fresh sampling noise</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">xₜ₋h</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Repeat deterministic updates</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY · xₜ = 2; f = 0; g = 1; sθ = −0.5; h = 0.1</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Reverse SDE</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">1.95 + √0.1 z</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Probability-flow ODE</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">1.975</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Ideal shared marginals</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Not identical trajectories</text>
</svg>