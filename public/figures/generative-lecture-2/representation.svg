<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-label="Choose the evolving representation explicitly">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Choose the evolving representation explicitly</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">PIXELS · model the image coordinates directly</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Training image x</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Shape H × W × C</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Noise + learned denoising</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Same image coordinate space</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Final pixel state</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Image output</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">WAVELETS · invertible rearrangement, not necessarily compression</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Image</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Apply fixed DWT</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Frequency bands</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Generate band coefficients</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Apply inverse DWT</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Reconstructed image</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">LEARNED LATENT · components trained in separate stages</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Encoder E(x) = z</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Shape h × w × c</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Latent denoiser</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Fit on noisy encoded images</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Decoder D(z)</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Reconstruct from clean latent</text>
<text x="30" y="460" fill="#c5d5ee" font-family="sans-serif" font-size="18">LATENT GENERATION · no source-image encoder needed</text>
<rect x="30" y="475" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="502" fill="#fff" font-family="sans-serif" font-size="17">Draw latent noise zT</text>
<text x="42" y="526" fill="#fff" font-family="sans-serif" font-size="17">Condition encoded separately</text>
<path d="M324,509 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="475" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="502" fill="#fff" font-family="sans-serif" font-size="17">Repeat frozen denoiser</text>
<text x="367" y="526" fill="#fff" font-family="sans-serif" font-size="17">Carry latent toward z₀</text>
<path d="M649,509 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="475" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="502" fill="#fff" font-family="sans-serif" font-size="17">Decode D(z₀)</text>
<text x="692" y="526" fill="#fff" font-family="sans-serif" font-size="17">Final image</text>
</svg>