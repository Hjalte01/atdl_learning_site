<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Different metrics ask different questions">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Different metrics ask different questions</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">CLASS CONFIDENCE AND FEATURE DISTRIBUTIONS · slides 32 and 34</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Inception Score ↑</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Confident + varied classes</text>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">FID ↓</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Mean / covariance mismatch</text>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">CMMD ↓</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Kernel discrepancy in CLIP</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">COVERAGE AND UTILITY · slide 33</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Precision</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Are generated samples near real?</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Recall</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Does generation cover real?</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Task scores / human tests</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Does it serve the intended use?</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY 1D FID · real mean 0, SD 1; generated mean 1, SD 2</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Mean penalty</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">(0 − 1)² = 1</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Spread penalty</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">(1 − 2)² = 1</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Sum = 2</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Calculated, not benchmark data</text>
</svg>