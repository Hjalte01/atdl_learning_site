<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Flow matching: train on directions, sample with a solver">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Flow matching: train on directions, sample with a solver</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN · slide 17 convention: time 0 = noise; time 1 = data</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Pair x₀ = −2, x₁ = 2</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Draw t = 0.25</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Interpolate xₜ = −1</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Target u = x₁ − x₀ = 4</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Fit vθ(xₜ,t) to u</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Update θ using squared error</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">SAMPLE · θ fixed; data endpoint absent; h = 0.25</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">t = 0; x = −2</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Toy v = 4</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">t = 0.25; x = −1</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">x ← x + h v</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">t = 0.5; x = 0</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Call field again</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">CONTINUE · a constant perfect toy field; real learned fields can curve</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">t = 0.5; x = 0</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Carry current state</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">t = 0.75; x = 1</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Call field again</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">t = 1; x = 2</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Stop at data boundary</text>
</svg>