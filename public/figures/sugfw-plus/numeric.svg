<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Trace a two-patch image through A and B">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Trace a two-patch image through A and B</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY: scalar features; natural logs; λ = 6</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Patch 1: q = 1, F = 2</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">U₁ = 0</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Patch 2: q = .5, F = 10</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">U₂ = ln 2 = .6931</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">exp(6U) = [1, 64]</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Weights = [1/65, 64/65]</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">PGDR: normalized weighted feature versus mean uncertainty</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">f = (2 + 64 × 10) / 65</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">f = 9.8769</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">u = (0 + .6931) / 2</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">u = .3466 nats</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Uniform feature mean = 6</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">λ emphasizes patch 2</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">SOFTMAX LIMITS: feature magnitude is retained</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Equal U → equal weights</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Global average pooling</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Larger λ → sharper weights</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Potential surrogate bias</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Feature stays a mixture</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">No new human target</text>
</svg>
