<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="GSCU: cover the uncertainty spectrum, one per cluster">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">GSCU: cover the uncertainty spectrum, one per cluster</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY STEP 1: random cluster A has uncertainties [.1, .3, .5]</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Start with D⁰ empty</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Pick median u = .3</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Add that image to D¹</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Its feature cluster is covered</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">No target mask queried yet</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Selection is still offline</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">STEP 2: new cluster B has [.2, .6]</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Distance from .3: [.1, .3]</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Max-min chooses .6</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">D² uncertainties [.3, .6]</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Two feature clusters covered</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Not centroid-nearest</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Not necessarily highest u</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">STEP 3: cluster C has [.05, .4, .65]</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Nearest distances [.25,.1,.05]</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Choose u = .05</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">D³ = [.3, .6, .05]</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Uncertainty range expands</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">After M picks: annotate</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">No retraining between picks</text>
</svg>
