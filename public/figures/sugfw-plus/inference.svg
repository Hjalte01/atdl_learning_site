<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Inference: replace the uncertainty-encoder branch">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Inference: replace the uncertainty-encoder branch</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN-TIME PROMPT: computed from a stored PFUC map</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">K-view U_i is available</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Encode with E_un</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">True surrogate embedding</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Decoder uses Fᵘ_i</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">g learns to imitate it</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Embedding MSE target</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">TEST-TIME PROMPT: predicted from the current image</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">New X → adapted encoder</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Features F; retain pool Ū</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">g(F, Ū) → F̂ᵘ</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Discard uncertainty encoder</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Decoder(F, F̂ᵘ) → mask</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">No manual point / box</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">SHIFT TO TEST: learned imitation is approximate</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">No fresh K-view U required</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">No annotation query</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Ū comes from training pool</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Not from test ground truth</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Prompt error can matter</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">No calibration guarantee</text>
</svg>
