<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="UPFT training: two losses, different targets">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">UPFT training: two losses, different targets</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">SEGMENTATION PATH: the decoder receives the encoded stored map</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Image → encoder + LoRA</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Features F_i</text>
<path d="M167,191 V205 H787 V191" fill="none" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Stored U_i → E_un</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Prompt embedding Fᵘ_i</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Decoder(F_i, Fᵘ_i) → P_i</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Human y → Dice + CE</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">PREDICTOR PATH: learn the prompt available at test time</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Features F_i + pool mean Ū</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Lightweight transformer g</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Estimated embedding F̂ᵘ_i</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Compare with E_un(U_i)</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Squared embedding error</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Ramp-weighted MSE loss</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">PARAMETERS: pretrained image weights stay frozen</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Train rank-32 LoRA</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Train mask decoder</text>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Train uncertainty encoder</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Train uncertainty predictor</text>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">All share total loss</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">300 epochs, batch size 16</text>
</svg>
