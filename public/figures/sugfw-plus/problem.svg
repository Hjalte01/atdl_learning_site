<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="One query before any target-domain annotation">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">One query before any target-domain annotation</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">CONVENTIONAL MULTI-ROUND AL: an initial target-label set is needed</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Initial annotated images</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Train a task model</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Score and query pool</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Annotate new examples</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Retrain, then query again</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Several annotation rounds</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">SUGFW+: pretrained SAM supplies the initial signals</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Entire target pool unlabeled</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">SAM is already pretrained</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Feature + uncertainty</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Select one batch of M</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Human masks → UPFT</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Adapt SAM once</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">TWO DIFFERENT SAVINGS: no dataset-specific SSL, no test-time TTA</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Selection still uses K views</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Everything-mode masks</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Training learns a predictor</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Imitate prompt embedding</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Test: one image pathway</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">No K-view mask generation</text>
</svg>
