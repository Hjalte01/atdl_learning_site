<svg xmlns="http://www.w3.org/2000/svg" width="960" height="685" viewBox="0 0 960 685" role="img" aria-label="A → B → C → D: select images, then adapt SAM">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">A → B → C → D: select images, then adapt SAM</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">A · PFUC: fixed pretrained SAM, no target labels</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Image X: H × W</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Encoder → F: C₀ × H′ × W′</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">K views + automatic masks</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Binary unions → mean mask</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Patch entropy U: H′ × W′</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Surrogate, not task truth</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">B · PGDR: two summaries of the same patch grid</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">F + U → softmax weights</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Weighted sum f in R^C₀</text>
<path d="M167,336 V350 H787 V336" fill="none" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">U → average pooling</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Scalar image uncertainty u</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">One pair (f, u) per image</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">No annotation yet</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">C · GSCU: clusters in f, greedy distances in u</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">C = M feature clusters</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">One image per cluster</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Median first; max-min next</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Visit random new clusters</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">One query batch D̂</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">Human target masks y</text>
<text x="30" y="520" fill="#c5d5ee" font-family="sans-serif" font-size="18">D · UPFT: labeled data plus stored uncertainty maps</text>
<rect x="30" y="535" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="560" fill="white" font-family="sans-serif" font-size="17">LoRA image encoder</text>
<text x="42" y="583" fill="white" font-family="sans-serif" font-size="17">U → uncertainty encoder</text>
<path d="M308,580 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="535" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="560" fill="white" font-family="sans-serif" font-size="17">Prompt decoder; train g</text>
<text x="352" y="583" fill="white" font-family="sans-serif" font-size="17">Dice + CE + embedding MSE</text>
<path d="M618,580 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="535" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="560" fill="white" font-family="sans-serif" font-size="17">Adapted automatic SAM</text>
<text x="662" y="583" fill="white" font-family="sans-serif" font-size="17">Held-out image → mask</text>
</svg>
