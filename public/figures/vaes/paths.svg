<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Three tasks; only training changes weights">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Three tasks; only training changes weights</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN · both networks learn</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Observed x → B</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">μ, ℓ and random ε → C</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Sample z → D</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Evaluate observed x</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">E: reconstruction + KL</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Minimize negative ELBO</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">RECONSTRUCT · keep φ and θ fixed</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Observed x → B</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Infer qφ(z | x)</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Draw z from qφ</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Or choose mean explicitly</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">D: distribution over x</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Display mean or sample x</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">GENERATE · keep θ fixed; no encoder needed</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">No input image</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Draw z from prior N(0,I)</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">D: decode z</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Observation distribution</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Draw x from pθ(x | z)</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Mean display is a summary</text>
</svg>