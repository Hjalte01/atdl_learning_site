<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Keep the random draw fixed while taking the derivative">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Keep the random draw fixed while taking the derivative</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">FORWARD · box C, one coordinate</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Draw ε ~ N(0,1)</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">No learned noise parameters</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Encoder gives μ and ℓ</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">σ = exp(ℓ/2)</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Combine z = μ + σε</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Same Gaussian sample law</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">BACKWARD · reconstruction derivative arriving from decoder D</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">∂R/∂z</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Decoder input derivative</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">To mean head</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">∂R/∂μ = ∂R/∂z</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">To log-variance head</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">∂R/∂ℓ = (∂R/∂z) σε/2</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">NUMERICAL EXAMPLE · μ = 0.5, σ = 0.5, ε = 1</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Forward: z = 1</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Decoder: y ≈ 0.7311</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Reconstruction ∂R/∂z</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">≈ −0.2689</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Reconstruction ∂R/∂ℓ</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">≈ −0.0672; then add KL</text>
</svg>