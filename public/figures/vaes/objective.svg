<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Two KL divergences, two different jobs">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Two KL divergences, two different jobs</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">COMPUTABLE ELBO · maximize this expected objective at E</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Expected reconstruction</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">E q [log pθ(x | z)]</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Subtract prior KL</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">KL(qφ(z | x) || p(z))</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">ELBO = reconstruction − KL</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Teaching example: −2.4</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">EXACT IDENTITY · the gap is usually unavailable</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">ELBO</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Example: −2.4</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Add posterior KL</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">KL(qφ(z | x) || pθ(z | x))</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Exact log evidence</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Example: −2.1; gap 0.3</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">BOUND VS ESTIMATE</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Expected ELBO ≤ log pθ(x)</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Nonnegative posterior KL</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">One sampled estimate</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Can fluctuate above evidence</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Zero prior KL ≠ tight bound</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Prior is not the posterior</text>
</svg>