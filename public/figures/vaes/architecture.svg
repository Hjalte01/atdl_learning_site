<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="A probabilistic encoder teaches a probabilistic generator">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">A probabilistic encoder teaches a probabilistic generator</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">INFERENCE · observed x enters a shared recognition network</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">A: observation x</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">D observed coordinates</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">B: encoder qφ(z | x)</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">tanh hidden layer</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Two J-dimensional heads</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Mean μ; log variance ℓ</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">SAMPLING AND DECODING · ε ~ N(0,I), independent of learned weights</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">C: z = μ + exp(ℓ/2) ⊙ ε</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">J latent coordinates</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">D: decoder pθ(x | z)</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">tanh hidden layer</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Observation parameters</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">D probabilities, or μx and ℓx</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">OBJECTIVE · compare to A, and compare B to the fixed prior</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">D + observed x</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Reconstruction log likelihood</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">B + prior p(z) = N(0,I)</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Analytic prior KL</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">E: log likelihood − KL</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Gradients update φ and θ</text>
</svg>