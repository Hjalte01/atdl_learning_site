<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="AEVB repeats stochastic learning, not iterative inference">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">AEVB repeats stochastic learning, not iterative inference</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">ITERATION k · weights and optimizer state enter from the previous step</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Replace minibatch</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">M observations from N</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Replace random noise</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">L draws per observation</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">B → C → D → E</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Compute sampled objective</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">JOINT UPDATE · gradient ascent on ELBO, or descent on its negative</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Backpropagate to φ and θ</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Do not detach latent z</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Apply optimizer update</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Paper uses Adagrad</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Carry new weights forward</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Return to the next minibatch</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">REPORTED SETTINGS · Algorithm 1 and §5</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">M = 100</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">L = 1 per observation</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Exact Gaussian prior KL</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Only reconstruction sampled</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Weight prior in experiments</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Approximate MAP training</text>
</svg>