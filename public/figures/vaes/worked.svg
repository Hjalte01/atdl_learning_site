<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="One binary observation through the same five boxes">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">One binary observation through the same five boxes</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">FORWARD · constructed scalar example, not a trained MLP</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">A: x = 1; B: μ = σ = 0.5</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">C: ε = 1 gives z = 1</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">D: w = 1 and b = 0</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">y = sigmoid(wz+b) ≈ 0.7311</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">E: R ≈ 0.3133; K ≈ 0.4431</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Negative ELBO ≈ 0.7564</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">BACKWARD · reconstruction plus prior KL</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Decoder input derivative</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">∂R/∂z ≈ −0.2689</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Mean gradient ≈ 0.2311</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Log-var gradient ≈ −0.4422</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Decoder weight and bias</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Both gradients ≈ −0.2689</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">ILLUSTRATIVE DESCENT · η = 0.1; treat encoder outputs as parameters</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">μ new ≈ 0.4769</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">ℓ new ≈ −1.3421</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">w new ≈ 1.0269</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">b new ≈ 0.0269</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Real encoder: chain rule</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Update shared neural weights</text>
</svg>