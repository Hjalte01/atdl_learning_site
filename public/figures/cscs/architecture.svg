<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-label="CSCS: global adaptation, local selection">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">CSCS: global adaptation, local selection</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">A · SSL MODEL: train on the unlabeled pool, then freeze</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Xᵢ: 3D image tensor</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Masked multi-view inputs</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Swin-UNETR SSL</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Encoder + reconstruction</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Embedding zᵢ in R⁷⁶⁸</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">R reconstruction views</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">B · TWO BRANCHES: derive scalars from the frozen outputs</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Reconstruction views</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Variance → raw Uᵢ</text>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Embeddings + k neighbors</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Inverse distance → raw Tᵢ</text>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Pool min-max scaling</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Normalized Uᵢ and Tᵢ</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">C · QUERY: combine geometry, budget and cluster-local scores</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Ranks → DCR; B / √N</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Pacing → global γ</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">B clusters; merge small</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Sᵢ = Tᵢ^(1−γ) Uᵢ^γ</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Winners + global fill</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">B scan identifiers</text>
<text x="30" y="520" fill="#c5d5ee" font-family="sans-serif" font-size="18">D · TASK MODEL: human labels arrive only here</text>
<rect x="30" y="535" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="560" fill="white" font-family="sans-serif" font-size="17">Expert volume masks</text>
<text x="42" y="583" fill="white" font-family="sans-serif" font-size="17">Selected images + labels</text>
<path d="M308,580 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="535" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="560" fill="white" font-family="sans-serif" font-size="17">Separate 3D nnU-Net</text>
<text x="352" y="583" fill="white" font-family="sans-serif" font-size="17">Supervised training</text>
<path d="M618,580 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="535" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="560" fill="white" font-family="sans-serif" font-size="17">Held-out volume → mask</text>
<text x="662" y="583" fill="white" font-family="sans-serif" font-size="17">No query score at test</text>
</svg>
