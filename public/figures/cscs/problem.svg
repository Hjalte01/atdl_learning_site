<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-label="The first batch is a separate decision">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">The first batch is a separate decision</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">RANDOM INITIALIZATION: no informed acquisition</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Unlabeled 3D volumes</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Sample B uniformly</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Expert masks for B scans</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Train task segmenter</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Predict held-out masks</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Variable first-set quality</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">WARM-START AL: labels and a task model already exist</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Initial labeled set L₀</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Train task segmenter</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Score unlabeled pool</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Query another batch</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Retrain and repeat</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">An iterative process</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">CSCS: learn signals without task labels, then query once</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Unlabeled training pool</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Self-supervised learning</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Pool-aware clustered query</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">One annotation batch</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Train first nnU-Net</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">Later AL not evaluated</text>
</svg>
