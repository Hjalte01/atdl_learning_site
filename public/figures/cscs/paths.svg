<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-label="Weight updates and test prediction happen in separate paths">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Weight updates and test prediction happen in separate paths</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">SELF-SUPERVISED TRAINING: no annotation masks</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Masked training images</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Reconstruction task</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Update SSL model weights</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Swin-UNETR framework</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Freeze for acquisition</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Store embeddings / scores</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">SUPERVISED TRAINING: selected volumes only</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Fixed query identifiers</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Expert image-mask pairs</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Update nnU-Net weights</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">3D full resolution</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Trained task segmenter</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">250-epoch protocol</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">INFERENCE: acquisition statistics are no longer needed</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Held-out 3D volume</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Standard preprocessing</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Trained nnU-Net forward</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Predict voxel labels</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Evaluate against reference</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">Dice and boundary metrics</text>
</svg>
