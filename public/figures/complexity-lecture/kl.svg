<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="A continuous point does not have finite prior mass">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">A continuous point does not have finite prior mass</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">GAUSSIAN TOY · P = N(0,1); Q = N(0,σ²)</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">σ = 1</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">KL = 0 bits</text>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">σ = 0.5</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">KL ≈ 0.459 bits</text>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">σ = 0.1</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">KL ≈ 2.608 bits</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">VARIATIONAL OBJECTIVE · likelihood loss and KL in bits</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Expected data code</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">E_Q[−log₂ p(S | w)]</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Prior-relative cost</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">KL₂(Q || P)</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Sum ≥ −log₂ p(S)</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Gap: KL to exact posterior</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">POINT LIMIT · σ → 0</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Variance shrinks</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Precision cost grows</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">KL diverges</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Density is not point mass</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Discrete point differs</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Cost = −log₂ P(point)</text>
</svg>