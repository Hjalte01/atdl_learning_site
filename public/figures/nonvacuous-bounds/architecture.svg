<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" role="img" aria-labelledby="t d"><title id="t">02 / Predictor + learned weight distribution</title><desc id="d">T-600 fully connected architecture; tensor dimensions and loss/KL paths are schematic.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="480" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">02 / Predictor + learned weight distribution</text><rect x="30" y="100" width="245" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="132" font-size="19">A · Images X</text><text x="44" y="162" font-size="16">B × 784 flattened pixels</text><path d="M285 143 L340 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="255" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="364" y="132" font-size="19">C · Dense ReLU</text><text x="364" y="162" font-size="16">784 → 600; B × 600 activations</text><path d="M615 143 L670 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="100" width="230" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="694" y="132" font-size="19">D · Linear output</text><text x="694" y="162" font-size="16">600 → 1; B scores</text><rect x="350" y="270" width="255" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="364" y="302" font-size="19">B · Sample weights v</text><text x="364" y="332" font-size="16">Q = N(w, diag(s)); v ∈ ℝᵈ</text><path d="M475 260 L475 196" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="270" width="230" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="694" y="302" font-size="19">E · Logistic loss</text><text x="694" y="332" font-size="16">Labels + scores → loss</text><path d="M795 196 L795 260" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="30" y="270" width="245" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="44" y="302" font-size="19">F · KL(Q ∥ Pλ)</text><text x="44" y="332" font-size="16">Pλ centered at fixed w₀</text><text x="30" y="407" font-size="18">Training: E + complexity from F → update w, s, λ. Prior center w₀ stays fixed.</text><text x="30" y="449" font-size="18">Inference: freeze Q → sample v → A, C, D → sign(score). No loss or KL.</text></g></svg>