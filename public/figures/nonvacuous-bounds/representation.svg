<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="t d"><title id="t">03 / Independent coordinates, unequal uncertainty</title><desc id="d">Toy two-weight view: an axis-aligned Gaussian near a prior; ellipses are not hard support boundaries.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="460" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">03 / Independent coordinates, unequal uncertainty</text><path d="M80 335 L470 335" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M80 335 L80 90" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="100" y="100" font-size="17">Weight 2</text><text x="365" y="364" font-size="17">Weight 1</text><ellipse cx="205" cy="220" rx="100" ry="100" fill="#d4eee7" stroke="#218c77" stroke-width="3"/><ellipse cx="315" cy="190" rx="110" ry="38" fill="#ddd9fa" stroke="#8264b0" stroke-width="3"/><circle cx="205" cy="220" r="5" fill="#218c77"/><circle cx="315" cy="190" r="5" fill="#8264b0"/><text x="130" y="285" font-size="18">Prior: w₀, λI</text><text x="265" y="140" font-size="18">Posterior: w, diag(s)</text><rect x="510" y="100" width="390" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="524" y="132" font-size="19">Sensitive coordinate → small variance</text><text x="524" y="162" font-size="16">Too much noise can flip predictions</text><rect x="510" y="235" width="390" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="524" y="267" font-size="19">KL also charges location and scale</text><text x="524" y="297" font-size="16">Extreme variances cost more</text><text x="30" y="415" font-size="18">Schematic ellipses: Gaussian draws can fall outside them. No loss landscape shown.</text></g></svg>