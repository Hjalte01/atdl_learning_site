<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="t d"><title id="t">01 / Same capacity, different generalization</title><desc id="d">Conceptual contrast; network capacity alone cannot distinguish learning real labels from fitting random labels.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="460" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">01 / Same capacity, different generalization</text><rect x="30" y="100" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="132" font-size="19">Large model class</text><text x="44" y="162" font-size="16">Parameters &gt; examples</text><path d="M300 143 L370 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="380" y="100" width="240" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="394" y="132" font-size="19">Real training labels</text><text x="394" y="162" font-size="16">Near-perfect fit</text><path d="M630 143 L670 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="100" width="230" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="694" y="132" font-size="19">Useful predictions</text><text x="694" y="162" font-size="16">Can we certify them?</text><rect x="380" y="260" width="240" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="394" y="292" font-size="19">Random training labels</text><text x="394" y="322" font-size="16">Near-perfect fit</text><path d="M160 196 L160 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M160 303 L370 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M630 303 L670 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="260" width="230" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="694" y="292" font-size="19">Chance test behavior</text><text x="694" y="322" font-size="16">Memorization is possible</text><text x="30" y="403" font-size="19">A useful proof must exploit more than the ability to fit the training sample.</text></g></svg>