<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" role="img" aria-labelledby="t d"><title id="t">05 / What carries forward across iterations?</title><desc id="d">Reparameterized optimization loop; distribution parameters persist and Gaussian noise is refreshed.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="480" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">05 / What carries forward across iterations?</text><rect x="30" y="90" width="265" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="122" font-size="19">Current wₜ, ρₜ, ηₜ</text><text x="44" y="152" font-size="16">sₜ = exp(2ρₜ); λₜ = exp(2ηₜ)</text><path d="M305 133 L345 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="355" y="90" width="265" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="369" y="122" font-size="19">Sample ξₜ ~ N(0, I)</text><text x="369" y="152" font-size="16">vₜ = wₜ + exp(ρₜ) ⊙ ξₜ</text><path d="M630 133 L670 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="90" width="230" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="694" y="122" font-size="19">Network forward</text><text x="694" y="152" font-size="16">Full training sample</text><rect x="680" y="270" width="230" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="694" y="302" font-size="19">Loss + KL penalty</text><text x="694" y="332" font-size="16">Backpropagate both paths</text><path d="M795 186 L795 260" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="30" y="270" width="590" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="302" font-size="19">Next wₜ₊₁, ρₜ₊₁, ηₜ₊₁ → repeat with fresh noise</text><text x="44" y="332" font-size="16">Reported experiments: RMSprop; Algorithm 1 illustrates vanilla SGD</text><path d="M670 313 L630 313" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M160 260 L160 186" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="410" font-size="19">Keep w₀ fixed. The sampled vₜ is not the next posterior mean.</text><text x="30" y="448" font-size="18">Positive scales from exponentiation; the prior search additionally requires λ &lt; c.</text></g></svg>