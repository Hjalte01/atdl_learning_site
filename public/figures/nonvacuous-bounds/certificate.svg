<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="t d"><title id="t">07 / Account for two sources of uncertainty</title><desc id="d">Toy nested inverse-KL calculation using the source Monte Carlo confidence settings.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="460" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">07 / Account for two sources of uncertainty</text><rect x="30" y="100" width="265" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="132" font-size="19">Freeze posterior Q</text><text x="44" y="162" font-size="16">n = 150,000 network draws</text><path d="M305 143 L345 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="355" y="100" width="265" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="369" y="132" font-size="19">Average training error</text><text x="369" y="162" font-size="16">Toy Monte Carlo value: 0.028</text><path d="M630 143 L670 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="100" width="230" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="694" y="132" font-size="19">First inverse KL</text><text x="694" y="162" font-size="16">δ′ = 0.01 → 0.02941</text><rect x="30" y="285" width="265" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="317" font-size="19">Grid prior + analytic KL</text><text x="44" y="347" font-size="16">Toy final budget BRE = 0.1</text><path d="M305 328 L345 328" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="355" y="285" width="265" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="369" y="317" font-size="19">Second inverse KL</text><text x="369" y="347" font-size="16">Population error ≤ 0.1697</text><path d="M795 196 L795 235" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M795 235 L490 235" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M490 235 L490 275" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="655" y="330" font-size="19">δ + δ′ = 0.035</text><text x="655" y="366" font-size="19">Confidence: 96.5%</text><text x="30" y="427" font-size="18">n counts independent network draws, not n × m independent predictions.</text></g></svg>