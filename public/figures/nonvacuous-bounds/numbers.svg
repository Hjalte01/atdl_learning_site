<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="t d"><title id="t">06 / One sampled weight, two gradient paths</title><desc id="d">Computed scalar illustration with a fixed prior; not MNIST or a final certificate.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="460" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">06 / One sampled weight, two gradient paths</text><rect x="30" y="95" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="127" font-size="19">A / B · x = 2; ξ = 1</text><text x="44" y="157" font-size="16">w = 0.4; √s = 0.1 → v = 0.5</text><path d="M300 138 L350 138" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="360" y="95" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="374" y="127" font-size="19">C / D · Score fᵥ(x) = 1</text><text x="374" y="157" font-size="16">Predict +1; label y = +1</text><path d="M630 138 L670 138" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="95" width="230" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="694" y="127" font-size="19">E · Logistic loss</text><text x="694" y="157" font-size="16">0.452; zero mistakes</text><rect x="30" y="275" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="44" y="307" font-size="19">F · Gaussian KL</text><text x="44" y="337" font-size="16">w₀ = 0; λ = 0.04 → 2.318 nats</text><path d="M300 318 L350 318" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="360" y="275" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="374" y="307" font-size="19">Complexity penalty</text><text x="374" y="337" font-size="16">m = 2000; δ = 0.05 → 0.0568</text><path d="M630 318 L670 318" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="275" width="230" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="694" y="307" font-size="19">Sampled objective</text><text x="694" y="337" font-size="16">0.452 + 0.0568 ≈ 0.509</text><path d="M795 191 L795 265" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="420" font-size="18">Toy dataset: 2000 identical observations. One draw estimates expected logistic loss.</text></g></svg>