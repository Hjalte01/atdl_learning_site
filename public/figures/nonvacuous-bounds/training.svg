<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="t d"><title id="t">04 / Train, optimize the distribution, certify</title><desc id="d">Three different stages with distinct learned and fixed quantities.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="560" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">04 / Train, optimize the distribution, certify</text><rect x="30" y="90" width="270" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="122" font-size="19">1 · Deterministic SGD</text><text x="44" y="152" font-size="16">Labels → learned wSGD</text><path d="M310 133 L350 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="360" y="90" width="550" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="374" y="122" font-size="19">Initialize posterior Q near the SGD solution</text><text x="374" y="152" font-size="16">Save original random initialization w₀ as prior center</text><path d="M635 185 L635 225" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="360" y="235" width="550" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="374" y="267" font-size="19">2 · Bound optimization: update w, s, λ</text><text x="374" y="297" font-size="16">Expected logistic loss + square-root complexity penalty</text><rect x="30" y="235" width="270" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="267" font-size="19">Fixed: data and w₀</text><text x="44" y="297" font-size="16">Fresh Gaussian draw each step</text><path d="M310 278 L350 278" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M635 331 L635 375" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="360" y="385" width="550" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="374" y="417" font-size="19">3 · Freeze Q and compute certificate</text><text x="374" y="447" font-size="16">Grid prior variance → Monte Carlo → two inverse-KL steps</text><text x="30" y="526" font-size="18">Optimizing the smooth objective does not replace final classification-error evaluation.</text></g></svg>