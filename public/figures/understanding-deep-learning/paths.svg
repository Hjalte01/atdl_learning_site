<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="Training changes weights; inference holds them fixed">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Training changes weights; inference holds them fixed</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN: repeat for successive batches</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Inputs + known labels</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">Forward pass; save states</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Loss → backward pass</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">Chain rule → derivatives</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Optimizer step</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Update θ; repeat</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">INFER: a new input, no label needed</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">New input x</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">Use learned θ</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Same prediction network</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Compute p(y = 1 | x)</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Probability or decision</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">No optimizer update</text>
</svg>