<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="Three data roles answer three different questions">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Three data roles answer three different questions</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">Model development and final assessment</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Training set</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">Fit each candidate’s θ</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Validation set</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">Select hyperparameters</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Reserved test set</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Assess selected model</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">Questions to keep separate</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Did the optimizer fit?</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">Inspect training objective</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Which candidate to use?</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Compare validation metric</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Does it generalize?</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Report held-out metric</text>
</svg>