<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="Attention routes values using input-dependent weights">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Attention routes values using input-dependent weights</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">One output token; basic single-head mechanism</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Query q and keys kₘ</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">Dot products → scores</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Softmax over sources</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">Weights sum to one</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Mix value vectors vₘ</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Output o = Σ aₘvₘ</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">Scalar teaching example, not learned token embeddings</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">q = 1; keys (0, log 3)</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">Scores (0, log 3)</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Weights (0.25, 0.75)</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Values (2, 6)</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">o = 0.25×2 + 0.75×6</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Contextual output = 5</text>
</svg>