<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Noise coordinates are not image labels">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Noise coordinates are not image labels</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">IMPLICIT DISTRIBUTION · probability mass moves through G</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Many draws z ∼ pz</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Simple noise distribution</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Same learned mapping G</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Different input coordinates</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Samples define pg</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Density need not be explicit</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">TEACHING EXAMPLE · z uniform on [0,1], scalar G(z) = z²</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">z = 0, ¼, ½, ¾, 1</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Evenly spaced inputs</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">x = 0, ¹⁄₁₆, ¼, ⁹⁄₁₆, 1</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Unevenly spaced outputs</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">P(x ≤ ¼) = ½</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Half the mass near zero</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">COLLAPSE · a different map G(z) = c</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">All input coordinates</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Even distant z values</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Same output c</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">No output diversity</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">May fool a weak D</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Does not match diverse data</text>
</svg>