<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Why the practical generator objective changes">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Why the practical generator objective changes</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">LET a BE THE FAKE LOGIT · D = sigmoid(a)</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">D = 0.01</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Strong rejection</text>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">D = 0.5</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Uncertain origin</text>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">D = 0.99</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Strong acceptance</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">MINIMAX · derivative of log(1 − D) with respect to a</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">−D = −0.01</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Weak early signal</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">−D = −0.5</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Intermediate signal</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">−D = −0.99</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Strong signal</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">NON-SATURATING · derivative of −log D with respect to a</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">D − 1 = −0.99</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Strong early signal</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">D − 1 = −0.5</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Intermediate signal</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">D − 1 = −0.01</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Weak signal near success</text>
</svg>