<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Learn a sampling map with a learned training signal">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Learn a sampling map with a learned training signal</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">FAKE PATH · z ∈ ℝᵈ → generated x ∈ ℝᴰ → one scalar</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">A: noise prior pz</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Sample z</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">B: generator Gθ</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Produce Gθ(z)</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">C: discriminator Dφ</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Probability of real origin</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">REAL PATH · training data enters the same discriminator C</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Real minibatch x</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">x ∈ ℝᴰ</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">C: same Dφ(x)</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Real target = 1</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">D: classification objective</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Fake target = 0</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">GRADIENT PATH · alternating players, shared differentiable connection</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Update φ: hold θ fixed</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Real and fake scores</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Update θ: hold φ fixed</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Backprop C → B</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Generate: keep only A → B</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">No discriminator required</text>
</svg>