<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Training alternates weights; sampling just transforms noise">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Training alternates weights; sampling just transforms noise</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">DISCRIMINATOR STEP · ascend log D(x) + log(1 − D(G(z)))</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Draw real x and noise z</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Compute fake G(z)</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Evaluate C on both</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Different origin labels</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Update φ only</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Generator weights fixed</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">GENERATOR STEP · practical loss −log D(G(z))</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Draw fresh noise z</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Compute fake G(z)</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Differentiate through C</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Do not update φ</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Update θ only</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Keep gradient to G(z)</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">SAMPLING · after training</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Draw new noise z</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">No real image input</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">One forward pass Gθ(z)</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Weights fixed</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Return synthetic image</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">No iterative denoising</text>
</svg>