<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-label="A scalar flow example, with noise at time zero">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">A scalar flow example, with noise at time zero</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">Training pair: noise z = 2, data x = 6</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">t = 0: state 2</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">t = 0.5: state 4</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">t = 1: state 6</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">Toy target velocity is x − z = 4</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Current state: 2</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Step: 2 + 0.5 × 4</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Next state: 4</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">This is arithmetic, not a trained generator</text>
<rect x="30" y="350" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="377" fill="#fff" font-family="sans-serif" font-size="18">Known pair for teaching</text>
<path d="M308,384 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="350" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="377" fill="#fff" font-family="sans-serif" font-size="18">Learned field can differ</text>
<path d="M618,384 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="350" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="377" fill="#fff" font-family="sans-serif" font-size="18">Large steps can err</text>
</svg>