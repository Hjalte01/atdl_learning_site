<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">04 / Training and prediction follow different paths</title><desc id="d">Training loop versus frozen point prediction; exact Bayesian prediction integrates parameters.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">04 / Training and prediction follow different paths</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Sample a fresh batch</text><text x="42" y="165" font-size="16">Data fixed; indices refreshed</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">A → B → C → D → E</text><text x="362" y="165" font-size="16">Forward, loss, backpropagate</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="132" font-size="19">F · Carry ω and velocity</text><text x="682" y="165" font-size="16">Update both, repeat</text><rect x="30" y="270" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="302" font-size="19">At prediction: freeze ω</text><text x="42" y="335" font-size="16">New image; no training label</text><path d="M310 315 L345 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">B → C only</text><text x="362" y="335" font-size="16">Class probabilities → argmax</text><path d="M630 315 L665 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="270" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="302" font-size="19">One point predictor</text><text x="682" y="335" font-size="16">No posterior sampler here</text><text x="30" y="415" font-size="18">Bayesian ideal: average probabilities over the posterior. It is a separate integral.</text></g></svg>