<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" role="img" aria-labelledby="t d"><title id="t">07 / A quantitative protocol, not invented curve points</title><desc id="d">Source-reported numerical settings and scaling ranges from Figures 4–7.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="540" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">07 / A quantitative protocol, not invented curve points</text><text x="30" y="95" font-size="19">MNIST · 784 → 800 ReLU → 10 · no L2 · default ε = 1, m = 0.9</text><rect x="30" y="130" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="162" font-size="19">Figure 4 · Batch sweep</text><text x="42" y="195" font-size="16">B from 1 to 1000; 10,000 steps</text><rect x="490" y="130" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="162" font-size="19">Reported outcome</text><text x="502" y="195" font-size="16">B ≲ 10 fails to train; interior peak</text><rect x="30" y="250" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="282" font-size="19">Figure 5 · Learning-rate sweep</text><text x="42" y="315" font-size="16">10,000 / ε steps; trend over 100×</text><rect x="490" y="250" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="282" font-size="19">Reported outcome</text><text x="502" y="315" font-size="16">Peak quality drops around ε ≳ 3</text><rect x="30" y="370" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="402" font-size="19">Figure 6 · Dataset-size sweep</text><text x="42" y="435" font-size="16">10,000 steps; five runs per curve</text><rect x="490" y="370" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="402" font-size="19">Reported outcome</text><t