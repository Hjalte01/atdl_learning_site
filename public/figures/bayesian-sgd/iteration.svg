<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="t d"><title id="t">06 / Constant noise does not mean identical steps</title><desc id="d">Computed no-momentum example with exact finite-batch correction.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="460" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">06 / Constant noise does not mean identical steps</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Start: N = 1000</text><text x="42" y="165" font-size="16">ε = 0.1; B = 100 → g = 0.9</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">Double ε and B</text><text x="362" y="165" font-size="16">ε = 0.2; B = 200 → g = 0.8</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="132" font-size="19">Exact correction</text><text x="682" y="165" font-size="16">B = 1000 / (1 + 0.9/0.2)</text><text x="680" y="230" font-size="16">≈ 181.8; round to a batch</text><rect x="30" y="285" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="317" font-size="19">Full batch: B = N</text><text x="42" y="350" font-size="16">g = 0; small-batch rule fails</text><rect x="350" y="285" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="317" font-size="19">Small B relative to N</text><text x="362" y="350" font-size="16">g ≈ εN/B gives linear scaling</text><rect x="670" y="285" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="317" font-size="19">Momentum m &lt; 1</text><text x="682" y="350" font-size="16">g ≈ εN / [B(1 − m)]</text><text x="30" y="430" font-size="18">Scaling preserves a model of noise intensity; stability and gradient covariance still matter.</text></g></svg>