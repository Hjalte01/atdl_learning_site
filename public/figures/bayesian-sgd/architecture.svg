<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">02 / SGD trains a predictor; evidence analyzes fit</title><desc id="d">Functional architecture of the shallow MNIST experiment, with tensor dimensions.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">02 / SGD trains a predictor; evidence analyzes fit</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">A · Batch X</text><text x="42" y="165" font-size="16">B × 784 pixels</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">B · Dense + ReLU</text><text x="362" y="165" font-size="16">B × 800 hidden activations</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="132" font-size="19">C · Softmax output</text><text x="682" y="165" font-size="16">B × 10 class probabilities</text><rect x="30" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="42" y="302" font-size="19">F · Update weights ω</text><text x="42" y="335" font-size="16">Batch gradient + momentum</text><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">E · Backpropagate</text><text x="362" y="335" font-size="16">Gradient for every weight</text><rect x="670" y="270" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="302" font-size="19">D · Cross-entropy</text><text x="682" y="335" font-size="16">Probabilities + B labels</text><path d="M790 200 L790 260" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M660 315 L630 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M340 315 L310 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="413" font-size="18">Evidence is a separate analysis—not an extra loss used by this MNIST network.</text></g></svg>