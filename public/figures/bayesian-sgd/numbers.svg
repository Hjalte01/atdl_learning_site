<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">05 / Trace one scalar SGD update</title><desc id="d">Computed toy for one coordinate of box F; no momentum and no trained model.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">05 / Trace one scalar SGD update</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">A–E · Toy batch gradient</text><text x="42" y="165" font-size="16">Mean = 0.3; full mean = 0.2</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">F · ω = 1; ε = 0.1</text><text x="362" y="165" font-size="16">Δω = −0.1 × 0.3 = −0.03</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="132" font-size="19">Carry ω = 0.97</text><text x="682" y="165" font-size="16">Next batch gives new error</text><rect x="30" y="270" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="302" font-size="19">Full-gradient drift</text><text x="42" y="335" font-size="16">−0.1 × 0.2 = −0.02</text><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">This batch’s deviation</text><text x="362" y="335" font-size="16">−0.1 × (0.3 − 0.2) = −0.01</text><rect x="670" y="270" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="302" font-size="19">N = 1000; B = 100</text><text x="682" y="335" font-size="16">g = 0.9 (not the deviation)</text><text x="30" y="415" font-size="18">The realized update error is −0.01; g scales covariance across possible batches.</text></g></svg>