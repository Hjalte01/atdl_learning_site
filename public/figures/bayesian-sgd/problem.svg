<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">01 / Fitting labels is not enough</title><desc id="d">Conceptual comparison based on the logistic-regression experiment; no measured values.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">01 / Fitting labels is not enough</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Same 800 MNIST images</text><text x="42" y="165" font-size="16">400 zeros + 400 ones</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">Informative labels</text><text x="362" y="165" font-size="16">Fit a reusable distinction</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="132" font-size="19">Accurate test predictions</text><text x="682" y="165" font-size="16">Confidence still matters</text><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">Randomized labels</text><text x="362" y="335" font-size="16">Fit arbitrary assignments</text><path d="M160 200 L160 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M160 315 L340 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M630 315 L665 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="270" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="302" font-size="19">Chance test predictions</text><text x="682" y="335" font-size="16">Can still fit training labels</text><text x="30" y="414" font-size="18">Evidence asks how much prior probability supports a good fit, not only whether a fit exists.</text></g></svg>