<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-label="Same endpoint fit; different costs and predictions">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Same endpoint fit; different costs and predictions</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">Toy training pairs: (−1, −1), (1, 1); degree 3; γ = 2</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Candidate A: f(x) = x</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">w = (0, 1, 0, 0)</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Endpoint residual = 0</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">Penalty = 2¹ = 2</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">At x = 0.5</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Prediction = 0.5</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">Compare two candidates, not all possible fits</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Candidate B: f(x) = x³</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">w = (0, 0, 0, 1)</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Endpoint residual = 0</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Penalty = 2³ = 8</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">At x = 0.5</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Prediction = 0.125</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">One gradient step from zero: σ² = 1; learning rate 0.1</text>
<rect x="30" y="350" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="377" fill="#fff" font-family="sans-serif" font-size="18">Residual gradient</text>
<text x="44" y="401" fill="#fff" font-family="sans-serif" font-size="18">(0, −2, 0, −2)</text>
<path d="M308,384 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="350" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="377" fill="#fff" font-family="sans-serif" font-size="18">New w = (0, .2, 0, .2)</text>
<text x="354" y="401" fill="#fff" font-family="sans-serif" font-size="18">Endpoint predictions ±.4</text>
<path d="M618,384 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="350" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="377" fill="#fff" font-family="sans-serif" font-size="18">Next penalty gradient</text>
<text x="664" y="401" fill="#fff" font-family="sans-serif" font-size="18">(0, .8, 0, 3.2)</text>
</svg>