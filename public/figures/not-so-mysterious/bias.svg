<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="Two ways to express a simplicity bias">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Two ways to express a simplicity bias</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">Hard restriction</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Choose degree two</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">Only terms 1, x, x²</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Fit available coefficients</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">Higher terms excluded</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Cannot adapt beyond it</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Even if data need more</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">Soft preference</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Choose degree 150</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">Many terms available</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Penalize higher orders</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Alternatives cost more</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Adapt complexity to data</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">No universal guarantee</text>
</svg>