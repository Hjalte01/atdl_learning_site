<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="Fixed features; learned coefficients; two loss terms">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Fixed features; learned coefficients; two loss terms</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">A → B → C: prediction</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">A: scalar input x</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">n examples in a batch</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">B: φ(x) = (1, x, …, xᴶ)</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">J + 1 fixed coordinates</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">C: weighted sum wᵀφ</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">One scalar prediction</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">Training objective receives two branches</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Prediction + target y</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">Squared residual / (2σ²)</text>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Coefficients w</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Add penalty Σ γʲwⱼ²</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Total objective L(w)</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Differentiate; update w</text>
<text x="320" y="266" fill="#fff" font-family="sans-serif" font-size="24">+</text>
</svg>