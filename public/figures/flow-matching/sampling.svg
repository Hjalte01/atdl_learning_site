<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Inference: freeze θ; carry the generated state forward">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Inference: freeze θ; carry the generated state forward</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">GENERAL · the network does not know a target endpoint z</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Draw X₀ ~ N(0,I)</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Set t = 0</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Evaluate uθ(Xₜ,t)</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Xnext = Xₜ + h uθ(Xₜ,t)</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Carry Xnext and t+h</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Repeat to t = 1</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">ORACLE TOY · constant velocity (4,−2), step h = 0.25</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">X₀ = (−2,1)</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">X₀.₂₅ = (−1,0.5)</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">X₀.₅ = (0,0)</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">X₀.₇₅ = (1,−0.5)</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">X₁ = (2,−1)</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Exact only for this toy field</text>
</svg>