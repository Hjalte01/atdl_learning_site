<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Trace one training example through A → B → C → loss">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Trace one training example through A → B → C → loss</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">A · a two-dimensional teaching example</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">z = (2, −1)</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">ε = (−2, 1)</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">t = 0.25</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">xₜ = (−1, 0.5)</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">v = z − ε = (4, −2)</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">This is velocity, not position</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">C · stipulate a prediction to see the loss</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">uθ = (3, −1)</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Prediction error = (−1, 1)</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Squared-error sum = 2</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Mean over 2 entries = 1</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Update network weights</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">No sampled ODE needed</text>
</svg>