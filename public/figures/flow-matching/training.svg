<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Training: build a known velocity target without an ODE">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Training: build a known velocity target without an ODE</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">A → B → C · fixed path recipe; trainable velocity network</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">A: data z, noise ε, time t</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">z, ε ∈ ℝᵈ; t is a scalar</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">B: xₜ = tz + (1−t)ε</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Network inputs: xₜ and t</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">C: uθ(xₜ,t) ∈ ℝᵈ</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">One predicted velocity / entry</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">TARGET → LOSS → UPDATE · endpoint z does not enter network</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">v = z − ε ∈ ℝᵈ</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Known from sampled pair</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">L = ||uθ(xₜ,t) − v||²</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Compare C with this target</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Gradient update of θ</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Resample z, ε, t next batch</text>
</svg>