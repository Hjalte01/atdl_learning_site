<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Latent generation: compress, learn a flow, then decode">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Latent generation: compress, learn a flow, then decode</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">AUTOENCODER TRAINING · a separate stage</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Image I</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Encoder produces latent z</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Reconstruct image D(z)</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Balance fidelity / regularity</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Trained encoder + decoder</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Freeze for this staged recipe</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">FLOW TRAINING · use encoded data as endpoints</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Latent z + noise ε + t</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Mix into latent state xₜ</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Time / prompt aware model</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Predict latent velocity</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Regress against z − ε</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Update flow network θ</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">INFERENCE · no source image required for text-to-image</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Latent noise + prompt y</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Prompt fixed during sampling</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">ODE → generated latent</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">State evolves, θ stays fixed</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Decoder → output image</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Compression limits fidelity</text>
</svg>