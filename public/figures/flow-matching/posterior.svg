<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="One location: several possible endpoints, one mean velocity">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">One location: several possible endpoints, one mean velocity</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY · t = 0.5, x = 0.5; equal priors on z = −1 and z = +1</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Endpoint −1</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">u(x|−1) = −3</text>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Endpoint +1</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">u(x|+1) = +1</text>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Posterior weights</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">0.1192 and 0.8808</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">MARGINAL FIELD · posterior weights depend on current x and t</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Weighted negative target</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">0.1192 × (−3) = −0.3576</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Weighted positive target</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">0.8808 × 1 = 0.8808</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Sum: u(x,t) ≈ 0.5232</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Not uniform mean −1</text>
</svg>