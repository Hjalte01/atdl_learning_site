<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-label="K-NN: construct, select, then freeze for prediction">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">K-NN: construct, select, then freeze for prediction</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">CONSTRUCT: training data; distance rule fixed externally</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Store labeled points</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">S_train = {(xᵢ, yᵢ)}</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Choose candidate K values</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">For example: 1, 3, 5</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Candidate rules h_K</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Same stored examples</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">SELECT: use separate validation examples and their labels</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Compute predictions</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">For every candidate K</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Compare validation loss</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Choose a rule</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Freeze K and stored data</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Evaluate on untouched test</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">INFER: new input x; no new target label</text>
<rect x="30" y="350" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="377" fill="#fff" font-family="sans-serif" font-size="18">Compute distances</text>
<text x="44" y="401" fill="#fff" font-family="sans-serif" font-size="18">Use stored xᵢ and rule d</text>
<path d="M308,384 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="350" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="377" fill="#fff" font-family="sans-serif" font-size="18">Sort and take K nearest</text>
<text x="354" y="401" fill="#fff" font-family="sans-serif" font-size="18">Retrieve their labels yᵢ</text>
<path d="M618,384 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="350" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="377" fill="#fff" font-family="sans-serif" font-size="18">Sum labels; take sign</text>
<text x="664" y="401" fill="#fff" font-family="sans-serif" font-size="18">Return prediction h_K(x)</text>
</svg>