<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-label="Hedge over three rounds: η = ln 2; two actions">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Hedge over three rounds: η = ln 2; two actions</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">ROUND 1: begin with cumulative losses C₀ = (0, 0)</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">p₁ = (1/2, 1/2)</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">Observe losses (0, 1)</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Expected loss = 1/2</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">New totals C₁ = (0, 1)</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Weights (1, 1/2)</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Normalize → p₂ = (2/3, 1/3)</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">ROUND 2: lower previous loss gets more probability</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">p₂ = (2/3, 1/3)</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">Observe losses (1, 0)</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Expected loss = 2/3</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">New totals C₂ = (1, 1)</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Weights (1/2, 1/2)</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Normalize → p₃ = (1/2, 1/2)</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">ROUND 3: compare accumulated loss to one fixed action</text>
<rect x="30" y="350" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="377" fill="#fff" font-family="sans-serif" font-size="18">p₃ = (1/2, 1/2)</text>
<text x="44" y="401" fill="#fff" font-family="sans-serif" font-size="18">Observe losses (0, 1)</text>
<path d="M308,384 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="350" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="377" fill="#fff" font-family="sans-serif" font-size="18">Expected total = 5/3</text>
<text x="354" y="401" fill="#fff" font-family="sans-serif" font-size="18">Best fixed total = 1</text>
<path d="M618,384 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="350" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="377" fill="#fff" font-family="sans-serif" font-size="18">Expected regret = 2/3</text>
<text x="664" y="401" fill="#fff" font-family="sans-serif" font-size="18">Sampled runs may differ</text>
</svg>