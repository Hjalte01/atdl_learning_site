<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-label="Soft selection: carry a distribution into prediction">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Soft selection: carry a distribution into prediction</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">LEARN: prior π fixed independently of the certification sample</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Observe sample losses</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">Evaluate candidate rules</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Choose posterior ρ</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">Fit versus KL(ρ || π)</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Carry forward ρ</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Not necessarily Bayes</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">RANDOMIZED INFERENCE: Definition 4.25</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Sample h from ρ</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">A fresh draw per prediction</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Observe new input x</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Apply sampled rule h</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Output h(x)</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Bound average risk over ρ</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY: two equal-error classifiers; π = (1/2, 1/2)</text>
<rect x="30" y="350" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="377" fill="#fff" font-family="sans-serif" font-size="18">Keep ρ = (1/2, 1/2)</text>
<text x="44" y="401" fill="#fff" font-family="sans-serif" font-size="18">KL = 0</text>
<rect x="340" y="350" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="377" fill="#fff" font-family="sans-serif" font-size="18">Concentrate ρ = (1, 0)</text>
<text x="354" y="401" fill="#fff" font-family="sans-serif" font-size="18">KL = ln 2</text>
<rect x="650" y="350" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="377" fill="#fff" font-family="sans-serif" font-size="18">Majority vote differs</text>
<text x="664" y="401" fill="#fff" font-family="sans-serif" font-size="18">Needs Section 4.9 analysis</text>
</svg>