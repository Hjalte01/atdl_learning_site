<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-label="The feedback protocol determines the next update">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">The feedback protocol determines the next update</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">FULL INFORMATION: all losses revealed after choosing</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Draw action A_t</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">From probabilities p_t</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Observe every loss</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">ℓ_t,1 through ℓ_t,K</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Update every total</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Carry C_t forward</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">BANDIT: only chosen action loss revealed</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Draw action A_t</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">From probabilities p_t</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Observe only ℓ_t,A_t</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Other losses hidden</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Estimate loss vector</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Importance weighting</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">REPEAT: online action and learning remain interleaved</text>
<rect x="30" y="350" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="377" fill="#fff" font-family="sans-serif" font-size="18">Past totals C_(t−1)</text>
<text x="44" y="401" fill="#fff" font-family="sans-serif" font-size="18">Compute next p_t</text>
<path d="M308,384 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="350" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="377" fill="#fff" font-family="sans-serif" font-size="18">Choose → observe</text>
<text x="354" y="401" fill="#fff" font-family="sans-serif" font-size="18">One round of feedback</text>
<path d="M618,384 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="350" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="377" fill="#fff" font-family="sans-serif" font-size="18">New totals C_t</text>
<text x="664" y="401" fill="#fff" font-family="sans-serif" font-size="18">Next round t + 1</text>
</svg>