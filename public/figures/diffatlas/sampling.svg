<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" role="img" aria-labelledby="title desc"><title id="title">03 / Inference: replace → denoise → repeat</title><desc id="desc">At each time step, noise the observed scan to the matching noise level, replace only the image channels, and denoise the pair while retaining the evolving mask.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526880"/></marker></defs><rect width="900" height="525" rx="20" fill="#f0f5fa"/><style>text{font-family:Arial,sans-serif;fill:#17304b;font-size:19px}.small{font-size:16px}.title{font-size:25px;font-weight:bold}.line{stroke:#526880;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="42" class="title">03 / Inference: replace → denoise → repeat</text><rect x="30" y="85" width="240" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="44" y="117" class="">Observed patient scan</text><text x="44" y="145" class="small">Iinput stays available</text><path d="M275,126 L325,126" class="line"/><rect x="340" y="85" width="250" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="354" y="117" class="">Noise to current t</text><text x="354" y="145" class="small">√ᾱₜ Iinput + √(1−ᾱₜ) ε</text><path d="M465,175 L465,220" class="line"/><rect x="340" y="235" width="250" height="86" rx="12" fill="#ffe8cf" stroke="#91a7b7"/><text x="354" y="267" class="">Replace IMAGE part</text><text x="354" y="295" class="small">[new Iₜ, evolving Sₜ]</text><rect x="30" y="235" width="240" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="44" y="267" class="">Current mask state Sₜ</text><text x="44" y="295" class="small">start Sₜ with random noise</text><path d="M275,277 L330,277" class="line"/><path d="M595,277 L625,277" class="line"/><rect x="635" y="235" width="235" height="86" rx="12" fill="#e4ddf6" stroke="#91a7b7"/><text x="649" y="267" class="">Same trained denoiser</text><text x="649" y="295" class="small">then reverse-step sampler</text><path d="M755,325 L755,380" class="line"/><rect x="620" y="390" width="250" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="634" y="422" class="">Next pair at t − 1</text><text x="634" y="450" class="small">keep its mask; repeat</text><path d="M620,432 L150,432 L150,328" class="line"/><text x="30" y="492" class="">Finish near t = 0 → decode the final SDF into segmentation labels.</text></svg>