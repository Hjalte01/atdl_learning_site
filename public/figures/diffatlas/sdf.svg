<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">04 / Give the mask a sense of distance</title><desc id="desc">A signed distance field changes smoothly from positive outside through zero at the boundary to negative inside.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526880"/></marker></defs><rect width="900" height="400" rx="20" fill="#f0f5fa"/><style>text{font-family:Arial,sans-serif;fill:#17304b;font-size:19px}.small{font-size:16px}.title{font-size:25px;font-weight:bold}.line{stroke:#526880;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="42" class="title">04 / Give the mask a sense of distance</text><rect x="45" y="135" width="70" height="75" rx="8" fill="#ffe2bd" stroke="#8599a9"/><text x="70" y="180" class="">3</text><rect x="119" y="135" width="70" height="75" rx="8" fill="#ffe2bd" stroke="#8599a9"/><text x="144" y="180" class="">2</text><rect x="193" y="135" width="70" height="75" rx="8" fill="#ffe2bd" stroke="#8599a9"/><text x="218" y="180" class="">1</text><rect x="267" y="135" width="70" height="75" rx="8" fill="#ffffff" stroke="#8599a9"/><text x="292" y="180" class="">0</text><rect x="341" y="135" width="70" height="75" rx="8" fill="#d3c1f0" stroke="#8599a9"/><text x="366" y="180" class="">-1</text><rect x="415" y="135" width="70" height="75" rx="8" fill="#d3c1f0" stroke="#8599a9"/><text x="440" y="180" class="">-2</text><rect x="489" y="135" width="70" height="75" rx="8" fill="#d3c1f0" stroke="#8599a9"/><text x="514" y="180" class="">-1</text><rect x="563" y="135" width="70" height="75" rx="8" fill="#ffffff" stroke="#8599a9"/><text x="588" y="180" class="">0</text><rect x="637" y="135" width="70" height="75" rx="8" fill="#ffe2bd" stroke="#8599a9"/><text x="662" y="180" class="">1</text><rect x="711" y="135" width="70" height="75" rx="8" fill="#ffe2bd" stroke="#8599a9"/><text x="736" y="180" class="">2</text><rect x="785" y="135" width="70" height="75" rx="8" fill="#ffe2bd" stroke="#8599a9"/><text x="810" y="180" class="">3</text><text x="35" y="98" class="">A one-dimensional slice through a toy organ: distance to the nearest boundary</text><text x="50" y="255" class="">Outside: positive</text><text x="335" y="255" class="">Inside: negative</text><text x="670" y="255" class="">Outside: positive</text><text x="45" y="315" class="">The zeros mark the boundary. Threshold at 0 to recover this binary toy mask.</text><text x="45" y="352" class="small">Teaching convention: negative inside; the paper does not specify its sign convention.</text></svg>