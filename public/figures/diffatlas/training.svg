<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">02 / Training: learn what belongs together</title><desc id="desc">Clean scan and signed distance mask are noised together. A time-aware shared denoiser predicts noise for both. The squared error updates its weights.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526880"/></marker></defs><rect width="900" height="400" rx="20" fill="#f0f5fa"/><style>text{font-family:Arial,sans-serif;fill:#17304b;font-size:19px}.small{font-size:16px}.title{font-size:25px;font-weight:bold}.line{stroke:#526880;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="42" class="title">02 / Training: learn what belongs together</text><rect x="30" y="100" width="230" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="44" y="132" class="">A · Clean pair x₀</text><text x="44" y="160" class="small">[image I, mask SDF S]</text><path d="M265,142 L310,142" class="line"/><rect x="320" y="100" width="240" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="334" y="132" class="">B · Add known noise</text><text x="334" y="160" class="small">xₜ = √ᾱₜ x₀ + √(1−ᾱₜ) ε</text><path d="M565,142 L610,142" class="line"/><rect x="620" y="100" width="250" height="86" rx="12" fill="#e4ddf6" stroke="#91a7b7"/><text x="634" y="132" class="">C · Shared denoiser</text><text x="634" y="160" class="small">εθ(Iₜ, Sₜ, t)</text><rect x="620" y="245" width="250" height="86" rx="12" fill="#e4ddf6" stroke="#91a7b7"/><text x="634" y="277" class="">D · Predict BOTH noises</text><text x="634" y="305" class="small">[ε̂ image, ε̂ mask]</text><path d="M745,190 L745,235" class="line"/><rect x="280" y="245" width="280" height="86" rx="12" fill="#ffe8cf" stroke="#91a7b7"/><text x="294" y="277" class="">E · Compare with true ε</text><text x="294" y="305" class="small">L = E ‖ε − ε̂‖²</text><path d="M615,287 L570,287" class="line"/><text x="30" y="365" class="">Only training uses a ground-truth mask. The loss changes θ, the learned weights.</text></svg>