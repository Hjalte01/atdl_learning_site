<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">05 / Why add noise to a perfectly good scan?</title><desc id="desc">At high noise the denoiser expects a weak image signal; near the end it expects a clean image. The replacement must match that time.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526880"/></marker></defs><rect width="900" height="400" rx="20" fill="#f0f5fa"/><style>text{font-family:Arial,sans-serif;fill:#17304b;font-size:19px}.small{font-size:16px}.title{font-size:25px;font-weight:bold}.line{stroke:#526880;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="42" class="title">05 / Why add noise to a perfectly good scan?</text><rect x="35" y="110" width="255" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="49" y="142" class="">Early: ᾱ = 0.01</text><text x="49" y="170" class="small">0.10 × scan + 0.995 × noise</text><text x="50" y="235" class="">Mostly noise</text><text x="50" y="273" class="small">Weak patient-specific signal</text><rect x="325" y="110" width="255" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="339" y="142" class="">Middle: ᾱ = 0.50</text><text x="339" y="170" class="small">0.707 × scan + 0.707 × noise</text><text x="340" y="235" class="">Signal + uncertainty</text><text x="340" y="273" class="small">Both coefficients are √0.5</text><rect x="615" y="110" width="255" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="629" y="142" class="">Late: ᾱ = 0.99</text><text x="629" y="170" class="small">0.995 × scan + 0.10 × noise</text><text x="630" y="235" class="">Mostly patient scan</text><text x="630" y="273" class="small">Precise image information</text><text x="35" y="348" class="">ᾱ is remaining signal variance, not the fraction of clean pixels.</text></svg>