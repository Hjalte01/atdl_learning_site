<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">06 / Follow one pair of numbers through training</title><desc id="desc">Toy image and mask values with a known noise draw demonstrate forward corruption, noise prediction, loss, and clean reconstruction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526880"/></marker></defs><rect width="900" height="450" rx="20" fill="#f0f5fa"/><style>text{font-family:Arial,sans-serif;fill:#17304b;font-size:19px}.small{font-size:16px}.title{font-size:25px;font-weight:bold}.line{stroke:#526880;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="42" class="title">06 / Follow one pair of numbers through training</text><rect x="30" y="90" width="390" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="44" y="122" class="">Clean pair: x₀ = [0.8, −0.4]</text><text x="44" y="150" class="small">Known noise: ε = [0.2, −1.0]</text><rect x="470" y="90" width="395" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="484" y="122" class="">Choose ᾱ = 0.64</text><text x="484" y="150" class="small">Signal weight 0.8; noise weight 0.6</text><path d="M235,185 L235,220" class="line"/><rect x="30" y="230" width="390" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="44" y="262" class="">Noisy pair xₜ = [0.76, −0.92]</text><text x="44" y="290" class="small">0.8 × x₀ + 0.6 × ε</text><path d="M425,271 L460,271" class="line"/><rect x="470" y="230" width="395" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="484" y="262" class="">Suppose ε̂ = [0.1, −0.8]</text><text x="484" y="290" class="small">Squared-error sum: 0.01 + 0.04 = 0.05</text><text x="35" y="373" class="">Clean estimate: (xₜ − 0.6 ε̂) / 0.8 = [0.875, −0.55]</text><text x="35" y="415" class="small">With perfect noise prediction, this algebra recovers [0.8, −0.4] exactly.</text></svg>