<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">01 / What object does the model learn?</title><desc id="desc">Four segmentation paradigms contrasted: direct mapping, atlas registration, conditional mask diffusion, and joint image-mask diffusion.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526880"/></marker></defs><rect width="900" height="440" rx="20" fill="#f0f5fa"/><style>text{font-family:Arial,sans-serif;fill:#17304b;font-size:19px}.small{font-size:16px}.title{font-size:25px;font-weight:bold}.line{stroke:#526880;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="42" class="title">01 / What object does the model learn?</text><text x="30" y="92" class="">Feedforward</text><rect x="280" y="58" width="260" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="294" y="90" class="">Scan → network</text><text x="294" y="118" class="small">learn a direct mapping</text><path d="M550,100 L610,100" class="line"/><rect x="625" y="58" width="245" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="639" y="90" class="">Mask</text><text x="639" y="118" class="small">one forward pass</text><text x="30" y="182" class="">Classical atlas</text><rect x="280" y="148" width="260" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="294" y="180" class="">Labeled reference pair</text><text x="294" y="208" class="small">find a deformation φ</text><path d="M550,190 L610,190" class="line"/><rect x="625" y="148" width="245" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="639" y="180" class="">Warped atlas mask</text><text x="639" y="208" class="small">S = Aₛ ∘ φ</text><text x="30" y="272" class="">Mask diffusion</text><rect x="280" y="238" width="260" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="294" y="270" class="">Noisy mask + scan</text><text x="294" y="298" class="small">learn p(S | I)</text><path d="M550,280 L610,280" class="line"/><rect x="625" y="238" width="245" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="639" y="270" class="">Denoised mask</text><text x="639" y="298" class="small">scan is the condition</text><text x="30" y="362" class="">DiffAtlas</text><rect x="280" y="328" width="260" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="294" y="360" class="">Noisy image + noisy SDF</text><text x="294" y="388" class="small">learn p(I, S) jointly</text><path d="M550,370 L610,370" class="line"/><rect x="625" y="328" width="245" height="86" rx="12" fill="#dbece7" stroke="#91a7b7"/><text x="639" y="360" class="">Denoised pair</text><text x="639" y="388" class="small">replace image at test time</text></svg>