<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="A prompt token is different from an object query">
<rect width="960" height="560" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="28" y="40" font-family="sans-serif" font-size="24" fill="#eef4ff">A prompt token is different from an object query</text>
<text x="28" y="82" font-family="sans-serif" font-size="18" fill="#c5d5ee">A AND B · INPUT REPRESENTATIONS</text>
<rect x="28" y="98" width="278" height="94" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="40" y="125" font-family="sans-serif" font-size="17" fill="#eef4ff">Vision: F has N × d channels</text>
<text x="40" y="148" font-family="sans-serif" font-size="17" fill="#eef4ff">One cached grid per frame</text>
<rect x="340" y="98" width="278" height="94" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" font-family="sans-serif" font-size="17" fill="#eef4ff">Text + exemplar tokens</text>
<text x="352" y="148" font-family="sans-serif" font-size="17" fill="#eef4ff">Prompt has L × d channels</text>
<rect x="652" y="98" width="278" height="94" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="125" font-family="sans-serif" font-size="17" fill="#eef4ff">B: conditioned grid N × d</text>
<text x="664" y="148" font-family="sans-serif" font-size="17" fill="#eef4ff">Same positions, new context</text>
<text x="28" y="232" font-family="sans-serif" font-size="18" fill="#c5d5ee">C · OUTPUT SLOTS, NOT USER-SUPPLIED OBJECTS</text>
<rect x="28" y="248" width="278" height="94" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="40" y="275" font-family="sans-serif" font-size="17" fill="#eef4ff">Q = 200 learned queries</text>
<text x="40" y="298" font-family="sans-serif" font-size="17" fill="#eef4ff">Decoder states Q × d</text>
<rect x="340" y="248" width="278" height="94" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="275" font-family="sans-serif" font-size="17" fill="#eef4ff">One shared presence token</text>
<text x="352" y="298" font-family="sans-serif" font-size="17" fill="#eef4ff">Predicts concept existence</text>
<rect x="652" y="248" width="278" height="94" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="275" font-family="sans-serif" font-size="17" fill="#eef4ff">Queries give boxes + scores</text>
<text x="664" y="298" font-family="sans-serif" font-size="17" fill="#eef4ff">D maps features to masks</text>
<text x="28" y="382" font-family="sans-serif" font-size="18" fill="#c5d5ee">D · INSTANCE MASKS AND SEMANTIC MAP</text>
<rect x="28" y="398" width="278" height="94" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="40" y="425" font-family="sans-serif" font-size="17" fill="#eef4ff">Instance: per-object masks</text>
<text x="40" y="448" font-family="sans-serif" font-size="17" fill="#eef4ff">H × W pixels per mask</text>
<rect x="340" y="398" width="278" height="94" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="425" font-family="sans-serif" font-size="17" fill="#eef4ff">Semantic: matching pixels</text>
<text x="352" y="448" font-family="sans-serif" font-size="17" fill="#eef4ff">No instance identity required</text>
<rect x="652" y="398" width="278" height="94" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="425" font-family="sans-serif" font-size="17" fill="#eef4ff">Video: per-object memory</text>
<text x="664" y="448" font-family="sans-serif" font-size="17" fill="#eef4ff">Tracks ID through time</text>
</svg>
