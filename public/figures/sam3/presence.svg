<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Recognition gates every local candidate score">
<rect width="960" height="560" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="28" y="40" font-family="sans-serif" font-size="24" fill="#eef4ff">Recognition gates every local candidate score</text>
<text x="28" y="82" font-family="sans-serif" font-size="18" fill="#c5d5ee">C → D · SAME PRESENCE FACTOR FOR ALL QUERIES</text>
<rect x="28" y="98" width="278" height="94" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="40" y="125" font-family="sans-serif" font-size="17" fill="#eef4ff">Global token → MLP</text>
<text x="40" y="148" font-family="sans-serif" font-size="17" fill="#eef4ff">r = p(concept present)</text>
<rect x="340" y="98" width="278" height="94" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" font-family="sans-serif" font-size="17" fill="#eef4ff">Query i → local score</text>
<text x="352" y="148" font-family="sans-serif" font-size="17" fill="#eef4ff">aᵢ = p(match | present)</text>
<rect x="652" y="98" width="278" height="94" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="125" font-family="sans-serif" font-size="17" fill="#eef4ff">Final score sᵢ = r × aᵢ</text>
<text x="664" y="148" font-family="sans-serif" font-size="17" fill="#eef4ff">Retain scores above .5</text>
<text x="28" y="232" font-family="sans-serif" font-size="18" fill="#c5d5ee">TOY POSITIVE IMAGE: r = .8</text>
<rect x="28" y="248" width="278" height="94" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="40" y="275" font-family="sans-serif" font-size="17" fill="#eef4ff">Local scores: .9, .7, .4</text>
<text x="40" y="298" font-family="sans-serif" font-size="17" fill="#eef4ff">Three illustrative queries</text>
<path d="M309,294 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="248" width="278" height="94" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="275" font-family="sans-serif" font-size="17" fill="#eef4ff">Final: .72, .56, .32</text>
<text x="352" y="298" font-family="sans-serif" font-size="17" fill="#eef4ff">Two candidates pass .5</text>
<path d="M621,294 H647" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="652" y="248" width="278" height="94" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="275" font-family="sans-serif" font-size="17" fill="#eef4ff">r falls to .2?</text>
<text x="664" y="298" font-family="sans-serif" font-size="17" fill="#eef4ff">All scores fall below .5</text>
<text x="28" y="382" font-family="sans-serif" font-size="18" fill="#c5d5ee">LEARNING: ABSENT CONCEPTS TEACH THE GLOBAL BRANCH</text>
<rect x="28" y="398" width="278" height="94" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="40" y="425" font-family="sans-serif" font-size="17" fill="#eef4ff">Presence BCE: positives</text>
<text x="40" y="448" font-family="sans-serif" font-size="17" fill="#eef4ff">and hard negatives</text>
<path d="M309,444 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="398" width="278" height="94" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="425" font-family="sans-serif" font-size="17" fill="#eef4ff">Per-query classification</text>
<text x="352" y="448" font-family="sans-serif" font-size="17" fill="#eef4ff">only on positive concepts</text>
<path d="M621,444 H647" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="652" y="398" width="278" height="94" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="425" font-family="sans-serif" font-size="17" fill="#eef4ff">Local unmatched queries</text>
<text x="664" y="448" font-family="sans-serif" font-size="17" fill="#eef4ff">still get negative labels</text>
</svg>
