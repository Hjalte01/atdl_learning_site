<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 465" role="img" aria-labelledby="t d"><title id="t">08 / More samples can move a model toward the peak</title><desc id="d">Toy capacity comparison only; these ratios do not compute test error.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="465" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">08 / More samples can move a model toward the peak</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Hold T fixed</text><text x="42" y="165" font-size="16">Illustrative EMC = 18,000</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">n = 4,000</text><text x="362" y="165" font-size="16">EMC / n = 4.5</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="132" font-size="19">n = 18,000</text><text x="682" y="165" font-size="16">EMC / n = 1</text><text x="365" y="245" font-size="17">Effectively overparameterized</text><text x="680" y="245" font-size="17">Near the fitting threshold</text><rect x="30" y="295" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="327" font-size="19">Data generally helps</text><text x="42" y="360" font-size="16">But the threshold also moves</text><rect x="490" y="295" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="327" font-size="19">A local reversal can appear</text><text x="502" y="360" font-size="16">Check width AND training duration</text><text x="30" y="435" font-size="17">The real translation comparison uses 4k versus 18k sentences; its EMC is not measured here.</text></g></svg>