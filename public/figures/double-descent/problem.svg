<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">01 / A second descent changes the question</title><desc id="d">Schematic test-error curve; no measured coordinates.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">01 / A second descent changes the question</text><path d="M65 345 L880 345" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M65 345 L65 85" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="80" y="95" font-size="18">Test error</text><text x="650" y="380" font-size="18">Effective complexity →</text><path d="M90 145 C170 350 250 300 330 235 S425 65 470 125 S530 310 850 320" fill="none" stroke="#8264b0" stroke-width="5"/><path d="M460 100 V345" stroke="#bc6d28" stroke-dasharray="6 6"/><text x="100" y="325" font-size="17">Underfitting</text><text x="350" y="80" font-size="18">Barely fits the data</text><text x="640" y="285" font-size="18">Many possible fits</text><text x="30" y="420" font-size="18">The peak is near the fitting threshold—not a fixed universal parameter count.</text></g></svg>