<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">02 / The five-layer CNN: a complete functional path</title><desc id="d">Source Appendix B.1 CNN; dimensions derived for CIFAR input and listed pooling sizes.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">02 / The five-layer CNN: a complete functional path</text><rect x="30" y="95" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="127" font-size="19">A · CIFAR input</text><text x="42" y="160" font-size="16">B × 3 × 32 × 32</text><path d="M310 140 L345 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="95" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="127" font-size="19">B · Conv / BN / ReLU</text><text x="362" y="160" font-size="16">Pool 1 → B × k × 32 × 32</text><path d="M630 140 L665 140" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="95" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="127" font-size="19">C · Conv / BN / ReLU</text><text x="682" y="160" font-size="16">Pool 2 → B × 2k × 16 × 16</text><path d="M790 195 L790 250" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="260" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="292" font-size="19">D · Conv / BN / ReLU</text><text x="682" y="325" font-size="16">Pool 2 → B × 4k × 8 × 8</text><path d="M660 305 L630 305" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="260" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="292" font-size="19">E · Conv / BN / ReLU</text><text x="362" y="325" font-size="16">Pool 8 → B × 8k × 1 × 1</text><path d="M340 305 L310 305" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="30" y="260" width="270" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="42" y="292" font-size="19">F · Flatten + linear</text><text x="42" y="325" font-size="16">B × C logits → probabilities</text><text x="30" y="405" font-size="18">All convolutions: 3 × 3, stride 1, padding 1. C = 10 or 100 classes.</text></g></svg>