<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">04 / What does width actually change?</title><desc id="d">CNN activation sizes at stage E and F; width is not effective model complexity.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">04 / What does width actually change?</text><rect x="30" y="105" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="137" font-size="19">k = 8</text><text x="42" y="170" font-size="16">E: B × 64 pooled features</text><path d="M465 150 L485 150" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="490" y="105" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="137" font-size="19">F · 64 → C</text><text x="502" y="170" font-size="16">A learned linear classifier</text><rect x="30" y="265" width="420" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="297" font-size="19">k = 16</text><text x="42" y="330" font-size="16">E: B × 128 pooled features</text><path d="M465 310 L485 310" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="490" y="265" width="420" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="502" y="297" font-size="19">F · 128 → C</text><text x="502" y="330" font-size="16">Earlier convolutions also widen</text><text x="30" y="415" font-size="18">Doubling k changes every stage; EMC also depends on data, optimizer and duration.</text></g></svg>