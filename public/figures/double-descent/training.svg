<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">03 / Same predictor, different experimental paths</title><desc id="d">Train with observed labels; measure errors; freeze parameters and normalization state at inference.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">03 / Same predictor, different experimental paths</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Train · X and fixed labels</text><text x="42" y="165" font-size="16">Augment X when configured</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">A → F · Cross-entropy</text><text x="362" y="165" font-size="16">Backpropagate through CNN</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="132" font-size="19">G · Optimizer update</text><text x="682" y="165" font-size="16">Carry weights and state</text><rect x="30" y="270" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="302" font-size="19">Infer · New clean X</text><text x="42" y="335" font-size="16">No label input; freeze model</text><path d="M310 315 L345 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">A → F · Forward only</text><text x="362" y="335" font-size="16">Probabilities → argmax</text><path d="M630 315 L665 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="270" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="302" font-size="19">H · Evaluation</text><text x="682" y="335" font-size="16">Compare to held-out label</text><text x="30" y="414" font-size="18">Width sweep: fresh models. Epoch sweep: checkpoints of the same training run.</text></g></svg>