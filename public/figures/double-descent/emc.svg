<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">05 / Effective model complexity belongs to a procedure</title><desc id="d">Toy estimates across independent training datasets; epsilon equals 0.1.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">05 / Effective model complexity belongs to a procedure</text><rect x="30" y="105" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="137" font-size="19">Fix procedure T and D</text><text x="42" y="170" font-size="16">Architecture, optimizer, budget</text><path d="M310 150 L345 150" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="105" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="137" font-size="19">For each sample size n</text><text x="362" y="170" font-size="16">Train on fresh sampled sets</text><path d="M630 150 L665 150" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="105" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="137" font-size="19">Average training error</text><text x="682" y="170" font-size="16">Compare to ε = 0.1</text><text x="55" y="270" font-size="19">Toy n</text><text x="265" y="270" font-size="19">100</text><text x="440" y="270" font-size="19">200</text><text x="615" y="270" font-size="19">300</text><text x="790" y="270" font-size="19">400</text><text x="55" y="325" font-size="19">Mean error</text><text x="265" y="325" font-size="19">0.02</text><text x="440" y="325" font-size="19">0.06</text><text x="615" y="325" font-size="19">0.09</text><text x="790" y="325" font-size="19">0.14</text><text x="30" y="410" font-size="18">Largest passing tested 