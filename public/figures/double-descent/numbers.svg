<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">06 / A prediction, its loss, and its fitting error</title><desc id="d">Computed teaching example at classifier F, objective G, and evaluation H.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">06 / A prediction, its loss, and its fitting error</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">A–E · Toy features</text><text x="42" y="165" font-size="16">h = (1, 2); k here abstracted</text><path d="M310 145 L345 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="100" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="132" font-size="19">F · Two-class logits</text><text x="362" y="165" font-size="16">z = (log 3, 0) → p = (.75, .25)</text><path d="M630 145 L665 145" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="100" width="240" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="682" y="132" font-size="19">G · Observed label 2</text><text x="682" y="165" font-size="16">Loss = −log .25 ≈ 1.386</text><rect x="30" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="42" y="302" font-size="19">Backprop at F</text><text x="42" y="335" font-size="16">∂loss/∂z = (.75, −.75)</text><rect x="350" y="270" width="270" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="362" y="302" font-size="19">Argmax predicts class 1</text><text x="362" y="335" font-size="16">Training error = 1 on label 2</text><rect x="670" y="270" width="240" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="682" y="302" font-size="19">H · Clean label 1</text><text x="682" y="335" font-size="16">Clean error = 0</text><text x="30" y="415" font-size="18">Fixed corrupted labels can pull a locally correct clean prediction in the wrong direction.</text></g></svg>