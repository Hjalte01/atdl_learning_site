<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">07 / Fixed width, changing fitting capacity</title><desc id="d">Schematic training-time cases; not guaranteed monotonicity or measured curves.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">07 / Fixed width, changing fitting capacity</text><rect x="30" y="100" width="270" height="90" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="42" y="132" font-size="19">Small model</text><text x="42" y="165" font-size="16">Cannot fit the full set</text><rect x="350" y="100" width="270" height="90" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="362" y="132" font-size="19">Medium model</text><text x="362" y="165" font-size="16">Only barely fits at the end</text><rect x="670" y="100" width="240" height="90" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="682" y="132" font-size="19">Large model</text><text x="682" y="165" font-size="16">Can pass through the peak</text><path d="M45 340 L280 340 M45 340 V220" stroke="#71849a" fill="none"/><path d="M365 340 L600 340 M365 340 V220" stroke="#71849a" fill="none"/><path d="M685 340 L920 340 M685 340 V220" stroke="#71849a" fill="none"/><path d="M55 235 Q120 320 265 325 M375 235 Q425 370 465 300 T585 255 M695 235 C725 360 760 220 790 260 S835 325 905 327" stroke="#8264b0" stroke-width="4" fill="none"/><text x="75" y="375" font-size="17">More training →</text><text x="395" y="375" font-size="17">More training →</text><text x="715" y="375" font-size="17">More training →</text><text x="30" y="420" font-size="18">Weights, optimizer state and normalization statistics evolve; parameter count stays fixed.</text></g></svg>