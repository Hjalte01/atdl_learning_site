<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">02 / One state, two different destination questions</title><desc id="d">Two interval queries return same-shaped average-velocity tensors.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">02 / One state, two different destination questions</text><rect x="30" y="170" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="202" font-size="19">Current state zₜ</text><text x="44" y="232" font-size="16">32 × 32 × 4 latent</text><path d="M290 200 L345 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M290 225 L345 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="355" y="90" width="270" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="369" y="122" font-size="19">uθ(zₜ, r = 0.5, t = 1)</text><text x="369" y="152" font-size="16">Summarize half the interval</text><rect x="355" y="260" width="270" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="369" y="292" font-size="19">uθ(zₜ, r = 0, t = 1)</text><text x="369" y="322" font-size="16">Summarize all the interval</text><path d="M635 133 L670 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M635 303 L670 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="90" width="230" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="694" y="122" font-size="19">Average velocity</text><text x="694" y="152" font-size="16">32 × 32 × 4</text><rect x="680" y="260" width="230" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="694" y="292" font-size="19">Average velocity</text><text x="694" y="322" font-size="16">32 × 32 × 4</text><text x="30" y="410" font-size="18">A velocity tensor is not an average image. Destination time changes the question.</text></g></svg>