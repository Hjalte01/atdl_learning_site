<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" role="img" aria-labelledby="t d"><title id="t">03 / Training: predict, differentiate, build target</title><desc id="d">Unguided functional architecture with same-network JVP and detached target.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="620" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">03 / Training: predict, differentiate, build target</text><rect x="30" y="85" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="117" font-size="19">A · Latent x + noise ε</text><text x="44" y="147" font-size="16">VAE latent: 32 × 32 × 4</text><path d="M300 128 L335 128" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="85" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="359" y="117" font-size="19">B · Interpolate</text><text x="359" y="147" font-size="16">zₜ, r, t; vₜ = ε − x</text><path d="M605 128 L640 128" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="85" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="117" font-size="19">C · Transformer uθ</text><text x="664" y="147" font-size="16">Average-velocity prediction</text><path d="M470 182 L470 245" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="330" y="255" width="280" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="344" y="287" font-size="19">D · Same-network JVP</text><text x="344" y="317" font-size="16">Input tangent (vₜ, 0, 1)</text><path d="M470 350 L470 405" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="330" y="415" width="280" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="344" y="447" font-size="19">E · Target, then detach</text><text x="344" y="477" font-size="16">vₜ − (t − r) × JVP</text><rect x="650" y="415" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="447" font-size="19">F · Squared residual</text><text x="664" y="477" font-size="16">Updates network weights</text><path d="M620 458 L640 458" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M780 182 L780 405" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="553" font-size="18">Purple: learned model    Green: data / target    Orange: optimization</text><text x="30" y="586" font-size="18">No integrated trajectory labels. Stop-gradient applies to the entire target.</text></g></svg>