<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">05 / One flow-network call at inference</title><desc id="d">Fixed trained weights map noise to average velocity; subtract and decode.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">05 / One flow-network call at inference</text><rect x="30" y="100" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="132" font-size="19">Gaussian ε + class c</text><text x="44" y="162" font-size="16">Set destination 0, time 1</text><path d="M300 143 L335 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="100" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="132" font-size="19">Trained uθ(ε, 0, 1 | c)</text><text x="359" y="162" font-size="16">One network evaluation</text><path d="M605 143 L640 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="100" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="132" font-size="19">Subtract from ε</text><text x="664" y="162" font-size="16">ẑ₀ = ε − uθ</text><path d="M780 196 L780 255" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="270" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="664" y="302" font-size="19">Fixed VAE decoder</text><text x="664" y="332" font-size="16">Latent → 256 × 256 image</text><text x="30" y="291" font-size="20">No derivative or optimizer at inference.</text><text x="30" y="327" font-size="18">Guided model: guidance learned into the field.</text><text x="30" y="407" font-size="18">1-NFE counts flow-network calls; VAE decoding still requires computation.</text></g></svg>