<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">04 / A scalar example through the training boxes</title><desc id="d">Synthetic scalar example with total derivative 2 and loss 0.25.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">04 / A scalar example through the training boxes</text><rect x="30" y="95" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="127" font-size="19">A → B · x = 2, ε = 6</text><text x="44" y="157" font-size="16">t = 0.75, r = 0.25</text><path d="M300 138 L335 138" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="95" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="127" font-size="19">B · zₜ = 5, vₜ = 4</text><text x="359" y="157" font-size="16">Interval = 0.5</text><path d="M605 138 L640 138" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="95" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="127" font-size="19">C · Predict uθ = 2.5</text><text x="664" y="157" font-size="16">∂z uθ = 0.25; ∂t uθ = 1</text><rect x="30" y="260" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="292" font-size="19">D · JVP = 2</text><text x="44" y="322" font-size="16">0.25 × 4 + 1</text><path d="M300 303 L335 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="260" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="359" y="292" font-size="19">E · Target = 3</text><text x="359" y="322" font-size="16">4 − 0.5 × 2; detached</text><path d="M605 303 L640 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="260" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="292" font-size="19">F · Loss = 0.25</text><text x="664" y="322" font-size="16">(2.5 − 3)²; unweighted</text><text x="30" y="409" font-size="18">The target is frozen for this update, but changes when the model changes.</text></g></svg>