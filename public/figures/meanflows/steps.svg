<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">06 / Carry the new state into the next interval</title><desc id="d">One jump versus two jumps; exact displacements add along the same trajectory.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">06 / Carry the new state into the next interval</text><rect x="30" y="90" width="210" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="122" font-size="19">Start z₁</text><text x="44" y="152" font-size="16">Time 1</text><path d="M250 133 L645 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="325" y="111" font-size="18">One call: uθ(z₁, 0, 1)</text><rect x="655" y="90" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="669" y="122" font-size="19">Endpoint z₀</text><text x="669" y="152" font-size="16">Time 0</text><rect x="30" y="260" width="210" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="292" font-size="19">Start z₁</text><text x="44" y="322" font-size="16">Time 1</text><path d="M250 303 L335 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="260" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="292" font-size="19">Intermediate z₀.₅</text><text x="359" y="322" font-size="16">Call 1: uθ(z₁, 0.5, 1)</text><path d="M605 303 L645 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="655" y="260" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="669" y="292" font-size="19">Endpoint z₀</text><text x="669" y="322" font-size="16">Call 2: uθ(z₀.₅, 0, 0.5)</text><text x="30" y="404" font-size="18">Exact field: equal endpoints. Learned field: agreement is not guaranteed.</text></g></svg>