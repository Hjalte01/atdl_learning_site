<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-label="A round trip checks the representation">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">A round trip checks the representation</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">Encode, then decode: Eq. (6.2.14), schematic</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Data X</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">D × N</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Encoder fθ → Z</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">d × N</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Decoder gη → X̂</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">D × N</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">Continue from X̂; reuse the same encoder fθ</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Reconstructed X̂</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Encoder fθ → Ẑ</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">d × N</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Compare Z with Ẑ</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Feature-space feedback</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">Complementary roles in the training game</text>
<rect x="30" y="350" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="377" fill="#fff" font-family="sans-serif" font-size="18">Encoder exposes mismatch</text>
<path d="M308,384 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="350" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="377" fill="#fff" font-family="sans-serif" font-size="18">Decoder reduces mismatch</text>
<path d="M618,384 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="350" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="377" fill="#fff" font-family="sans-serif" font-size="18">Also structure the code</text>
<text x="664" y="401" fill="#fff" font-family="sans-serif" font-size="18">Agreement alone can fail</text>
</svg>