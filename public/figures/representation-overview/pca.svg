<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="A complete linear encoder–decoder: D = 2, d = 1">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">A complete linear encoder–decoder: D = 2, d = 1</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">A fixed teaching basis U = (1, 1) / √2</text>
<rect x="30" y="100" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="127" fill="#fff" font-family="sans-serif" font-size="18">Input x = (3, 1)</text>
<text x="44" y="151" fill="#fff" font-family="sans-serif" font-size="18">Two ambient coordinates</text>
<path d="M308,134 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="127" fill="#fff" font-family="sans-serif" font-size="18">Encode z = Uᵀx = 2√2</text>
<text x="354" y="151" fill="#fff" font-family="sans-serif" font-size="18">One latent coordinate</text>
<path d="M618,134 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="127" fill="#fff" font-family="sans-serif" font-size="18">Decode Uz = (2, 2)</text>
<text x="664" y="151" fill="#fff" font-family="sans-serif" font-size="18">Back in two dimensions</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">The signal assumption decides what gets discarded</text>
<rect x="30" y="225" width="275" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="44" y="252" fill="#fff" font-family="sans-serif" font-size="18">Reconstruction (2, 2)</text>
<text x="44" y="276" fill="#fff" font-family="sans-serif" font-size="18">Along the diagonal line</text>
<path d="M308,259 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="225" width="275" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="354" y="252" fill="#fff" font-family="sans-serif" font-size="18">Residual x − Uz = (1, −1)</text>
<text x="354" y="276" fill="#fff" font-family="sans-serif" font-size="18">Perpendicular to the line</text>
<path d="M618,259 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="225" width="275" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="664" y="252" fill="#fff" font-family="sans-serif" font-size="18">Squared error = 2</text>
<text x="664" y="276" fill="#fff" font-family="sans-serif" font-size="18">Not always pure noise</text>
</svg>