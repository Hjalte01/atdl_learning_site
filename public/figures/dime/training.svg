<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 505" role="img" aria-labelledby="t d"><title id="t">02 / Learn a prior; freeze it to explain a classifier</title><desc id="d">Training and inference paths use the same learned diffusion model.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="505" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">02 / Learn a prior; freeze it to explain a classifier</text><rect x="30" y="100" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="132" font-size="19">Training images</text><text x="44" y="162" font-size="16">CelebA faces; no labels</text><path d="M300 143 L335 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="100" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="132" font-size="19">Train DDPM</text><text x="359" y="162" font-size="16">Learn reverse transitions</text><path d="M605 143 L640 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="100" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="132" font-size="19">Face image prior</text><text x="664" y="162" font-size="16">Trained DDPM weights</text><rect x="30" y="290" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="322" font-size="19">Query + target label</text><text x="44" y="352" font-size="16">Image state changes</text><path d="M300 333 L335 333" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="290" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="322" font-size="19">Frozen DDPM</text><text x="359" y="352" font-size="16">Proposes image states</text><path d="M605 333 L640 333" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="290" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="322" font-size="19">Frozen classifier</text><text x="664" y="352" font-size="16">Input gradients guide edits</text><text x="30" y="432" font-size="18">Training updates generator weights. Explanation updates only image state.</text><text x="30" y="470" font-size="18">Classifier training is separate; the evaluation oracle is separate again.</text></g></svg>