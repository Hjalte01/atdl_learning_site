<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" role="img" aria-labelledby="t d"><title id="t">04 / Clean guidance steers a noisy transition</title><desc id="d">Full unconditional rollout feeds clean-image loss; scaled gradient shifts reverse mean.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="620" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">04 / Clean guidance steers a noisy transition</text><rect x="30" y="100" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="132" font-size="19">A · Current state zₜ</text><text x="44" y="162" font-size="16">128 × 128 × 3</text><path d="M300 143 L335 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="100" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="132" font-size="19">B · Full DDPM rollout</text><text x="359" y="162" font-size="16">zₜ → … → clean xₜ</text><path d="M605 143 L640 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="100" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="132" font-size="19">C · Class + proximity</text><text x="664" y="162" font-size="16">xₜ, target y, reference x</text><path d="M780 196 L780 255" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="265" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="297" font-size="19">D · Transfer gradient</text><text x="664" y="327" font-size="16">ĝz = gx / √αₜ</text><path d="M640 308 L605 308" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="265" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="297" font-size="19">E · Guided transition</text><text x="359" y="327" font-size="16">Mean μ − Σ ĝz</text><path d="M470 361 L470 415" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="425" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="359" y="457" font-size="19">Carry zₜ₋₁ forward</text><text x="359" y="487" font-size="16">Sample; repeat at t − 1</text><path d="M160 196 L160 308 L335 308" fill="none" stroke="#53677d" stroke-width="3" marker-end="url(#a)"/><text x="30" y="365" font-size="17">DDPM gives μ and Σ</text><text x="30" y="555" font-size="18">B uses repeated forward evaluations. No backpropagation through that rollout.</text><text x="30" y="590" font-size="18">Functional schematic; optional direct noisy-state ℓ₁ guidance omitted here.</text></g></svg>