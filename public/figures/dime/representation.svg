<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">03 / The representation is a noisy image</title><desc id="d">Three illustrative cumulative signal levels and their coefficients.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">03 / The representation is a noisy image</text><text x="30" y="91" font-size="20">zₜ = √αₜ × image + √(1 − αₜ) × noise     (paper αₜ is cumulative)</text><rect x="30" y="140" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="172" font-size="19">αₜ = 0.81</text><text x="44" y="202" font-size="16">0.90 × image</text><text x="44" y="258" font-size="19">0.436 × noise</text><rect x="340" y="140" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="354" y="172" font-size="19">αₜ = 0.64</text><text x="354" y="202" font-size="16">0.80 × image</text><text x="354" y="258" font-size="19">0.60 × noise</text><rect x="650" y="140" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="664" y="172" font-size="19">αₜ = 0.25</text><text x="664" y="202" font-size="16">0.50 × image</text><text x="664" y="258" font-size="19">0.866 × noise</text><text x="30" y="325" font-size="20">Each state remains an image-shaped tensor: 128 × 128 × 3.</text><text x="30" y="366" font-size="18">Increasing corruption weakens information about the original photograph.</text><text x="30" y="409" font-size="18">Teaching noise levels; not the experimental schedule. No compressed code.</text></g></svg>