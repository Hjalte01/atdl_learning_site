<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">07 / Reported image-distribution quality</title><desc id="d">Smile FID: DiVE 29.4, DiVE100 36.8, DiME 3.17. Lower is better.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">07 / Reported image-distribution quality</text><text x="30" y="87" font-size="18">CelebA · Smile · 128 × 128 · successful counterfactuals · FID ↓</text><text x="30" y="142" font-size="19">DiVE</text><rect x="220" y="115" width="470.4" height="38" rx="5" fill="#73859d"/><text x="700.4" y="142" font-size="19">29.4</text><text x="30" y="217" font-size="19">DiVE100</text><rect x="220" y="190" width="588.8" height="38" rx="5" fill="#73859d"/><text x="818.8" y="217" font-size="19">36.8</text><text x="30" y="292" font-size="19">DiME</text><rect x="220" y="265" width="50.72" height="38" rx="5" fill="#168373"/><text x="280.72" y="292" font-size="19">3.17</text><text x="220" y="361" font-size="16">0</text><text x="380" y="361" font-size="16">10</text><text x="540" y="361" font-size="16">20</text><text x="700" y="361" font-size="16">30</text><text x="30" y="408" font-size="18">Table 1 values. Different flip rates mean different successful subsets.</text></g></svg>