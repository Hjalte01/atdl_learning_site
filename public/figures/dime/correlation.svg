<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">08 / Compare correlation patterns, not just edit counts</title><desc id="d">Toy CD over two attributes: absolute differences sum to 0.15.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">08 / Compare correlation patterns, not just edit counts</text><rect x="30" y="100" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="132" font-size="19">Dataset label pairs</text><text x="44" y="162" font-size="16">Pearson correlations</text><path d="M300 143 L335 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="100" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="359" y="132" font-size="19">c: 0.60 and −0.20</text><text x="359" y="162" font-size="16">Ground-truth labels</text><rect x="30" y="270" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="44" y="302" font-size="19">Original → explanation</text><text x="44" y="332" font-size="16">Oracle attribute changes</text><path d="M300 313 L335 313" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="270" width="250" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="359" y="302" font-size="19">cᴹ: 0.50 and −0.15</text><text x="359" y="332" font-size="16">Correlations of changes</text><path d="M605 143 L640 218" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M605 313 L640 238" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="190" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="222" font-size="19">Absolute differences</text><text x="664" y="252" font-size="16">0.10 + 0.05 = 0.15</text><text x="30" y="413" font-size="18">Synthetic two-attribute example. Dataset correlation is not causal proof.</text></g></svg>