<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">01 / An explanation must satisfy several goals</title><desc id="d">Three complementary goals, not measurements.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">01 / An explanation must satisfy several goals</text><rect x="30" y="120" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="44" y="152" font-size="19">Flip the prediction</text><text x="44" y="182" font-size="16">Target: opposite decision</text><rect x="340" y="120" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="354" y="152" font-size="19">Preserve this input</text><text x="354" y="182" font-size="16">Keep identity and context</text><rect x="650" y="120" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="152" font-size="19">Remain plausible</text><text x="664" y="182" font-size="16">Use a learned face prior</text><text x="30" y="290" font-size="19">Tiny invisible perturbation: can flip a label without a visible explanation.</text><text x="30" y="332" font-size="19">Entirely different face: can be plausible without explaining this person.</text><text x="30" y="404" font-size="18">Schematic goals. Multiple plausible edits can expose different associations.</text></g></svg>