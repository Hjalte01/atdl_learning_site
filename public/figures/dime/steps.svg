<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 475" role="img" aria-labelledby="t d"><title id="t">06 / An outer trajectory with inner look-ahead rollouts</title><desc id="d">Noisy states move horizontally; clean previews refresh their guidance.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="475" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">06 / An outer trajectory with inner look-ahead rollouts</text><rect x="30" y="100" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="132" font-size="19">Outer state z₃</text><text x="44" y="162" font-size="16">Carry the noisy image</text><path d="M300 143 L335 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="100" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="359" y="132" font-size="19">Outer state z₂</text><text x="359" y="162" font-size="16">Carry the noisy image</text><path d="M605 143 L640 143" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="100" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="664" y="132" font-size="19">Outer state z₁</text><text x="664" y="162" font-size="16">Next step ends clean</text><path d="M160 196 L160 255" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M470 196 L470 255" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M780 196 L780 255" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="30" y="265" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="297" font-size="19">3-step clean rollout</text><text x="44" y="327" font-size="16">x₃ → new guidance</text><rect x="345" y="265" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="297" font-size="19">2-step clean rollout</text><text x="359" y="327" font-size="16">x₂ → new guidance</text><rect x="650" y="265" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="297" font-size="19">1-step clean rollout</text><text x="664" y="327" font-size="16">x₁ → new guidance</text><text x="30" y="402" font-size="19">Each preview guides the transition leaving its own outer state.</text><text x="30" y="442" font-size="18">Three-step schematic. The experiment starts at τ = 60, not 3.</text></g></svg>