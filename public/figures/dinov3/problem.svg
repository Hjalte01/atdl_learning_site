<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="One image, two kinds of representation">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">One image, two kinds of representation</text>
<text x="30" y="80" fill="#c5d5ee" font-family="sans-serif" font-size="18">GLOBAL TASK: recognize the scene</text>
<rect x="30" y="95" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="120" fill="white" font-family="sans-serif" font-size="17">Image of a bird on a branch</text>
<text x="42" y="143" fill="white" font-family="sans-serif" font-size="17">CLS summarizes the image</text>
<path d="M308,140 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="95" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="120" fill="white" font-family="sans-serif" font-size="17">Global classifier</text>
<text x="352" y="143" fill="white" font-family="sans-serif" font-size="17">Can improve with training</text>
<path d="M618,140 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="95" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="120" fill="white" font-family="sans-serif" font-size="17">Is a bird present?</text>
<text x="662" y="143" fill="white" font-family="sans-serif" font-size="17">No location required</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">DENSE TASK: preserve spatial distinctions</text>
<rect x="30" y="240" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="265" fill="white" font-family="sans-serif" font-size="17">Patch grid of same image</text>
<text x="42" y="288" fill="white" font-family="sans-serif" font-size="17">Local feature at each patch</text>
<path d="M308,285 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="265" fill="white" font-family="sans-serif" font-size="17">Similarities or dense head</text>
<text x="352" y="288" fill="white" font-family="sans-serif" font-size="17">Needs coherent local features</text>
<path d="M618,285 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="265" fill="white" font-family="sans-serif" font-size="17">Which patches are the bird?</text>
<text x="662" y="288" fill="white" font-family="sans-serif" font-size="17">Can degrade during training</text>
</svg>
