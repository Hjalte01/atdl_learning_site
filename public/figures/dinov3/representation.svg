<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-label="Patch tokens are vectors; Gram entries are relationships">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Patch tokens are vectors; Gram entries are relationships</text>
<text x="30" y="80" fill="#c5d5ee" font-family="sans-serif" font-size="18">256-PIXEL GLOBAL CROP: patch size 16</text>
<rect x="30" y="95" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="120" fill="white" font-family="sans-serif" font-size="17">16 × 16 patch grid</text>
<text x="42" y="143" fill="white" font-family="sans-serif" font-size="17">P = 256 patch positions</text>
<path d="M308,140 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="95" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="120" fill="white" font-family="sans-serif" font-size="17">Feature matrix X: 256 × 4096</text>
<text x="352" y="143" fill="white" font-family="sans-serif" font-size="17">Normalize rows to unit length</text>
<path d="M618,140 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="95" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="120" fill="white" font-family="sans-serif" font-size="17">G = X Xᵀ: 256 × 256</text>
<text x="662" y="143" fill="white" font-family="sans-serif" font-size="17">Not a 4096 × 4096 matrix</text>
<text x="30" y="225" fill="#c5d5ee" font-family="sans-serif" font-size="18">ONE ENTRY: row i, column j</text>
<rect x="30" y="240" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="265" fill="white" font-family="sans-serif" font-size="17">Patch i vector xᵢ</text>
<text x="42" y="288" fill="white" font-family="sans-serif" font-size="17">Patch j vector xⱼ</text>
<path d="M308,285 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="240" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="265" fill="white" font-family="sans-serif" font-size="17">Gᵢⱼ = xᵢ · xⱼ</text>
<text x="352" y="288" fill="white" font-family="sans-serif" font-size="17">Cosine similarity in [−1,1]</text>
<path d="M618,285 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="240" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="265" fill="white" font-family="sans-serif" font-size="17">Diagonal entries = 1</text>
<text x="662" y="288" fill="white" font-family="sans-serif" font-size="17">No semantic labels given</text>
<text x="30" y="370" fill="#c5d5ee" font-family="sans-serif" font-size="18">EXCLUDED FROM THIS MATRIX</text>
<rect x="30" y="385" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="410" fill="white" font-family="sans-serif" font-size="17">CLS: image representation</text>
<text x="42" y="433" fill="white" font-family="sans-serif" font-size="17">Registers: 4 extra tokens</text>
<path d="M308,430 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="385" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="410" fill="white" font-family="sans-serif" font-size="17">Gram uses patch features</text>
<text x="352" y="433" fill="white" font-family="sans-serif" font-size="17">Global crops only</text>
<path d="M618,430 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="385" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="410" fill="white" font-family="sans-serif" font-size="17">Match all patch pairs</text>
<text x="662" y="433" fill="white" font-family="sans-serif" font-size="17">Not only spatial neighbors</text>
</svg>
