<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="A latent is a distribution during VAE encoding">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">A latent is a distribution during VAE encoding</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY · one latent coordinate, one reparameterized sample</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">A: μ = 1, σ = 0.5</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Variance = 0.25</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">B: ε = −2</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">z = 1 + 0.5(−2) = 0</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">C: Bernoulli output 0.8</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">For observed bit x = 1</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">LOSS · one-sample reconstruction estimate + analytic KL</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Reconstruction: −log 0.8</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">≈ 0.2231 nats</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">KL to Normal(0,1)</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">≈ 0.8181 nats</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Estimated negative ELBO</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">≈ 1.0413 nats</text>
</svg>