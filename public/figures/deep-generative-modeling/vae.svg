<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="VAE: the encoder helps training; the prior starts generation">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">VAE: the encoder helps training; the prior starts generation</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN · x ∈ ℝᴰ, latent z ∈ ℝᴹ; M may be smaller than D</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">A: encoder qφ(z|x)</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Outputs μ and positive σ</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">B: z = μ + σ ⊙ ε</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Independent ε ~ N(0,I)</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">C: decoder pθ(x|z)</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Outputs likelihood parameters</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">LOSS · reconstruction through C, prior penalty at A</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">−E log pθ(x|z)</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Match the observed x</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">KL(qφ(z|x) || p(z))</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Compare latent distributions</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Update φ and θ</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Use reparameterized gradients</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">GENERATE · freeze decoder; encoder is absent</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Draw z ~ p(z)</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">No observed x required</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">C: decode z</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Distribution parameters</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Draw x ~ pθ(x|z)</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Mean ≠ sampled output</text>
</svg>