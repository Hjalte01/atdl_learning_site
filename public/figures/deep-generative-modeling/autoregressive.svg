<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Same network, different information at training and generation">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Same network, different information at training and generation</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN · observed x = (1,0,1); causal mask prevents future access</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Prefix: empty</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">P(x₁=1) = 0.6</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Prefix: (1)</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">P(x₂=0 | 1) = 0.75</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Prefix: (1,0)</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">P(x₃=1 | 1,0) = 0.8</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">GENERATE · freeze θ; sampled prefix becomes the next input</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Sample first symbol</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Carry sampled x₁</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Sample next conditional</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Carry sampled (x₁,x₂)</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Repeat to sequence end</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Toy sequence mass = 0.36</text>
</svg>