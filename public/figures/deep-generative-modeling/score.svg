<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Denoising regression learns a direction; sampling carries a state">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Denoising regression learns a direction; sampling carries a state</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN · fixed σ = 0.5; scalar teaching example</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Clean x = 2; ε = −1</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Noisy input x̃ = 1.5</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Conditional score target</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">−ε/σ = 2</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Predict sθ(x̃)</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Squared error; update θ</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">SAMPLE · freeze θ; fresh noise at each Langevin update</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Current Xₖ</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Evaluate score sθ(Xₖ)</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Xnext = Xₖ + h sθ(Xₖ)</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Add √(2h) ξₖ</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Carry Xnext forward</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Repeat; finite-step bias remains</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">ORACLE TRACE · Normal(0,1), score = −X; h = 0.1; ξ = 0</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">X₀ = 2</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">X₁ = 1.8</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">X₂ = 1.62</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">X₃ = 1.458</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Drift-only illustration</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Zero noise is not a sampler</text>
</svg>