<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="The reverse loop changes state, not network weights">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">The reverse loop changes state, not network weights</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">ONE ITERATION · from time t to time t − 1</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Current state xₜ and t</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">C: predict εθ(xₜ,t)</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">E: convert noise to μθ</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Use αₜ, βₜ and ᾱₜ</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Sample xₜ₋₁ = μθ + σₜz</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">z fresh; zero at t = 1</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">REPEAT · output becomes the next input</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">xT → xT₋₁</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Start near pure noise</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">… → x₂ → x₁</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Reuse the same network</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">x₁ → displayed x₀</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">No final random increment</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">OPTIONAL PREVIEW · distinct from the next state</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">C: predicted noise</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Combine with current xₜ</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Estimate clean x̂₀</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Eq. 15; may amplify errors</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Not a full sampler</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Do not replace xₜ₋₁ with x̂₀</text>
</svg>