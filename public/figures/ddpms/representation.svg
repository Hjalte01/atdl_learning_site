<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Image-shaped states, changing information">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Image-shaped states, changing information</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TEACHING NOISE LEVELS · cumulative retained signal ᾱ</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">ᾱ = 1</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Signal 1; noise 0</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">ᾱ = 0.64</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Signal 0.8; noise 0.6</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">ᾱ = 0.01</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Signal 0.1; noise ≈ 0.995</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">SAME DIMENSIONS · no autoencoder compression</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">x₀: clean pixels</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">H × W × C</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">xₜ: noisy pixels</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">H × W × C</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">xT: near Gaussian</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">H × W × C</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">DO NOT CONFUSE · variance factors and amplitudes</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">βₜ: one-step noise variance</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">αₜ = 1 − βₜ</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">ᾱₜ: product of α values</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Accumulates corruption</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Square roots: amplitudes</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Not pixels replaced</text>
</svg>