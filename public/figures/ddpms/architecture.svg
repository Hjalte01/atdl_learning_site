<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="One shared noise predictor, two uses of its output">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">One shared noise predictor, two uses of its output</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAINING · image tensors retain H × W × C coordinates</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">A: clean image x₀</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Pixels scaled to [−1,1]</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">B: fixed corruption</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Add known Gaussian noise</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">C: noise predictor εθ</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Input: xₜ and time t</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">C · FUNCTIONAL U-NET · weights shared across all times</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Down / up feature paths</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Group normalization</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Sinusoidal time embedding</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Attention at 16 × 16</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Image-shaped prediction</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Same shape as xₜ</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">OUTPUT BRANCHES · loss versus state update</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">C: predicted noise</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">One output tensor</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">D: training squared error</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Update network weights</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">E: reverse mean + noise</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Update state; freeze weights</text>
</svg>