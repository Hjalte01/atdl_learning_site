<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">03 / Two coordinates, two questions</title><desc id="d">Toy information plane; rising then leftward trajectory is schematic.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">03 / Two coordinates, two questions</text><path d="M95 365 L850 365" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M95 365 L95 85" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="560" y="410" font-size="19">I(X; T): retained input bits →</text><text x="112" y="92" font-size="19">I(T; Y): label bits ↑</text><text x="91" y="391" font-size="16">0</text><text x="436" y="391" font-size="16">1</text><text x="781" y="391" font-size="16">2</text><text x="64" y="160" font-size="16">1</text><text x="64" y="370" font-size="16">0</text><circle cx="785" cy="155" r="7" fill="#168373"/><text x="655" y="135" font-size="17">T = X: (2, 1)</text><circle cx="440" cy="155" r="7" fill="#168373"/><text x="370" y="135" font-size="17">T = A: (1, 1)</text><circle cx="440" cy="365" r="7" fill="#168373"/><text x="370" y="345" font-size="17">T = B: (1, 0)</text><circle cx="95" cy="365" r="7" fill="#168373"/><text x="110" y="345" font-size="17">Constant</text><path d="M740 315 C755 265 775 205 710 187 C640 171 550 177 485 182" stroke="#8463b5" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="770" y="265" font-size="18">Fit ↑</text><text x="500" y="225" font-size="18">Then compress ←</text><text x="120" y="300" font-size="17">Illustrative trajectory; not measured data.</text></g></svg>