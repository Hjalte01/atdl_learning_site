<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" role="img" aria-labelledby="t d"><title id="t">05 / Assign inputs by label-distribution similarity</title><desc id="d">IB consistency loop and one provisional numerical assignment.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="480" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">05 / Assign inputs by label-distribution similarity</text><rect x="30" y="90" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="122" font-size="19">Known input rule</text><text x="44" y="152" font-size="16">p(Y = 1 | x) = 0.9</text><path d="M300 133 L350 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="360" y="90" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="374" y="122" font-size="19">Two candidate decoders</text><text x="374" y="152" font-size="16">Group probabilities: 0.9, 0.1</text><path d="M630 133 L670 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="90" width="230" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="694" y="122" font-size="19">KL mismatch</text><text x="694" y="152" font-size="16">0 or 1.758 nats</text><rect x="30" y="275" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="307" font-size="19">Update encoder</text><text x="44" y="337" font-size="16">Assignments: 0.853, 0.147</text><rect x="360" y="275" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="374" y="307" font-size="19">Update group masses</text><text x="374" y="337" font-size="16">p(t) = sum over inputs</text><rect x="680" y="275" width="230" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="694" y="307" font-size="19">Update decoders</text><text x="694" y="337" font-size="16">Mix labels within group</text><path d="M790 185 L790 230" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M790 230 L160 230" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M160 230 L160 265" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M300 318 L350 318" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M630 318 L670 318" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="408" font-size="18">Repeat with updated distributions. Toy: equal initial group masses, β = 1.</text><text x="30" y="446" font-size="18">This is theoretical IB iteration; classifier training uses cross-entropy.</text></g></svg>