<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">01 / Preserve the relevant bit</title><desc id="d">Toy grouping of four equally likely inputs by A; B is independent nuisance.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">01 / Preserve the relevant bit</text><rect x="30" y="95" width="230" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="127" font-size="19">X = (A, B)</text><text x="44" y="157" font-size="16">00 or 01: label 0</text><rect x="30" y="260" width="230" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="292" font-size="19">X = (A, B)</text><text x="44" y="322" font-size="16">10 or 11: label 1</text><path d="M270 138 L340 138" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M270 303 L340 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="95" width="240" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="364" y="127" font-size="19">T = A = 0</text><text x="364" y="157" font-size="16">Forget which B occurred</text><rect x="350" y="260" width="240" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="364" y="292" font-size="19">T = A = 1</text><text x="364" y="322" font-size="16">Forget which B occurred</text><path d="M600 138 L660 138" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M600 303 L660 303" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="95" width="235" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="684" y="127" font-size="19">Predict Y = 0</text><text x="684" y="157" font-size="16">Exactly correct</text><rect x="670" y="260" width="235" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="684" y="292" font-size="19">Predict Y = 1</text><text x="684" y="322" font-size="16">Exactly correct</text><text x="30" y="405" font-size="18">Toy: 2 input bits → 1 representation bit → all 1 label bit retained.</text></g></svg>