<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" role="img" aria-labelledby="t d"><title id="t">02 / Prediction and measurement are different paths</title><desc id="d">Learned classifier trained by cross-entropy; frozen checkpoints analyzed by quantization.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="550" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">02 / Prediction and measurement are different paths</text><rect x="30" y="95" width="230" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="127" font-size="19">A · Batch of inputs</text><text x="44" y="157" font-size="16">m × 12 binary values</text><path d="M270 138 L335 138" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="95" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="127" font-size="19">B · Dense layers</text><text x="359" y="157" font-size="16">Tᵢ: m × dᵢ; learned Wᵢ, bᵢ</text><path d="M605 138 L660 138" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="670" y="95" width="240" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="684" y="127" font-size="19">C · Sigmoid output</text><text x="684" y="157" font-size="16">Predicted label probability</text><rect x="670" y="250" width="240" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="684" y="282" font-size="19">D · Cross-entropy</text><text x="684" y="312" font-size="16">Label → loss → SGD</text><path d="M790 190 L790 240" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="232" font-size="18">Training: SGD updates weights.</text><rect x="30" y="340" width="360" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="372" font-size="19">E · Freeze checkpoint; enumerate X</text><text x="44" y="402" font-size="16">Bin each activation; one tuple per layer</text><path d="M470 185 L470 290" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M470 290 L210 290" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M210 290 L210 330" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M400 383 L540 383" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="550" y="340" width="360" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="564" y="372" font-size="19">F · Joint distributions → information</text><text x="564" y="402" font-size="16">Plot I(X; T) and I(T; Y); compare with IB</text><text x="30" y="477" font-size="19">Inference: fixed A → B → C. No labels, binning, IB solver or optimizer.</text><text x="30" y="519" font-size="18">Green: input / measurement   Purple: predictor   Orange: loss / analysis</text></g></svg>