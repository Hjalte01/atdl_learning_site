<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">04 / Exact values can differ while bins merge</title><desc id="d">Four-bin toy illustration, not the paper’s 30-bin experiment.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">04 / Exact values can differ while bins merge</text><text x="30" y="92" font-size="19">Four equally likely inputs, with labels 0, 0, 1, 1</text><rect x="30" y="125" width="370" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="157" font-size="19">Earlier exact activations</text><text x="44" y="187" font-size="16">−0.75, −0.25, 0.25, 0.75</text><path d="M410 168 L500 168" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="510" y="125" width="395" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="524" y="157" font-size="19">Four occupied bins</text><text x="524" y="187" font-size="16">Each has probability ¼; entropy = 2 bits</text><rect x="30" y="255" width="370" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="287" font-size="19">Later exact activations</text><text x="44" y="317" font-size="16">−0.90, −0.80, 0.80, 0.90</text><path d="M410 298 L500 298" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="510" y="255" width="395" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="524" y="287" font-size="19">Two occupied bins</text><text x="524" y="317" font-size="16">Each has probability ½; entropy = 1 bit</text><text x="30" y="385" font-size="18">Toy bin edges: −1, −0.5, 0, 0.5, 1. Label information stays 1 bit.</text><text x="30" y="418" font-size="18">All four exact values stay distinct: exact input information stays 2 bits.</text></g></svg>