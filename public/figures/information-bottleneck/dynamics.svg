<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">06 / Carry weights forward; measure at checkpoints</title><desc id="d">Directed early updates versus fluctuation-dominated late updates.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">06 / Carry weights forward; measure at checkpoints</text><rect x="30" y="90" width="265" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="122" font-size="19">Current weights θₖ</text><text x="44" y="152" font-size="16">Draw a training minibatch</text><path d="M305 133 L345 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="355" y="90" width="265" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="369" y="122" font-size="19">Gradient g = μ + ξ</text><text x="369" y="152" font-size="16">Mean plus batch fluctuation</text><path d="M630 133 L670 133" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="90" width="230" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="694" y="122" font-size="19">Next weights θₖ₊₁</text><text x="694" y="152" font-size="16">θₖ − ηg; repeat</text><text x="30" y="230" font-size="21">Early: drift dominates</text><text x="490" y="230" font-size="21">Late: fluctuations dominate</text><path d="M40 290 L125 290" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M135 290 L220 290" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M230 290 L315 290" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M505 290 L570 265" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M570 265 L550 315" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M550 315 L625 295" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M625 295 L600 335" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="30" y="370" font-size="18">Toy step: mean 0.01; STD 0.001</text><text x="490" y="370" font-size="18">Toy step: mean 0.0001; STD 0.002</text><text x="30" y="417" font-size="18">Noise-dominated does not mean frozen weights or guaranteed useful compression.</text></g></svg>