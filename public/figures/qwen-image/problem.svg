<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t d"><title id="t">01 / Three tests for the same poster</title><desc id="d">Schematic goals: symbols, instruction, and preservation.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="440" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">01 / Three tests for the same poster</text><rect x="30" y="115" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="147" font-size="19">Spell the words</text><text x="44" y="177" font-size="16">OPEN AT NINE</text><rect x="340" y="115" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="354" y="147" font-size="19">Follow the edit</text><text x="354" y="177" font-size="16">Change the lettering</text><rect x="650" y="115" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="147" font-size="19">Preserve the scene</text><text x="664" y="177" font-size="16">Keep cup and lighting</text><text x="30" y="285" font-size="19">Beautiful pixels can contain wrong letters. Correct edits can lose details.</text><text x="30" y="335" font-size="19">Data coverage → latent generation → faithful decoding all matter.</text><text x="30" y="401" font-size="18">Teaching scenario. No image model outputs or benchmark measurements.</text></g></svg>