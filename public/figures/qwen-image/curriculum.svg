<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" role="img" aria-labelledby="t d"><title id="t">09 / Teach coverage, context, and layout</title><desc id="d">Two complementary progressions; columns are not synchronized training stages.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="510" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">09 / Teach coverage, context, and layout</text><rect x="30" y="105" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="137" font-size="19">256 × 256</text><text x="44" y="167" font-size="16">Learn broad visual structure</text><path d="M300 148 L335 148" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="105" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="359" y="137" font-size="19">640 × 640</text><text x="359" y="167" font-size="16">Increase detail</text><path d="M605 148 L640 148" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="105" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="664" y="137" font-size="19">1328 × 1328</text><text x="664" y="167" font-size="16">Refine high-resolution data</text><rect x="30" y="285" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="317" font-size="19">Pure rendering</text><text x="44" y="347" font-size="16">Text on clean backgrounds</text><rect x="345" y="285" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="317" font-size="19">Text in context</text><text x="359" y="347" font-size="16">Compositional rendering</text><rect x="650" y="285" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="317" font-size="19">Complex rendering</text><text x="664" y="347" font-size="16">Structured templates</text><text x="30" y="433" font-size="18">Schematic: multiple aspect ratios, stricter filtering, and balanced sampling.</text><text x="30" y="476" font-size="18">The report does not equate the three synthesis types with these resolutions.</text></g></svg>