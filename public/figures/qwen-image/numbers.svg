<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 465" role="img" aria-labelledby="t d"><title id="t">05 / One coordinate through the flow boxes</title><desc id="d">Synthetic scalar trace, not model inference.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="465" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">05 / One coordinate through the flow boxes</text><rect x="30" y="110" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="142" font-size="19">B · z = 2; ε = 10</text><text x="44" y="172" font-size="16">t = 0.25 gives xₜ = 8</text><path d="M300 153 L335 153" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="110" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="142" font-size="19">C · Predict −7</text><text x="359" y="172" font-size="16">Target z − ε = −8</text><path d="M605 153 L640 153" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="110" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="142" font-size="19">Training error</text><text x="664" y="172" font-size="16">(−7 − (−8))² = 1</text><rect x="30" y="285" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="317" font-size="19">Sampling · xₜ = 8</text><text x="44" y="347" font-size="16">Choose Δt = 0.25</text><path d="M300 328 L335 328" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="285" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="317" font-size="19">Add Δt × prediction</text><text x="359" y="347" font-size="16">8 + 0.25 × (−7)</text><path d="M605 328 L640 328" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="285" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="664" y="317" font-size="19">New state = 6.25</text><text x="664" y="347" font-size="16">Oracle would give 6</text><text x="30" y="431" font-size="18">A supplies fixed h. B is assumed encoded. D is not a scalar identity.</text></g></svg>