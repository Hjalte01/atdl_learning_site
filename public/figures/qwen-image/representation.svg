<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 465" role="img" aria-labelledby="t d"><title id="t">03 / Compression and reconstruction are different jobs</title><desc id="d">Illustrative 256-square input and dimensions calculated from Table 1.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="465" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">03 / Compression and reconstruction are different jobs</text><rect x="30" y="110" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="142" font-size="19">Image · 256 × 256</text><text x="44" y="172" font-size="16">VAE encoder E: ÷8</text><path d="M300 153 L335 153" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="110" width="250" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="359" y="142" font-size="19">Latent · 32 × 32 × 16</text><text x="359" y="172" font-size="16">2 × 2 latent patches</text><path d="M605 153 L640 153" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="110" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="664" y="142" font-size="19">256 image tokens</text><text x="664" y="172" font-size="16">64 values before embedding</text><rect x="30" y="280" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="312" font-size="19">Freeze VAE encoder</text><text x="44" y="342" font-size="16">Shared image/video code</text><path d="M300 323 L335 323" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="280" width="250" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="359" y="312" font-size="19">Adapt image decoder</text><text x="359" y="342" font-size="16">Train on text-rich images</text><path d="M605 323 L640 323" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="280" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="312" font-size="19">Reconstruct fine detail</text><text x="664" y="342" font-size="16">Not a spelling guarantee</text><text x="30" y="435" font-size="18">Top: tensor arithmetic. Bottom: VAE adaptation stage, not all training.</text></g></svg>