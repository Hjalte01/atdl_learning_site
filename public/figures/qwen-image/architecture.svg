<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" role="img" aria-labelledby="t d"><title id="t">02 / Generate an image latent under language guidance</title><desc id="d">Functional T2I architecture; the target state is repeatedly updated.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53677d"/></marker></defs><rect width="940" height="590" rx="18" fill="#f3f6fb"/><g font-family="Arial,sans-serif" fill="#17304b"><text x="28" y="43" font-size="25">02 / Generate an image latent under language guidance</text><rect x="30" y="95" width="260" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="44" y="127" font-size="19">User prompt S</text><text x="44" y="157" font-size="16">Poster with exact text</text><path d="M300 138 L335 138" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="95" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="127" font-size="19">A · Qwen2.5-VL</text><text x="359" y="157" font-size="16">Last hidden states h</text><path d="M470 191 L470 245" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="30" y="255" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="44" y="287" font-size="19">B · State xₜ</text><text x="44" y="317" font-size="16">Patchify latent + time t</text><path d="M300 298 L335 298" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="255" width="250" height="86" rx="12" fill="#ddd9fa" stroke="#71849a"/><text x="359" y="287" font-size="19">C · MMDiT</text><text x="359" y="317" font-size="16">60 blocks · predict velocity</text><path d="M605 298 L640 298" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="255" width="260" height="86" rx="12" fill="#d4eee7" stroke="#71849a"/><text x="664" y="287" font-size="19">Update image state</text><text x="664" y="317" font-size="16">Carry forward to next t</text><path d="M780 351 L780 405" stroke="#53677d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="415" width="260" height="86" rx="12" fill="#ffe6cb" stroke="#71849a"/><text x="664" y="447" font-size="19">D · Image decoder</text><text x="664" y="477" font-size="16">Final latent → pixels</text><text x="30" y="450" font-size="19">Repeat C + update until data endpoint.</text><text x="30" y="490" font-size="18">20B velocity model; 7B condition encoder.</text><text x="30" y="559" font-size="18">Schematic: projections and block internals omitted. Decode after the flow.</text></g></svg>