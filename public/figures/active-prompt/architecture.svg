<svg xmlns="http://www.w3.org/2000/svg" width="960" height="685" viewBox="0 0 960 685" role="img" aria-label="A → B → C → D: select data, then learn prompts">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">A → B → C → D: select data, then learn prompts</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">A · PARALLEL ENCODERS: neither encoder trains</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Image x → frozen image θ</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">I(x) in R^d</text>
<path d="M167,191 V205 H787 V191" fill="none" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Context + class → frozen θ</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">T_c in R^d, c in C</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Cosine / τ → softmax</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">p(x) in R^|C|</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">B · REPRESENT: use p as mixture weights, retain the image</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Sum p_c × T_c</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Weighted text in R^d</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Concatenate [I, weighted T]</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">F_C(x) in R^(2d)</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">K-means on all images</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Representatives → Q_r</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">C · GATE: use the preceding round’s model and data</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">D_(r−1) + prompt t_(r−1)</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Mean confidence per class</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Predicted class + confidence</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Compare with ε_(r,c)</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Below: oracle; else: pseudo</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">Accumulate targets in D_r</text>
<text x="30" y="520" fill="#c5d5ee" font-family="sans-serif" font-size="18">D · LEARN: new prompt becomes next round’s selection model</text>
<rect x="30" y="535" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="560" fill="white" font-family="sans-serif" font-size="17">Randomly reset prompts</text>
<text x="42" y="583" fill="white" font-family="sans-serif" font-size="17">Retain encoder parameters</text>
<path d="M308,580 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="535" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="560" fill="white" font-family="sans-serif" font-size="17">Cross-entropy on all D_r</text>
<text x="352" y="583" fill="white" font-family="sans-serif" font-size="17">Gradient → context vectors</text>
<path d="M618,580 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="535" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="560" fill="white" font-family="sans-serif" font-size="17">New learned prompt t_r</text>
<text x="662" y="583" fill="white" font-family="sans-serif" font-size="17">Return to A next round</text>
</svg>
