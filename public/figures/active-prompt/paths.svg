<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Training and inference use different information">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Training and inference use different information</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">SELECTION: preceding learned prompt is fixed while choosing</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Old prompt + unlabeled pool</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Feature mixtures / clusters</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Q_r + class thresholds</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Oracle or pseudo target</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">D_r grows by B examples</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Keep old assigned targets</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAINING: supervised CE with mixed target provenance</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Reset t_r; frozen encoders</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">All accumulated D_r</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Loss −log p(target | x)</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">No gate confidence weighting</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Update prompt inputs only</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">200 epochs in main setup</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">INFERENCE: classify a new held-out image</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">New image → image encoder</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Final prompt + class names</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Cosine scores → softmax</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Argmax class prediction</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">No clusters or human query</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">No gradient step</text>
</svg>
