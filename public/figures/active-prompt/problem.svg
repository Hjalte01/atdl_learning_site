<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="One candidate need not cost one human annotation">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">One candidate need not cost one human annotation</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">RANDOM + ALL HUMAN: no task-guided selection</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Unlabeled image pool</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Known target class names</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">B random candidates</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Query all B labels</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Train a small prompt</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Human bill = B</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">CB + SQ: task-guided coverage, then an annotation gate</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Image + weighted text</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Class-guided clusters</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">B representative images</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Check class thresholds</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Human or pseudo target</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Human bill ≤ B</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">RISK: saved annotations are not verified labels</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Confident prediction</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Can still be incorrect</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Pseudo target enters D_r</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">May affect next threshold</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Track quality and cost</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">No correctness certificate</text>
</svg>
