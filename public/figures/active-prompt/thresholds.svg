<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Same confidence, different predicted class, different bill">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Same confidence, different predicted class, different bill</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">PREVIOUS TRAINING DATA: average assigned-label probability</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Class A confidences .8, .9</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">ε_A = .85</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Class B confidences .5, .7</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">ε_B = .60</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Includes old pseudo targets</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Threshold is not calibration</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">CANDIDATE GATE: confidence = probability of predicted class</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Predict A with q = .80</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">q &lt; .85 → oracle</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Predict B with q = .80</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">q ≥ .60 → pseudo B</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Predict A with q = .85</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Equality → pseudo A</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">ROUND 1 AND EMPTY CLASSES</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">No previous D_0</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Query every first-round ID</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">If a class has no examples</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Eq. 11 denominator is zero</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">No fallback specified in PDF</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">Do not invent one</text>
</svg>
