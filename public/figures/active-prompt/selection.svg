<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Cluster-balanced means coverage of feature clusters">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Cluster-balanced means coverage of feature clusters</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">ROUND 1: K = B; one centroid-nearest image per cluster</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Cluster members F_C(x)</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Mean → centroid c_i</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Minimize distance to c_i</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Choose a real image x_i*</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">B clusters → B candidates</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">All B receive oracle labels</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY CLUSTER: one-dimensional projection only</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Positions 0, 2, 3</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Centroid = 5/3</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Distances 5/3, 1/3, 4/3</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Choose position 2</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Representative ≠ centroid</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Neither is an oracle label</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">LATER: K = r × B; clusters change with new prompts</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Recluster image set</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Avoid covered clusters</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Intended Q_r size = B</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Favor large uncovered groups</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Clusters ≠ true classes</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">Top-K wording needs care</text>
</svg>
