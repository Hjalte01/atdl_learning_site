<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Weighted centers move before representative selection">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Weighted centers move before representative selection</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TEACHING PROJECTION: one cluster, two positions (not CLIP vectors)</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Position a = 0</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Weight U_a = 1</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Position b = 2</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Weight U_b = 3</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Weighted mean = 1.5</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">(1×0 + 3×2) / 4</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">QUERY THE NEAREST REAL POINT, NOT THE CENTER ITSELF</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Distance from a = 1.5</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Distance from b = .5</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Query image b</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Then reveal its label</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Full CEC: b clusters</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">One representative each</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">DIFFERENT RULE: cluster first, then maximize uncertainty</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Unweighted center = 1</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Different partition geometry</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Highest U in each cluster</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Greedy alternative</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Not CEC selection rule</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">Compare in source Figure 3</text>
</svg>
