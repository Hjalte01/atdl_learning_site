<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="AL state over time: toy 1,000-image initial pool">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">AL state over time: toy 1,000-image initial pool</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">CYCLE 1: choose b = 10; initial D_L is empty</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">D_L = 0; D_U = 1000</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Zero-shot probabilities</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">CEC selects 10 IDs</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Oracle returns 10 targets</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">D_L = 10; D_U = 990</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Reset / train CoOp</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">CYCLE 2: new prompts change probabilities and scores</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Recompute P and Q</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Image encoder stays frozen</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">CEC selects 10 new IDs</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Oracle returns targets</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">D_L = 20; D_U = 980</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Reset / train on all 20</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">CYCLE 6: fixed toy batch size, accumulated supervision</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">60 total queried labels</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">D_U = 940</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">Train on all 60</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">No guaranteed class balance</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Held-out inference</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">No query on test set</text>
</svg>
