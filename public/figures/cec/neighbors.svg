<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Neighborhood uncertainty: an attenuated average">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Neighborhood uncertainty: an attenuated average</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY: k = 2, alpha = 1; distances are squared unit-feature distances</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Neighbor 1</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">distance² = .1</text>
<text x="42" y="171" fill="white" font-family="sans-serif" font-size="17">H-hat = .6</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Neighbor 2</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">distance² = .4</text>
<text x="352" y="171" fill="white" font-family="sans-serif" font-size="17">H-hat = .4</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Weighted contributions</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">.5429 and .2681</text>
<text x="662" y="171" fill="white" font-family="sans-serif" font-size="17">Divide sum by k = 2</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">ADD: no product, threshold or hard outlier veto</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">H_NN = .4055</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Not divided by weight sum</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">Self H-hat = .6365</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">U = 1.0420</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">Uncertain neighborhood</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">Can raise acquisition weight</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">REPRESENTATION: geometry is distinct from class probabilities</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">z = f(x) / norm(f(x))</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Unit image feature in R^d</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">P-hat in R^K</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Estimated class distribution</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Oracle y</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">True target revealed later</text>
</svg>
