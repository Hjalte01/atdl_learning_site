<svg xmlns="http://www.w3.org/2000/svg" width="960" height="685" viewBox="0 0 960 685" role="img" aria-label="CEC architecture: two encoders, one acquisition path">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">CEC architecture: two encoders, one acquisition path</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">A · REPRESENT: image and text meet in a shared feature space</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Image x → frozen f</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">z in R^d; unit norm</text>
<path d="M167,191 V205 H787 V191" fill="none" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Context V + class C_i</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Frozen h → text t_i in R^d</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">Cosine / T → softmax</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">P(x) in R^K; T = .01</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">B · SCORE: labels are still hidden</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Per-class top N in D_U</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">Q(i) → P-hat → H-hat</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">k nearest image features</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Distance-weighted H_NN</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">U = H-hat + H_NN</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">One weight per image</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">C · QUERY: geometry plus uncertainty</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Features + weights U</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">Weighted K-means</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">b centers → b images</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Nearest real image per center</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">Oracle returns true y</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">D_L grows; D_U shrinks</text>
<text x="30" y="520" fill="#c5d5ee" font-family="sans-serif" font-size="18">D · LEARN: labeled route feeds A on the next cycle</text>
<rect x="30" y="535" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="560" fill="white" font-family="sans-serif" font-size="17">All collected (x,y)</text>
<text x="42" y="583" fill="white" font-family="sans-serif" font-size="17">Raw CLIP probabilities P</text>
<path d="M308,580 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="535" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="560" fill="white" font-family="sans-serif" font-size="17">Cross-entropy loss</text>
<text x="352" y="583" fill="white" font-family="sans-serif" font-size="17">Gradient through frozen h</text>
<path d="M618,580 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="535" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="560" fill="white" font-family="sans-serif" font-size="17">Update context V only</text>
<text x="662" y="583" fill="white" font-family="sans-serif" font-size="17">Recompute acquisition</text>
</svg>
