<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Calibration changes relative evidence, not oracle truth">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="white" font-family="sans-serif" font-size="24">Calibration changes relative evidence, not oracle truth</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">Q(i): estimate separately for each class from top N predictions</text>
<rect x="30" y="100" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="125" fill="white" font-family="sans-serif" font-size="17">Class 1: top scores</text>
<text x="42" y="148" fill="white" font-family="sans-serif" font-size="17">Mean Q(1) = .8</text>
<path d="M308,145 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="100" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="125" fill="white" font-family="sans-serif" font-size="17">Class 2: top scores</text>
<text x="352" y="148" fill="white" font-family="sans-serif" font-size="17">Mean Q(2) = .4</text>
<path d="M618,145 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="100" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="125" fill="white" font-family="sans-serif" font-size="17">No labels used</text>
<text x="662" y="148" fill="white" font-family="sans-serif" font-size="17">Q need not sum to 1</text>
<text x="30" y="230" fill="#c5d5ee" font-family="sans-serif" font-size="18">TOY QUERY IMAGE: normalize after dividing by Q</text>
<rect x="30" y="245" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="270" fill="white" font-family="sans-serif" font-size="17">Raw P = (.8, .2)</text>
<text x="42" y="293" fill="white" font-family="sans-serif" font-size="17">H = .5004 nats</text>
<path d="M308,290 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="245" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="270" fill="white" font-family="sans-serif" font-size="17">P / Q = (1, .5)</text>
<text x="352" y="293" fill="white" font-family="sans-serif" font-size="17">Sum = 1.5</text>
<path d="M618,290 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="245" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="270" fill="white" font-family="sans-serif" font-size="17">P-hat = (2/3, 1/3)</text>
<text x="662" y="293" fill="white" font-family="sans-serif" font-size="17">H-hat = .6365 nats</text>
<text x="30" y="375" fill="#c5d5ee" font-family="sans-serif" font-size="18">SAME Q, DIFFERENT IMAGE: entropy need not increase</text>
<rect x="30" y="390" width="275" height="90" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="415" fill="white" font-family="sans-serif" font-size="17">Raw P = (.5, .5)</text>
<text x="42" y="438" fill="white" font-family="sans-serif" font-size="17">H = .6931 nats</text>
<path d="M308,435 H335" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="390" width="275" height="90" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="352" y="415" fill="white" font-family="sans-serif" font-size="17">P / Q = (.625, 1.25)</text>
<text x="352" y="438" fill="white" font-family="sans-serif" font-size="17">Class 2 gains relative weight</text>
<path d="M618,435 H645" stroke="#c5d5ee" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="390" width="275" height="90" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="662" y="415" fill="white" font-family="sans-serif" font-size="17">P-hat = (1/3, 2/3)</text>
<text x="662" y="438" fill="white" font-family="sans-serif" font-size="17">H-hat = .6365 nats</text>
</svg>
