<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Propose → constrain → carry forward">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Propose → constrain → carry forward</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">TRAIN · previous constrained weights Ŵ; input x; target y</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Predict f_Ŵ(x)</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">Evaluate task loss ℓ</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Optimizer step</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Temporary proposal U ∈ ℝⁿ</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Partition ψ(U)</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">m blocks bᵢ ∈ ℝˢ</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">CONSTRAIN · continue these operations each iteration</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Build bank Z ∈ ℝᵏˣˢ</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Zero + sampled blocks</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Nearest motif for each bᵢ</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">M ∈ {1,…,k}ᵐ</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Reconstruct Ŵ = ψ⁻¹(Z[M])</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Carry Ŵ to next train step</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">INFER · freeze final Z and M; no resampling</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">New input x*</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">No training target</text>
<path d="M324,384 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Reconstruct final Ŵ</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Evaluate f_Ŵ(x*)</text>
<path d="M649,384 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Output prediction</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Dense compute need not shrink</text>
</svg>