<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="Smaller pieces allow finer recombination">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Smaller pieces allow finer recombination</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">FIXED n = 16 AND k = 2 · distinct fixed motifs; toy count</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">s = 2; m = 8 positions</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">2⁸ = 256 index strings</text>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Bank stores 4 scalars</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Capacity k/m = 1/4</text>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">8 one-bit indices</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Each block can choose A or B</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">CHANGE BLOCK SIZE · keep n and k fixed</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">s = 4; m = 4 positions</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">2⁴ = 16 index strings</text>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Bank stores 8 scalars</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">Capacity k/m = 1/2</text>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">4 one-bit indices</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Larger coupled weight groups</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">COMPARISON LIMIT</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Capacity is not held fixed</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Neither is total storage</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Duplicate motifs collapse</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">different strings to same array</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">Measure task performance</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Counting is not an accuracy law</text>
</svg>