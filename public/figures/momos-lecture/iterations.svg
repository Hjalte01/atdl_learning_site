<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="The constrained state enters the next step">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">The constrained state enters the next step</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">STEP t · η = 0.1; gradient stipulated for this example</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Start: (0,0,1,1,1,1)</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">g = (−1,−2,1,−1,0,0)</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Proposal blocks</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">(.1,.2), (.9,1.1), (1,1)</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Bank: (0,0), (1,1)</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">Carry: (0,0,1,1,1,1)</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">STEP t+1 · start from that carried state, not the old proposal</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">g = (0,0,−2,−2,−2,−2)</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">Same learning rate</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Proposal blocks</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">(0,0), (1.2,1.2), (1.2,1.2)</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Bank: (0,0), (1.2,1.2)</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">Carry proposal exactly</text>
<text x="30" y="335" fill="#c5d5ee" font-family="sans-serif" font-size="18">WHAT CHANGED?</text>
<rect x="30" y="350" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="377" fill="#fff" font-family="sans-serif" font-size="17">Same mosaic: (1,2,2)</text>
<text x="42" y="401" fill="#fff" font-family="sans-serif" font-size="17">Motif values changed</text>
<rect x="355" y="350" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="377" fill="#fff" font-family="sans-serif" font-size="17">Rebuild inside the loop</text>
<text x="367" y="401" fill="#fff" font-family="sans-serif" font-size="17">Bank is not fixed forever</text>
<rect x="680" y="350" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="377" fill="#fff" font-family="sans-serif" font-size="17">No convergence claim</text>
<text x="692" y="401" fill="#fff" font-family="sans-serif" font-size="17">Toy gradients are assumed</text>
</svg>