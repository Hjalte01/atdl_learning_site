<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Same weight slots; different descriptions">
<rect width="100%" height="100%" fill="#101c30"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c5d5ee"/></marker></defs>
<text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="25">Same weight slots; different descriptions</text>
<text x="30" y="85" fill="#c5d5ee" font-family="sans-serif" font-size="18">DENSE · sixteen blocks, four scalars each</text>
<rect x="30" y="100" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="127" fill="#fff" font-family="sans-serif" font-size="17">Store every block</text>
<text x="42" y="151" fill="#fff" font-family="sans-serif" font-size="17">16 × 4 = 64 scalar values</text>
<path d="M324,134 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="100" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="127" fill="#fff" font-family="sans-serif" font-size="17">Original arrangement</text>
<text x="367" y="151" fill="#fff" font-family="sans-serif" font-size="17">Each location has its values</text>
<path d="M649,134 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="100" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="127" fill="#fff" font-family="sans-serif" font-size="17">Run the predictor</text>
<text x="692" y="151" fill="#fff" font-family="sans-serif" font-size="17">64 slots remain in the model</text>
<text x="30" y="210" fill="#c5d5ee" font-family="sans-serif" font-size="18">MOTIFS · three distinct patterns in sixteen positions</text>
<rect x="30" y="225" width="290" height="68" rx="10" fill="#174c63" stroke="#8299b8"/>
<text x="42" y="252" fill="#fff" font-family="sans-serif" font-size="17">Store A, B, C</text>
<text x="42" y="276" fill="#fff" font-family="sans-serif" font-size="17">3 × 4 = 12 scalar values</text>
<path d="M324,259 H349" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="225" width="290" height="68" rx="10" fill="#493a75" stroke="#8299b8"/>
<text x="367" y="252" fill="#fff" font-family="sans-serif" font-size="17">Store the mosaic</text>
<text x="367" y="276" fill="#fff" font-family="sans-serif" font-size="17">16 indices specify locations</text>
<path d="M649,259 H674" stroke="#c5d5ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="225" width="290" height="68" rx="10" fill="#245546" stroke="#8299b8"/>
<text x="692" y="252" fill="#fff" font-family="sans-serif" font-size="17">Reconstruct the same array</text>
<text x="692" y="276" fill="#fff" font-family="sans-serif" font-size="17">When all blocks match exactly</text>
</svg>